        on_success: next_step
        on_fail: quit_failure
      - id: 3
        name: usp_purge_expired
        subsystem: TSQL
        command: EXEC dbo.usp_purge_expired @retention_days = 400;
        on_success: quit_success
        on_fail: quit_failure
