  - name: UBW Hourly Audit
    owner: OTTERWORKS\svc_ubw_agent
    schedule:
      name: Hourly at minute 05
      freq: hourly
      detail: Every hour at minute 05
      active_start_time: 500
    step_prelude: DECLARE @business_date date = CAST(GETDATE() AS date);
    steps:
      - id: 1
        name: usp_rollup_audit
        subsystem: TSQL
        command: EXEC dbo.usp_rollup_audit @business_date = @business_date;
        on_success: next_step
        on_fail: quit_failure
      - id: 2
        name: usp_build_mart_audit
        subsystem: TSQL
        command: EXEC dbo.usp_build_mart_audit @business_date = @business_date;
        on_success: quit_success
        on_fail: quit_failure
  - name: UBW Weekly Retention
    owner: OTTERWORKS\svc_ubw_agent
    schedule:
      name: Sunday at 03:00
      freq: weekly
      detail: Sunday
      active_start_time: 30000
    step_prelude: DECLARE @business_date date = CAST(DATEADD(day, -1, GETDATE()) AS date);
    steps:
      - id: 1
        name: usp_rollup_retention
        subsystem: TSQL
