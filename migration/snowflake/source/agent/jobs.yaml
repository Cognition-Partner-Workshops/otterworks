    owner: OTTERWORKS\svc_ubw_agent
    schedule:
      name: First day of month at 04:00
      freq: monthly
      detail: Day 1
      active_start_time: 40000
    step_prelude: DECLARE @business_date date = EOMONTH(GETDATE(), -1);
    steps:
      - id: 1
        name: usp_rate_overage
        subsystem: TSQL
        command: EXEC dbo.usp_rate_overage @business_date = @business_date;
        on_success: next_step
        on_fail: quit_failure
