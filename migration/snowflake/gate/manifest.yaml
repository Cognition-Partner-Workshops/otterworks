  - unit: build_capacity_forecast_input
    source_procedure: dbo.usp_build_capacity_forecast_input
    owned_table: mart.mart_capacity_forecast_input
    target_model: MARTS.BUILD_CAPACITY_FORECAST_INPUT
    keys: [business_date, tenant_id, observation_date]
    columns: [plan_tier, peak_storage_mb, bytes_used, seat_count, forecast_bytes_30d]
    business_date_column: business_date
  - unit: build_mart_tenant_usage
    source_procedure: dbo.usp_build_mart_tenant_usage
    owned_table: mart.mart_tenant_usage_daily
    target_model: MARTS.BUILD_MART_TENANT_USAGE
    keys: [business_date, tenant_id]
    columns: [tenant_name, plan_tier, region_code, api_units, compute_units, storage_peak_mb, bytes_used, active_users, document_count, file_count]
    business_date_column: business_date
  - unit: build_mart_plan_seat_summary
    source_procedure: dbo.usp_build_mart_plan_seat_summary
    owned_table: mart.mart_plan_seat_summary
    target_model: MARTS.BUILD_MART_PLAN_SEAT_SUMMARY
    keys: [business_date, plan_tier]
    columns: [tenant_count, seat_count, seat_limit_total, tenants_over_limit, avg_seats_per_tenant]
    business_date_column: business_date
  - unit: build_mart_overage
    source_procedure: dbo.usp_build_mart_overage
    owned_table: mart.mart_overage_charges
    target_model: MARTS.BUILD_MART_OVERAGE
    keys: [business_date, tenant_id]
    columns: [tenant_name, plan_tier, bytes_used, included_bytes, overage_gb, overage_cents_per_gb, overage_cents]
    business_date_column: business_date
  - unit: build_mart_retention
    source_procedure: dbo.usp_build_mart_retention
    owned_table: mart.mart_retention_summary
    target_model: MARTS.BUILD_MART_RETENTION
    keys: [business_date, tenant_id, resource_type, retention_action]
    columns: [item_count]
    business_date_column: business_date
  - unit: build_mart_audit
    source_procedure: dbo.usp_build_mart_audit
    owned_table: mart.mart_audit_rollup
    target_model: MARTS.BUILD_MART_AUDIT
    keys: [business_date, tenant_id, action, resource_type]
    columns: [event_count, distinct_users, first_event_utc, last_event_utc]
    business_date_column: business_date
  - unit: log_run
    source_procedure: dbo.usp_log_run
    owned_table: ops.etl_run_log
    target_model: OPS.LOG_RUN
    keys: [business_date, object_name]
    columns: [object_type, status, rows_written]
    business_date_column: business_date
    source_sql: |
      WITH latest_runs AS (
          SELECT business_date, object_name, object_type, status, rows_written,
                 ROW_NUMBER() OVER (
                     PARTITION BY business_date, object_name ORDER BY run_id DESC
                 ) AS row_number
          FROM ops.etl_run_log
          WHERE business_date = %(business_date)s
            AND object_type = 'procedure'
            AND status = 'succeeded'
      )
      SELECT business_date, object_name, object_type, status, rows_written
      FROM latest_runs
      WHERE row_number = 1
  - unit: purge_expired
    source_procedure: dbo.usp_purge_expired
    owned_table: ops.etl_run_log
    target_model: OPS.PURGE_EXPIRED
    keys: [object_name]
    columns: [retention_cutoff, rows_older_than_cutoff]
    business_date_column: null
    source_sql: |
      WITH cutoff AS (
          SELECT CAST(DATEADD(day, -400, GETDATE()) AS date) AS retention_cutoff
      )
      SELECT 'ops.etl_run_log' AS object_name, cutoff.retention_cutoff,
             COUNT_BIG(log.run_id) AS rows_older_than_cutoff
      FROM cutoff
      LEFT JOIN ops.etl_run_log AS log
        ON log.started_at < cutoff.retention_cutoff
      GROUP BY cutoff.retention_cutoff
      UNION ALL
      SELECT 'ops.agent_job_history', cutoff.retention_cutoff,
             COUNT_BIG(history.instance_id)
      FROM cutoff
      LEFT JOIN ops.agent_job_history AS history
        ON history.run_date < CONVERT(int, CONVERT(char(8), cutoff.retention_cutoff, 112))
      GROUP BY cutoff.retention_cutoff
      UNION ALL
      SELECT 'fact.fact_usage_events', cutoff.retention_cutoff,
             COUNT_BIG(events.event_id)
      FROM cutoff
      LEFT JOIN fact.fact_usage_events AS events
        ON events.business_date < cutoff.retention_cutoff
      GROUP BY cutoff.retention_cutoff
      UNION ALL
      SELECT 'fact.fact_audit_events', cutoff.retention_cutoff,
             COUNT_BIG(events.audit_id)
      FROM cutoff
      LEFT JOIN fact.fact_audit_events AS events
        ON events.business_date < cutoff.retention_cutoff
      GROUP BY cutoff.retention_cutoff
