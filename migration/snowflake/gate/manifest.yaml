# One unit per SQL Server procedure. parity.py pulls `keys` + `columns` from `owned_table`
# on SQL Server and from `target_model` in Snowflake, filtered to the business date through
# `business_date_column` when the unit has one, and compares them row by row.
# Compare columns were written from ESTATE.md before the source DDL landed; parity.py stops
# with a clear error if a listed column is missing on either side.
units:
  - unit: load_dim_date
    source_procedure: dim.usp_load_dim_date
    owned_table: dim.dim_date
    target_model: MARTS.DIM_DATE
    keys: [date_key]
    columns: [calendar_date, year, month, day_of_month, day_of_week, is_month_end]
    business_date_column: null
  - unit: load_dim_tenant
    source_procedure: dim.usp_load_dim_tenant
    owned_table: dim.dim_tenant
    target_model: MARTS.DIM_TENANT
    keys: [tenant_id]
    columns: [tenant_name, plan_code, region_code, status, created_at]
    business_date_column: null
  - unit: load_dim_plan
    source_procedure: dim.usp_load_dim_plan
    owned_table: dim.dim_plan
    target_model: MARTS.DIM_PLAN
    keys: [plan_code]
    columns: [plan_name, tier, monthly_price_cents, included_seats, included_storage_gb]
    business_date_column: null
  - unit: load_dim_user
    source_procedure: dim.usp_load_dim_user
    owned_table: dim.dim_user
    target_model: MARTS.DIM_USER
    keys: [user_id]
    columns: [tenant_id, email, display_name, status, created_at]
    business_date_column: null
  - unit: load_dim_workspace
    source_procedure: dim.usp_load_dim_workspace
    owned_table: dim.dim_workspace
    target_model: MARTS.DIM_WORKSPACE
    keys: [workspace_id]
    columns: [tenant_id, workspace_name, created_at]
    business_date_column: null
  - unit: load_dim_document
    source_procedure: dim.usp_load_dim_document
    owned_table: dim.dim_document
    target_model: MARTS.DIM_DOCUMENT
    keys: [document_id]
    columns: [workspace_id, owner_user_id, title, status, created_at, updated_at]
    business_date_column: null
  - unit: load_dim_file
    source_procedure: dim.usp_load_dim_file
    owned_table: dim.dim_file
    target_model: MARTS.DIM_FILE
    keys: [file_id]
    columns: [workspace_id, owner_user_id, file_name, size_bytes, mime_type, created_at]
    business_date_column: null
  - unit: rollup_storage_daily
    source_procedure: fact.usp_rollup_storage_daily
    owned_table: fact.fact_storage_usage_daily
    target_model: MARTS.ROLLUP_STORAGE_DAILY
    keys: [business_date, tenant_id]
    columns: [file_count, storage_bytes]
    business_date_column: business_date
  - unit: rollup_usage_events
    source_procedure: fact.usp_rollup_usage_events
    owned_table: fact.fact_usage_events
    target_model: MARTS.ROLLUP_USAGE_EVENTS
    keys: [business_date, tenant_id, event_type]
    columns: [event_count, quantity]
    business_date_column: business_date
  - unit: rollup_seats
    source_procedure: fact.usp_rollup_seats
    owned_table: fact.fact_seat_assignments
    target_model: MARTS.ROLLUP_SEATS
    keys: [business_date, tenant_id, workspace_id, user_id]
    columns: [role, is_billable]
    business_date_column: business_date
  - unit: rollup_collab_daily
    source_procedure: fact.usp_rollup_collab_daily
    owned_table: fact.fact_collab_activity_daily
    target_model: MARTS.ROLLUP_COLLAB_DAILY
    keys: [business_date, tenant_id, document_id]
    columns: [comment_count, session_count]
    business_date_column: business_date
  - unit: rollup_audit
    source_procedure: fact.usp_rollup_audit
    owned_table: fact.fact_audit_events
    target_model: MARTS.ROLLUP_AUDIT
    keys: [business_date, tenant_id, action]
    columns: [event_count]
    business_date_column: business_date
  - unit: rollup_document_status
    source_procedure: fact.usp_rollup_document_status
    owned_table: fact.fact_document_status_daily
    target_model: MARTS.ROLLUP_DOCUMENT_STATUS
    keys: [business_date, tenant_id, status]
    columns: [document_count]
    business_date_column: business_date
  - unit: rollup_retention
    source_procedure: fact.usp_rollup_retention
    owned_table: fact.fact_retention_actions
    target_model: MARTS.ROLLUP_RETENTION
    keys: [business_date, tenant_id, action]
    columns: [object_count, total_bytes]
    business_date_column: business_date
  - unit: build_invoice_lines
    source_procedure: fact.usp_build_invoice_lines
    owned_table: fact.fact_invoice_lines
    target_model: MARTS.BUILD_INVOICE_LINES
    keys: [invoice_id, line_number]
    columns: [tenant_id, description, quantity, unit_price_cents, amount_cents]
    business_date_column: business_date
  - unit: rate_overage
    source_procedure: mart.usp_rate_overage
    owned_table: mart.mart_overage_charges
    target_model: MARTS.RATE_OVERAGE
    keys: [business_date, tenant_id, meter]
    columns: [included_quantity, used_quantity, overage_quantity, overage_cents]
    business_date_column: business_date
  - unit: apply_plan_limits
    source_procedure: mart.usp_apply_plan_limits
    owned_table: mart.mart_plan_seat_summary
    target_model: MARTS.APPLY_PLAN_LIMITS
    keys: [business_date, tenant_id]
    columns: [seat_limit, seats_used, seats_over_limit]
    business_date_column: business_date
  - unit: build_capacity_forecast_input
    source_procedure: mart.usp_build_capacity_forecast_input
    owned_table: mart.mart_capacity_forecast_input
    target_model: MARTS.BUILD_CAPACITY_FORECAST_INPUT
    keys: [business_date, tenant_id]
    columns: [storage_bytes, active_users, api_calls]
    business_date_column: business_date
  - unit: build_mart_tenant_usage
    source_procedure: mart.usp_build_mart_tenant_usage
    owned_table: mart.mart_tenant_usage_daily
    target_model: MARTS.BUILD_MART_TENANT_USAGE
    keys: [business_date, tenant_id]
    columns: [plan_code, api_calls, storage_bytes, compute_seconds, active_users]
    business_date_column: business_date
  - unit: build_mart_plan_seat_summary
    source_procedure: mart.usp_build_mart_plan_seat_summary
    owned_table: mart.mart_plan_seat_summary
    target_model: MARTS.BUILD_MART_PLAN_SEAT_SUMMARY
    keys: [business_date, tenant_id]
    columns: [plan_code, tier, seats_used, billable_seats]
    business_date_column: business_date
  - unit: build_mart_overage
    source_procedure: mart.usp_build_mart_overage
    owned_table: mart.mart_overage_charges
    target_model: MARTS.BUILD_MART_OVERAGE
    keys: [business_date, tenant_id, meter]
    columns: [plan_code, overage_cents]
    business_date_column: business_date
  - unit: build_mart_retention
    source_procedure: mart.usp_build_mart_retention
    owned_table: mart.mart_retention_summary
    target_model: MARTS.BUILD_MART_RETENTION
    keys: [business_date, tenant_id]
    columns: [objects_purged, bytes_purged]
    business_date_column: business_date
  - unit: build_mart_audit
    source_procedure: mart.usp_build_mart_audit
    owned_table: mart.mart_audit_rollup
    target_model: MARTS.BUILD_MART_AUDIT
    keys: [business_date, tenant_id, action]
    columns: [event_count, distinct_actors]
    business_date_column: business_date
  - unit: log_run
    source_procedure: ops.usp_log_run
    owned_table: ops.etl_run_log
    target_model: OPS.LOG_RUN
    keys: [business_date, job_name, step_name]
    columns: [status, row_count]
    business_date_column: business_date
  - unit: purge_expired
    source_procedure: ops.usp_purge_expired
    owned_table: ops.parity_watermarks
    target_model: OPS.PURGE_EXPIRED
    keys: [table_name]
    columns: [watermark_date]
    business_date_column: null
