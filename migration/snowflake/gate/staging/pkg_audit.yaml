package: pkg_audit
sqlserver_table: stg.stg_audit_events
snowflake_model: STAGING.STG_AUDIT_EVENTS
keys: [id]
columns:
  - user_id
  - action
  - resource_type
  - resource_id
  - details
  - ip_address
  - user_agent
  - timestamp
  - tenant_id
  - source_system
rename:
  id: audit_id
  timestamp: event_ts_utc
excluded:
  extracted_at: "run timestamp: @[System::StartTime] of the SSIS run vs dbt run_started_at"
