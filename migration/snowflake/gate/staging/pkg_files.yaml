package: pkg_files
sqlserver_table: stg.stg_files
snowflake_model: STAGING.STG_FILES
keys: [id]
columns:
  - name
  - mime_type
  - size_bytes
  - folder_id
  - owner_id
  - workspace_id
  - version
  - is_trashed
  - archived
  - created_at
  - updated_at
  - size_mb
  - tenant_id
  - source_system
excluded:
  extracted_at: "@[System::StartTime], the moment the package (or the dbt view query) ran; differs on every run by design"
