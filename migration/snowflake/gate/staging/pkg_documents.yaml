package: pkg_documents
sqlserver_table: stg.stg_documents
snowflake_model: STAGING.STG_DOCUMENTS
keys: [id]
columns:
  - title
  - content_type
  - owner_id
  - folder_id
  - workspace_id
  - is_deleted
  - is_template
  - archived
  - word_count
  - version
  - created_at
  - updated_at
  - tenant_id
  - source_system
excluded:
  extracted_at: "run timestamp (@[System::StartTime] on SQL Server, dbt run_started_at in Snowflake); differs on every run"
