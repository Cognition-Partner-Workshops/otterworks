version: 2

models:
  - name: stg_documents
    description: Snowflake replacement for SSIS pkg_documents (stg.stg_documents), one row per documents.csv row.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: content_type
        tests: [not_null]
      - name: owner_id
        tests: [not_null]
      - name: workspace_id
        tests: [not_null]
      - name: is_deleted
        tests: [not_null]
      - name: is_template
        tests: [not_null]
      - name: word_count
        tests: [not_null]
      - name: version
        tests: [not_null]
      - name: created_at
        tests: [not_null]
      - name: updated_at
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['document-service']
