version: 2

models:
  - name: stg_file_versions
    description: >
      dbt replacement for pkg_file_versions (stg.stg_file_versions), one row per file version.
      Var pkg_file_versions_cut_at_business_date (default false = legacy) drops versions created
      after the business date; the legacy package loads every version in the extract.
    tests:
      - unique_key_combination:
          arguments:
            columns: [file_id, version]
    columns:
      - name: file_id
        tests: [not_null]
      - name: version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: size_bytes
        tests: [not_null]
      - name: created_by
        tests: [not_null]
      - name: created_at
        description: UTC wall-clock time with the zone marker removed (TIMESTAMP_NTZ), as the package lands it.
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [file-service]
