version: 2

models:
  - name: stg_collab_events
    description: Snowflake replacement for SSIS pkg_collaboration (stg.stg_collab_events), one row per collab_events.csv row.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['comment', 'session_join', 'session_leave']
      - name: document_id
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: created_at
        tests: [not_null]
      - name: extracted_at
        tests: [not_null]
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['collab-service']
