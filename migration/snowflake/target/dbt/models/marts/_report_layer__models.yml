version: 2
models:
- name: rollup_seats
  tests:
  - unique_key_combination:
      arguments:
        columns:
        - business_date
        - tenant_id
  columns:
  - name: business_date
    tests:
    - not_null
  - name: tenant_id
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_tenant')
          field: tenant_id
  - name: plan_tier
    tests:
    - accepted_values:
        arguments:
          values: &id001
          - starter
          - growth
          - scale
  - name: seat_count
    tests:
    - not_null
