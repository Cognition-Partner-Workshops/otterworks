name: ubw
version: "1.0.0"
config-version: 2
profile: ubw
model-paths: ["models"]
macro-paths: ["macros"]
target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  ubw:
    +materialized: table
    +schema: MARTS
    staging:
      +materialized: view
      +schema: STAGING
    ops:
      +schema: OPS
    reports:
      +materialized: view
      +schema: REPORTS
      +grants:
        select: ["{{ target.database ~ '_READER' }}"]

on-run-end:
  - "{{ grant_reports_schema_to_reader() }}"
