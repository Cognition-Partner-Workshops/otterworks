[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-loader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyarrow>=22,<24", "duckdb>=1.4,<2", "oracledb>=3.4,<5"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.17,<5"]
dev = ["pytest>=8,<9", "ruff==0.9.10"]

[tool.setuptools.packages.find]
include = ["loader*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
