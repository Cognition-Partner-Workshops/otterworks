# SonarQube Community for producing a third-party scanner export locally.
#   docker compose -f security/ingest/docker-compose.sonarqube.yml -p "$RUN_TOKEN" up -d sonarqube
#   docker compose -f security/ingest/docker-compose.sonarqube.yml -p "$RUN_TOKEN" run --rm scanner
#   docker compose -f security/ingest/docker-compose.sonarqube.yml -p "$RUN_TOKEN" down -v
# SONAR_TOKEN is a local user token minted against this container; it never leaves the machine.
services:
  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"UP\"'"]
      interval: 10s
      retries: 30

  scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: ["scan"]
    network_mode: host
    environment:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_TOKEN: ${SONAR_TOKEN:?mint a token first}
    volumes:
      - ../..:/usr/src:ro
    command:
      - -Dsonar.projectKey=otterworks
      - -Dsonar.sources=.
      - -Dsonar.working.directory=/tmp/scannerwork
      - -Dsonar.exclusions=**/node_modules/**,**/*.min.js,**/vendor/**
      - -Dsonar.java.binaries=/tmp
      - -Dsonar.scm.disabled=true
