server:
  address: 127.0.0.1
  port: ${API_PORT:19080}
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:52206/FREEPDB1}
    username: ${DB_USER:annuity_inq}
    password: ${DB_PASSWORD:annuity_inq} # gitleaks:allow
    hikari:
      connection-timeout: 2000
      initialization-fail-timeout: -1
iri:
  provisional:
    summary:
      carrier-id: SYNANN # S-03
      issue-type: GUARANTEED # S-04
      refresh-time-source: response-time-utc # S-05
      product-types: # S-06
        FIXED: FIXED
        FLEX: DEFERRED
      plan-code-source: PLAN_CODE # S-07
    values:
      withdrawal-source: WITHDRAWALS_TO_DATE # S-12: confirm gross vs net
    funds:
      account-type: OTHER # S-13
      valuation-date-source: policy_values.valuation_date # S-14
