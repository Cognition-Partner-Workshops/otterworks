entries:
- operation: summary
  db: annuity_policy.CONTRACT_NO
  legacy_field: CNTR_NO
  legacy_format: digits, no padding
  iri_element: path:policyNumber
  iri_type_constraint: string
  rule: contract_number
  status: mapped
  signoff_id: null
  note: 'C-2: policyNumber is a path parameter only'
- operation: values
  db: policy_values.CONTRACT_NO
  legacy_field: CNTR_NO
  legacy_format: 10-digit zero padded
  iri_element: path:policyNumber
  iri_type_constraint: string
  rule: contract_number
  status: mapped
  signoff_id: null
  note: 'IRI-01: canonicalize padded values contract number; C-2: never echo policyNumber in body'
