version: 1
status_codes:
  '00': 200
  '04': 404
  08: 400
  '96': 503
rules:
  identity:
    kind: identity
  status:
    kind: status
  policy-number:
    kind: integer
  date:
    kind: date
    input: YYYYMMDD
    output: YYYY-MM-DD
  decimal-2:
    kind: decimal
    scale: 2
  decimal-6:
    kind: decimal
    scale: 6
  integer:
    kind: integer
  policy-status:
    kind: enum
    values:
      IF: ACTIVE
      LP: LAPSED
      SR: SURRENDERED
      TM: TERMINATED
      PI: PENDINGISSUED
  qualification:
    kind: enum
    values:
      NQ: Non-Qualified
      IRA: IRA
      ROTH: Roth IRA
  page-count:
    kind: page-count
  page-start:
    kind: page-start
  config:
    kind: config
  container:
    kind: container
  unresolved:
    kind: unresolved
