  legacy_field: STAT_CD
  legacy_format: code
  iri_element: /policyStatus
  iri_type_constraint: IRI policyStatus enum
  rule: enum_map
  status: signoff
  signoff_id: S-02
  note: 'IRI-02: DP has no IRI value; return 422 policy.status.unmapped'
  map:
    IF: ACTIVE
    PI: PENDINGISSUED
    LP: LAPSED
    SR: SURRENDERED
    TM: TERMINATED
    DP: null
  signoff_values:
  - DP
