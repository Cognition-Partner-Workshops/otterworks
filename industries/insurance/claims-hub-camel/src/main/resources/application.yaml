spring:
  application:
    name: claims-hub-camel
  datasource:
    # ClaimsCore, where sp_ClaimsDb_RosterQuery_WcfSql ran dbo.usp_GetAdjusterRoster.
    url: jdbc:postgresql://localhost:5432/claimscore
    username: claimshub
camel:
  springboot:
    name: claims-hub
    main-run-controller: true
claimshub:
