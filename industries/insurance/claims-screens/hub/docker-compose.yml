# The claims-hub-camel's backing systems for a local corpus replay. Project name claims-screens; `./hub.sh down` removes all of it.
name: claims-screens
services:
  postgres:
    # Stands in for PolicyAdmin, ClaimsCore and ClaimsLedger behind the WCF-SQL ports.
    image: mirror.gcr.io/library/postgres:16
    environment:
      POSTGRES_DB: claimshub
      POSTGRES_USER: claimshub
      POSTGRES_PASSWORD: claimshub
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimshub -d claimshub"]
      interval: 2s
      retries: 30
  mailhog:
    # sp_Adjuster_AssignmentNotice_SMTP and sp_Ops_PaymentHeld_SMTP
    image: mirror.gcr.io/mailhog/mailhog:v1.0.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  vendor-sftp:
    # sp_PaymentVendor_Remittance_SFTP; the vendor's inbound folder is bind-mounted so the API can read what arrived.
    image: mirror.gcr.io/atmoz/sftp:alpine
    command: thistlecombe-remit::1001:100:inbound
    volumes:
      - ./run/keys/id_rsa.pub:/home/thistlecombe-remit/.ssh/keys/id_rsa.pub:ro
      - ./run/vendor-inbox:/home/thistlecombe-remit/inbound/thistlecombe
    ports: ["127.0.0.1:2222:22"]
