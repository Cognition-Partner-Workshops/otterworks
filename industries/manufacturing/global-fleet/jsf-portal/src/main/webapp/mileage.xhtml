<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Reisekosten (Dienstreise-km)</ui:define>
    <ui:define name="content">
        <f:metadata>
            <f:viewParam name="employee" value="#{mileage.employeeNo}"/>
            <f:viewAction action="#{mileage.load}"/>
        </f:metadata>
        <h:form styleClass="panel">
            <p><label>Personalnummer</label><h:inputText value="#{mileage.employeeNo}"/>
               <h:commandButton value="Suchen" action="#{mileage.find}"/>
               <h:outputText value=" #{mileage.employee.fullName}" rendered="#{mileage.employee != null}"/></p>
            <h:panelGroup rendered="#{mileage.employee != null}">
                <p><label>Datum</label><h:inputText value="#{mileage.claimDate}"><f:convertDateTime pattern="dd.MM.yyyy"/></h:inputText></p>
                <p><label>Kilometer</label><h:inputText value="#{mileage.km}" size="6"/>
                   <h:commandButton value="Berechnen" action="#{mileage.calculate}"/>
                   <h:outputText value=" = #{mileage.preview} EUR (#{mileage.rate} EUR/km)" rendered="#{mileage.preview != null}"/></p>
                <p><label>Anlass</label><h:inputText value="#{mileage.purpose}" size="40"/></p>
                <h:commandButton value="Einreichen" action="#{mileage.submit}"/>
            </h:panelGroup>
        </h:form>
        <h:dataTable value="#{mileage.claims}" var="c" styleClass="grid" rendered="#{not empty mileage.claims}">
            <h:column><f:facet name="header">Datum</f:facet><h:outputText value="#{c.claimDate}"><f:convertDateTime pattern="dd.MM.yyyy"/></h:outputText></h:column>
            <h:column><f:facet name="header">km</f:facet>#{c.km}</h:column>
            <h:column><f:facet name="header">Anlass</f:facet>#{c.purpose}</h:column>
            <h:column><f:facet name="header">Betrag EUR</f:facet>#{c.amount}</h:column>
            <h:column><f:facet name="header">Status</f:facet>#{c.status}</h:column>
        </h:dataTable>
    </ui:define>
</ui:composition>
