server {
    listen 8080;
    server_name _;
    root /srv/mainframe;
    charset utf-8;

    location = /health { access_log off; return 200 "ok\n"; }

    location / {
        limit_except GET HEAD { deny all; }
        autoindex on;
        autoindex_exact_size on;
        default_type text/plain;
        types { text/plain ddl dlg rec map ads cbl cpy jcl cnt md txt sha256; application/octet-stream dat; }
    }
}
