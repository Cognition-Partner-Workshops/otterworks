spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/domain
      - classpath:db/migration/eligibility
      - classpath:db/migration/assignment
      - classpath:db/migration/returns
      - classpath:db/migration/mileage
      - classpath:db/migration/benefit

management:
  endpoints:
    web:
      exposure:
        include: health
