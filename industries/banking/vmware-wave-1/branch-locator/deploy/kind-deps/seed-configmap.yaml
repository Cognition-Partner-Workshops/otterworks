# Copy of data/seed.sql for the kind PostgreSQL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-seed
data:
  01-seed.sql: |
    -- Shared seed for the wave-1 applications. The VM-style stack and the replatformed
    -- applications load the same rows, so before and after compare like for like.
    CREATE TABLE accounts (account_id VARCHAR(20) PRIMARY KEY, holder VARCHAR(80) NOT NULL, kind VARCHAR(10) NOT NULL);
    CREATE TABLE statement_lines (id SERIAL PRIMARY KEY, account_id VARCHAR(20) REFERENCES accounts, booked DATE NOT NULL, description VARCHAR(60) NOT NULL, amount NUMERIC(12,2) NOT NULL, balance NUMERIC(12,2) NOT NULL);
    CREATE TABLE branches (branch_id SERIAL PRIMARY KEY, name VARCHAR(60) NOT NULL, address VARCHAR(120) NOT NULL, lat NUMERIC(8,5), lon NUMERIC(8,5), opens VARCHAR(5), closes VARCHAR(5));
