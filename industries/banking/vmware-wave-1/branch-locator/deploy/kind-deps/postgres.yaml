# Throwaway PostgreSQL for the kind run, loaded with data/seed.sql (copy in
# seed-configmap.yaml). Trust auth: the only client is the app under test,
# which sends the kind-only password from kind-secrets.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: bankwave}
            - {name: POSTGRES_USER, value: branch_app}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "branch_app", "-d", "bankwave"]
            periodSeconds: 3
          volumeMounts:
            - {name: seed, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: seed
          configMap: {name: postgres-seed}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
