# /etc/httpd/conf.d/fx-report.conf on report-01
LoadModule cgi_module modules/mod_cgi.so
<IfModule !ssl_module>
    LoadModule ssl_module modules/mod_ssl.so
</IfModule>
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so
LoadModule expires_module modules/mod_expires.so

# Desk passwords only travel over TLS: the directory is searched and bound
# over ldaps:// against the directory CA, and plain-HTTP requests are refused
# before Apache asks for a password.
LDAPTrustedGlobalCert CA_BASE64 /etc/pki/tls/certs/directory-ca.pem
LDAPVerifyServerCert On

ScriptAlias /fx/ /var/www/fx-report/cgi-bin/
<Directory "/var/www/fx-report/cgi-bin">
    Options +ExecCGI
    SSLRequireSSL
    AuthType Basic
    AuthName "FX desk"
    AuthBasicProvider ldap
    AuthLDAPURL "ldaps://ldap.bank.internal/ou=people,dc=bank,dc=internal?uid"
    Require ldap-group cn=fx-desk,ou=groups,dc=bank,dc=internal
    ExpiresActive On
    ExpiresDefault "access plus 1 hour"
</Directory>
