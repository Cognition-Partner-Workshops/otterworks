app: statements-web
owner: retail-platform
costCenter: banking-wave1
replicas: 1
containerPort: 8080
env:
  TZ: Etc/UTC
  CONFIG_FILE: /etc/app/statements.properties
  JDBC_URL: jdbc:postgresql://statements-db.database:5432/bankwave
secretEnv:
  DB_USER:
    secret: statements-db
    key: username
  DB_PASSWORD:
    secret: statements-db
    key: password
configFiles:
  statements.properties: |
    statement.page.size=50
writablePaths:
  - /tmp
  - /usr/local/tomcat/work
  - /usr/local/tomcat/temp
probes:
  path: /health
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
networkPolicy:
  allowSameNamespace: false
