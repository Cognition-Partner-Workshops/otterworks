server.port=8443
server.ssl.enabled=true
server.ssl.key-store=/etc/kyc/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=kyc
kyc.upload-dir=/var/kyc/uploads
spring.servlet.multipart.max-file-size=10MB
logging.file.name=/var/log/kyc/kyc-docs.log
management.endpoints.web.exposure.include=health,prometheus
management.server.port=8081
management.server.ssl.enabled=false
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,1500ms,2s,3s,5s,10s
management.metrics.tags.application=kyc-docs
