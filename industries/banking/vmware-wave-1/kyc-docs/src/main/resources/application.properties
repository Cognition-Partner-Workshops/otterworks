# Plain HTTP; TLS terminates at the shared ingress.
server.port=${PORT:8080}
# Document storage: s3 (production) or fs (a local directory, e.g. an emptyDir).
kyc.store=${KYC_STORE:s3}
kyc.upload-dir=${KYC_UPLOAD_DIR:/tmp/kyc-uploads}
kyc.s3.bucket=${KYC_S3_BUCKET:}
kyc.s3.prefix=${KYC_S3_PREFIX:}
kyc.s3.region=${AWS_REGION:us-east-1}
kyc.s3.endpoint=${KYC_S3_ENDPOINT:}
kyc.s3.path-style=${KYC_S3_PATH_STYLE:false}
kyc.s3.create-bucket=${KYC_S3_CREATE_BUCKET:false}
spring.servlet.multipart.max-file-size=10MB
