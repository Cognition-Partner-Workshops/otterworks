server.port=8443
server.ssl.enabled=true
server.ssl.key-store=/etc/kyc/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=kyc
kyc.upload-dir=/var/kyc/uploads
spring.servlet.multipart.max-file-size=10MB
logging.file.name=/var/log/kyc/kyc-docs.log
kyc.auth.uploader.username=${KYC_UPLOADER_USERNAME:}
kyc.auth.uploader.password-hash=${KYC_UPLOADER_PASSWORD_HASH:}
kyc.auth.reviewer.username=${KYC_REVIEWER_USERNAME:}
kyc.auth.reviewer.password-hash=${KYC_REVIEWER_PASSWORD_HASH:}
kyc.auth.uploader.customers=${KYC_UPLOADER_CUSTOMERS:}
kyc.auth.reviewer.customers=${KYC_REVIEWER_CUSTOMERS:}
