apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: deps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: s3
          image: mirror.gcr.io/motoserver/moto:5.1.0
          command: [moto_server, -H, "0.0.0.0", -p, "9000"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: synthetic-kind-kyc
            - name: AWS_SECRET_ACCESS_KEY
              value: synthetic-kind-only-not-a-real-secret
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - containerPort: 9000
          lifecycle:
            postStart:
              exec:
                command:
                  - python
                  - -c
                  - |
                    import boto3, time
                    s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:9000")
                    for attempt in range(60):
                        try:
                            s3.create_bucket(Bucket="kyc-docs")
                            break
                        except Exception:
                            if attempt == 59:
                                raise
                            time.sleep(1)
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - 'import boto3; boto3.client("s3", endpoint_url="http://127.0.0.1:9000").head_bucket(Bucket="kyc-docs")'
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: deps
spec:
  type: ClusterIP
  selector:
    app: s3
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
