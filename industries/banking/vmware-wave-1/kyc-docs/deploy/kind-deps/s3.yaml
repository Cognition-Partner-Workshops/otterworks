# Throwaway in-memory S3 stand-in for the kind run (kyc-docs' values-ci.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels: {app: s3}
  template:
    metadata:
      labels: {app: s3}
    spec:
      containers:
        - name: s3
          image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          command: ["python3", "-u", "/stub/s3stub.py", "9000"]
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 2
          volumeMounts:
            - {name: stub, mountPath: /stub}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: stub
          configMap: {name: s3stub}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app: s3}
  ports:
    - port: 9000
      targetPort: 9000
