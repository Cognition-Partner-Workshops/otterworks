[project]
name = "carrier-sast-export"
version = "1.0.0"
description = "Runs Semgrep over a path list at one commit and writes a SARIF 2.1.0 export stamped as CarrierSAST."
requires-python = ">=3.12"
dependencies = [
    "semgrep==1.180.0",
    "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
