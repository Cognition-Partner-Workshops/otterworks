apiVersion: v1
kind: Namespace
metadata:
  name: cloud-control
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: cloud-control
  labels: {fixture-role: client, fixture-access: approved}
spec:
  automountServiceAccountToken: false
  containers:
    - name: synthetic-client
      image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      command: [python3, -c, "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: observer
  namespace: cloud-control
  labels: {fixture-role: client}
spec:
  automountServiceAccountToken: false
  containers:
    - name: synthetic-client
      image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      command: [python3, -c, "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: documents
  namespace: cloud-control
  labels: {fixture-app: documents}
spec:
  automountServiceAccountToken: false
  containers:
    - name: synthetic-server
      image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      command: [python3, -m, http.server, "8080"]
      readinessProbe: {tcpSocket: {port: 8080}}
---
apiVersion: v1
kind: Pod
metadata:
  name: audit
  namespace: cloud-control
  labels: {fixture-app: audit}
spec:
  automountServiceAccountToken: false
  containers:
    - name: synthetic-server
      image: docker.io/library/python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      command: [python3, -m, http.server, "8080"]
      readinessProbe: {tcpSocket: {port: 8080}}
