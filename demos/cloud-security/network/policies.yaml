apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cloud-control
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: approved-client-to-documents
  namespace: cloud-control
spec:
  podSelector:
    matchLabels: {fixture-role: client, fixture-access: approved}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {fixture-app: documents}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: documents-from-approved-clients
  namespace: cloud-control
spec:
  podSelector:
    matchLabels: {fixture-app: documents}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {fixture-role: client, fixture-access: approved}
      ports:
        - protocol: TCP
          port: 8080
