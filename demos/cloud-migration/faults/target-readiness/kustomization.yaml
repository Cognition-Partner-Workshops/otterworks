apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rendered.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: sample-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-service
      spec:
        template:
          spec:
            containers:
              - name: sample-service
                readinessProbe:
                  httpGet:
                    path: /robots933456.txt
