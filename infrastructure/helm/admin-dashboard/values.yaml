replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-admin-dashboard
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4200

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: admin-dashboard.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: admin-dashboard-tls
      hosts:
        - admin-dashboard.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 4200

monitoring:
  # The Next.js/Angular servers expose no Prometheus endpoint (/metrics returns the
  # SPA's HTML), so scraping only produced TargetDown noise. Frontend availability
  # is covered by ingress-nginx metrics and the blackbox-style health alerts.
  enabled: false
  path: /metrics
  port: 4200

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}

# Base URL of the peer deployment (web or API host) for the Migration page's Before/After
# panel, e.g. https://t-d24-before.otterworks.app on the AFTER deployment. nginx proxies
# /peer/ to it same-origin, so the browser's session token reaches the peer's gateway; that
# gateway must trust it (api-gateway secrets.JWT_PEER_SECRET = this deployment's JWT_SECRET).
# Empty = no peer; the page then only shows this deployment's archive document.
peerAppUrl: ""

# Availability. Per-tenant defaults stay at one replica to keep demo tenants cheap;
# profiles/high-availability.yaml turns on HPA + multi-replica for busy periods.
startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 36

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpread:
  enabled: true
