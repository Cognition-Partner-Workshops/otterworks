{{- /* Self-signed serving cert for the /health server; kubelet HTTPS probes do not verify it. Reused across upgrades. */ -}}
{{- $name := "db2-archive-health-tls" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
data:
{{- if and $existing (index $existing.data "tls.crt") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $svc := printf "db2-archive.%s.svc" .Release.Namespace }}
{{- $cert := genSelfSignedCert $svc nil (list "db2-archive" $svc (printf "%s.cluster.local" $svc) "localhost") 825 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
