apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scheduler
  labels:
    {{- include "etl-airflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: db-migrate
          image: {{ include "etl-airflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "migrate"]
          {{- include "etl-airflow.env" . | nindent 10 }}
          {{- include "etl-airflow.containerSecurityContext" . | nindent 10 }}
      containers:
        - name: scheduler
          image: {{ include "etl-airflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scheduler"]
          ports:
            - name: health
              containerPort: {{ .Values.scheduler.healthPort }}
              protocol: TCP
            - name: worker-logs
              containerPort: {{ .Values.scheduler.logServerPort }}
              protocol: TCP
          {{- include "etl-airflow.env" . | nindent 10 }}
          {{- include "etl-airflow.containerSecurityContext" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: health
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
