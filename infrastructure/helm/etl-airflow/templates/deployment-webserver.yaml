apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webserver
  labels:
    {{- include "etl-airflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: webserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: webserver
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        - name: wait-for-migrations
          image: {{ include "etl-airflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["db", "check-migrations", "--migration-wait-timeout={{ .Values.scheduler.migrationWaitTimeout }}"]
          {{- include "etl-airflow.env" . | nindent 10 }}
          {{- include "etl-airflow.containerSecurityContext" . | nindent 10 }}
      containers:
        - name: webserver
          image: {{ include "etl-airflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["webserver"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- include "etl-airflow.env" . | nindent 10 }}
          {{- include "etl-airflow.containerSecurityContext" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webserver.resources | nindent 12 }}
