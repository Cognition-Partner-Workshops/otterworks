apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    platform/environment: {{ (.Values.global).environment | default "dev" }}
    platform/team: otterworks
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- if .Values.snowflake.enabled }}
      securityContext:
        runAsUser: 1001
        fsGroup: 1001
      volumes:
        - name: snowflake-key
          secret:
            secretName: {{ required "snowflake.privateKeySecret.name must reference an existing Secret" .Values.snowflake.privateKeySecret.name | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.snowflake.privateKeySecret.key | quote }}
                path: rsa_key.p8
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (ECR uses IMMUTABLE tags)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
                optional: true
            - secretRef:
                name: {{ .Release.Name }}-secrets
                optional: true
          {{- if .Values.snowflake.enabled }}
          env:
            - name: SNOWFLAKE_ACCOUNT
              value: {{ required "snowflake.account is required when enabled" .Values.snowflake.account | quote }}
            - name: SNOWFLAKE_ROLE
              value: {{ .Values.snowflake.role | quote }}
            - name: SNOWFLAKE_USER
              value: {{ .Values.snowflake.user | quote }}
            - name: SNOWFLAKE_PRIVATE_KEY_PATH_CS_DOC_SEARCH_API_TOP_ITEMS
              value: /var/run/snowflake/rsa_key.p8
          volumeMounts:
            - name: snowflake-key
              mountPath: /var/run/snowflake
              readOnly: true
          {{- end }}
