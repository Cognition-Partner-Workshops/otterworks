{{- if and .Values.monitoring.oncall.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
{{- $ns := .Release.Namespace -}}
{{- $src := .Files.Get "files/oncall_alerts.yml" | fromYaml -}}
{{- $groups := list -}}
{{- range $group := $src.groups -}}
{{- $rules := list -}}
{{- range $rule := $group.rules -}}
{{- $r := deepCopy $rule -}}
{{- $expr := regexReplaceAll `\b(nginx_ingress_controller_[a-z0-9_]+)\{` $rule.expr (printf "${1}{exported_namespace=%q, " $ns) -}}
{{- $expr = regexReplaceAll `\b((?:api_gateway|http|otterworks|container_cpu|pg)_[a-z0-9_]+)\{` $expr (printf "${1}{namespace=%q, " $ns) -}}
{{- $expr = replace ", }" "}" $expr -}}
{{- $expr = replace "> 0.5" (printf "> %v" $.Values.monitoring.oncall.p95SloSeconds) $expr -}}
{{- $_ := set $r "expr" $expr -}}
{{- $labels := mergeOverwrite (deepCopy $rule.labels) ($.Values.monitoring.rules.extraLabels | default dict) (dict "namespace" $ns "page" "oncall" "oncall_group" "folder-storm" "service" $rule.labels.service "severity" $rule.labels.severity) -}}
{{- $_ := set $r "labels" $labels -}}
{{- $ann := deepCopy $rule.annotations -}}
{{- $base := $.Values.monitoring.links.grafana | default "http://localhost:3001" -}}
{{- $_ := set $ann "dashboard_url" (printf "%s/d/oncall-storm?var-namespace=%s" (trimSuffix "/" $base) $ns) -}}
{{- $_ := set $ann "summary" (replace "0.5 seconds" (printf "%v seconds" $.Values.monitoring.oncall.p95SloSeconds) $ann.summary) -}}
{{- $_ := set $r "annotations" $ann -}}
{{- $rules = append $rules $r -}}
{{- end -}}
{{- $g := deepCopy $group -}}
{{- $_ := set $g "rules" $rules -}}
{{- $groups = append $groups $g -}}
{{- end -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-oncall
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.monitoring.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $groups | nindent 4 }}
{{- end }}
