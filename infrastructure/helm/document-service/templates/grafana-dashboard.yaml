{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-incident-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.monitoring.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  incident-responder.json: |-
    {{- include "document-service.scopedDashboard" (dict "root" . "file" "files/incident-responder.json" "uid" (include "document-service.dashboardUid" .)) | nindent 4 }}
{{- end }}
