apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    platform/environment: {{ (.Values.global).environment | default "dev" }}
    platform/team: otterworks
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (ECR uses IMMUTABLE tags)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $digest := .Values.folderDigest | default dict }}
          env:
            - name: DOC_SVC_FOLDER_DIGEST_ENABLED
              value: {{ $digest.enabled | default false | toString | quote }}
            - name: DOC_SVC_FOLDER_DIGEST_INTERVAL_SECONDS
              value: {{ $digest.intervalSeconds | default 15 | int | toString | quote }}
            - name: DOC_SVC_FOLDER_DIGEST_CONCURRENCY
              value: {{ $digest.concurrency | default 4 | int | toString | quote }}
            {{- with .Values.database }}
            {{- if gt (.statementTimeoutMs | default 0 | int) 0 }}
            - name: DOC_SVC_DB_STATEMENT_TIMEOUT_MS
              value: {{ .statementTimeoutMs | int | toString | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .poolSize) }}
            - name: DOC_SVC_DB_POOL_SIZE
              value: {{ .poolSize | int | toString | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .maxOverflow) }}
            - name: DOC_SVC_DB_MAX_OVERFLOW
              value: {{ .maxOverflow | int | toString | quote }}
            {{- end }}
            {{- with .urlSecret }}
            {{- if .name }}
            - name: DOC_SVC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key | default "url" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - name: DOC_SVC_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            {{- with .Values.tracing.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
                optional: true
            - secretRef:
                name: {{ .Release.Name }}-secrets
                optional: true
