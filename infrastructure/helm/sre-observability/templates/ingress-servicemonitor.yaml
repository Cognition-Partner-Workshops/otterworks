{{- if .Values.ingressMetrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.ingressMetrics.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: {{ .Values.ingressMetrics.release }}
      app.kubernetes.io/component: controller
  endpoints:
    - port: metrics
      honorLabels: true
      interval: {{ .Values.ingressMetrics.interval }}
{{- end }}
