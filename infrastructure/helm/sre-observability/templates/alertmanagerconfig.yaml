{{- if .Values.alerting.webhook.enabled }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ .Release.Name }}
  namespace: monitoring
spec:
  route:
    receiver: sre-webhook
    matchers:
      - name: team
        value: sre
        matchType: '='
    groupBy: [alertname, affected_namespace]
    groupWait: {{ .Values.alerting.groupWait }}
    groupInterval: {{ .Values.alerting.groupInterval }}
    repeatInterval: {{ .Values.alerting.repeatInterval }}
  receivers:
    - name: sre-webhook
      webhookConfigs:
        - urlSecret:
            name: {{ .Values.alerting.webhook.secretName }}
            key: {{ .Values.alerting.webhook.urlKey }}
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: {{ .Values.alerting.webhook.secretName }}
                key: {{ .Values.alerting.webhook.authorizationKey }}
{{- end }}
