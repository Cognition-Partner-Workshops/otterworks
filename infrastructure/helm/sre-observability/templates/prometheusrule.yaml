{{- if .Values.rules.enabled }}
{{- $r := .Values.rules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  namespace: monitoring
  labels:
    app.kubernetes.io/name: sre-observability
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  groups:
    - name: otterworks.sre
      rules:
        {{- include "sre-observability.rule" (dict "root" . "name" "SREAppTargetDown" "severity" "warning" "duration" $r.scrapeDownFor "summary" "Application metrics target unavailable" "description" "An active application scrape target has been down; inspect endpoint and pod health." "expr" (printf "up{namespace=~%q,job=~%q} == 0" $r.tenantNamespaceRegex $r.appJobRegex)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREPodCrashLooping" "severity" "warning" "duration" $r.crashLoopFor "summary" "Pod container crash-looping" "description" "A container is waiting in CrashLoopBackOff. Check previous logs; the golden admin-service failure is deliberately planted." "expr" (printf "kube_pod_container_status_waiting_reason{namespace=~%q,reason=\"CrashLoopBackOff\"} == 1" $r.tenantNamespaceRegex)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREPodRestarting" "severity" "warning" "duration" $r.restartFor "summary" "Pod container restarting repeatedly" "description" "Container restarts exceeded the configured window threshold." "expr" (printf "increase(kube_pod_container_status_restarts_total{namespace=~%q}[%s]) > %v" $r.tenantNamespaceRegex $r.restartWindow $r.restartThreshold)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREPodNotReady" "severity" "warning" "duration" $r.notReadyFor "summary" "Active pod not ready" "description" "A pending or running pod has remained unready; completed jobs are excluded." "expr" (printf "(kube_pod_status_ready{namespace=~%q,condition=\"true\"} == 0) and on(namespace,pod) (kube_pod_status_phase{namespace=~%q,phase=~\"Pending|Running\"} == 1)" $r.tenantNamespaceRegex $r.tenantNamespaceRegex)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREDeploymentUnavailable" "severity" "warning" "duration" $r.deploymentFor "summary" "Deployment desired replicas unavailable" "description" "Available replicas are below desired replicas; deployments intentionally scaled to zero do not alert." "expr" (printf "((kube_deployment_spec_replicas{namespace=~%q} - kube_deployment_status_replicas_available{namespace=~%q}) > 0) unless on(namespace,deployment) (kube_deployment_status_replicas_available{namespace=\"otterworks-main\",deployment=~\"api-gateway|auth-service|document-service|file-service|web-app\"} == 0)" $r.tenantNamespaceRegex $r.tenantNamespaceRegex)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SRENodePressure" "severity" "warning" "duration" $r.nodePressureFor "affectedNamespace" "cluster" "summary" "Node memory or disk pressure" "description" "A node reports MemoryPressure or DiskPressure; inspect node and workload consumption." "expr" "kube_node_status_condition{condition=~\"MemoryPressure|DiskPressure\",status=\"true\"} == 1") | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SRENodeFilesystemFull" "severity" "warning" "duration" $r.filesystemFor "affectedNamespace" "cluster" "summary" "Node filesystem utilization high" "description" "Writable non-pseudo filesystem exceeds configured capacity threshold." "expr" (printf "((1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|devtmpfs|overlay|squashfs|nsfs|proc|sysfs\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|devtmpfs|overlay|squashfs|nsfs|proc|sysfs\"}) > %v) and on(instance,device,mountpoint) (node_filesystem_readonly == 0)" $r.filesystemUsedRatio)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SRERuleEvaluationFailures" "severity" "critical" "duration" $r.selfHealthFor "summary" "Prometheus rule evaluations failing" "description" "Prometheus cannot evaluate one or more alert or recording rules." "expr" (printf "increase(prometheus_rule_evaluation_failures_total{namespace=\"monitoring\"}[%s]) > %v" $r.selfHealthWindow $r.selfHealthFailureThreshold)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREPrometheusNotificationFailures" "severity" "critical" "duration" $r.selfHealthFor "summary" "Prometheus alert delivery failing" "description" "Prometheus notification errors or dropped notifications increased; inspect Alertmanager connectivity." "expr" (printf "(increase(prometheus_notifications_errors_total{namespace=\"monitoring\"}[%s]) > %v) or (increase(prometheus_notifications_dropped_total{namespace=\"monitoring\"}[%s]) > %v)" $r.selfHealthWindow $r.selfHealthFailureThreshold $r.selfHealthWindow $r.selfHealthFailureThreshold)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SREAlertmanagerNotificationFailures" "severity" "critical" "duration" $r.selfHealthFor "summary" "Alertmanager receiver delivery failing" "description" "Alertmanager failed to notify a receiver; check receiver credentials, status and network access." "expr" (printf "increase(alertmanager_notifications_failed_total{namespace=\"monitoring\"}[%s]) > %v" $r.selfHealthWindow $r.selfHealthFailureThreshold)) | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SRETelemetryConfigReloadFailed" "severity" "critical" "duration" $r.selfHealthFor "summary" "Telemetry configuration reload failed" "description" "Prometheus or Alertmanager rejected its latest configuration reload." "expr" "{__name__=~\"prometheus_config_last_reload_successful|alertmanager_config_last_reload_successful\",namespace=\"monitoring\"} == 0") | nindent 8 }}
        {{- include "sre-observability.rule" (dict "root" . "name" "SRELogShippingUnavailable" "severity" "warning" "duration" $r.logShippingFor "summary" "Tenant log shipping unavailable" "description" "Fluent Bit DaemonSet is missing or not available on every desired node; backend logs may be lost." "expr" (printf "(kube_daemonset_status_desired_number_scheduled{namespace=%q,daemonset=%q} - kube_daemonset_status_number_available{namespace=%q,daemonset=%q} > 0) or absent(kube_daemonset_status_desired_number_scheduled{namespace=%q,daemonset=%q})" $r.logShippingNamespace $r.logShippingDaemonSet $r.logShippingNamespace $r.logShippingDaemonSet $r.logShippingNamespace $r.logShippingDaemonSet)) | nindent 8 }}
{{- end }}
