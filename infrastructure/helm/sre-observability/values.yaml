runbookUrl: https://github.com/Cognition-Partner-Workshops/otterworks/blob/main/docs/runbooks/sre-triage.md

rules:
  enabled: true
  tenantNamespaceRegex: otterworks-.*
  appJobRegex: api-gateway|auth-service|file-service|document-service|collab-service|notification-service|search-service|analytics-service|admin-service|audit-service|report-service
  scrapeDownFor: 5m
  crashLoopFor: 5m
  restartWindow: 15m
  restartThreshold: 3
  restartFor: 5m
  notReadyFor: 10m
  deploymentFor: 10m
  nodePressureFor: 5m
  filesystemUsedRatio: 0.85
  filesystemFor: 15m
  selfHealthWindow: 5m
  selfHealthFailureThreshold: 0
  selfHealthFor: 5m
  logShippingNamespace: otterworks-system
  logShippingDaemonSet: aws-for-fluent-bit
  logShippingFor: 10m

alerting:
  webhook:
    enabled: false
    headerRelay: false
    secretName: alertmanager-sre-webhook
    urlKey: url
    authorizationKey: webhook-secret
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 4h

triage:
  enabled: true
