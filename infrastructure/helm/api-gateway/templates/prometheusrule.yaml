{{- if and .Values.monitoring.enabled .Values.monitoring.rules.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
{{- $ns := .Release.Namespace -}}
{{- $src := .Files.Get "files/security_alerts.yml" | fromYaml -}}
{{- $groups := list -}}
{{- range $group := $src.groups -}}
{{- $rules := list -}}
{{- range $rule := $group.rules -}}
{{- $r := deepCopy $rule -}}
{{- $matcher := printf "namespace=%q" $ns -}}
{{- $expr := regexReplaceAll `\b((?:api_gateway|otterworks)_[a-z0-9_]+)\{` $rule.expr (printf "${1}{%s, " $matcher) -}}
{{- $expr = regexReplaceAll `\b((?:api_gateway|otterworks)_[a-z0-9_]+)\b([^{a-z0-9_]|$)` $expr (printf "${1}{%s}${2}" $matcher) -}}
{{- $_ := set $r "expr" $expr -}}
{{- $labels := mergeOverwrite (deepCopy ($rule.labels | default dict)) ($.Values.monitoring.rules.extraLabels | default dict) (dict "namespace" $ns) -}}
{{- $_ := set $r "labels" $labels -}}
{{- $rules = append $rules $r -}}
{{- end -}}
{{- $g := deepCopy $group -}}
{{- $_ := set $g "rules" $rules -}}
{{- $groups = append $groups $g -}}
{{- end -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-security
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.monitoring.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $groups | nindent 4 }}
{{- end }}
