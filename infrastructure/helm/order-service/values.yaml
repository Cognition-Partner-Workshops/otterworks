replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/otterworks/order-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

# ClusterIP only: reached in-namespace by web-app's /api proxy, never exposed
# through its own load balancer.
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Internal API; the storefront (web-app) is the only public entry point.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# JVM: the image sets -XX:MaxRAMPercentage=75, so the heap follows the limit.
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 512Mi

healthCheck:
  path: /health
  port: 8080

# The service exposes no Prometheus endpoint yet.
monitoring:
  enabled: false
  path: /actuator/prometheus
  port: 8080

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time.
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
