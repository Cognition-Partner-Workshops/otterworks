{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name)) | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne $key "ALERT_WEBHOOK_SECRET") (ne $key "CHAOS_SECRET") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- range $key := list "ALERT_WEBHOOK_SECRET" "CHAOS_SECRET" }}
  {{ $key }}: {{ (index $.Values.secrets $key) | default ((index $data $key | default "") | b64dec) | default (randAlphaNum 48) | quote }}
  {{- end }}
