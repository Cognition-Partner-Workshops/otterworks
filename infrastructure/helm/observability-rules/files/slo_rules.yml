      or 0 * sum by (namespace) (rate(http_server_requests_seconds_count{job="auth-service",namespace=~"otterworks-.*|",uri!~"/(health|metrics|actuator.*)"}[5m])))
      / sum by (namespace) (rate(http_server_requests_seconds_count{job="auth-service",namespace=~"otterworks-.*|",uri!~"/(health|metrics|actuator.*)"}[5m]))),
      0), 1) and (sum by (namespace) (rate(http_server_requests_seconds_count{job="auth-service",namespace=~"otterworks-.*|",uri!~"/(health|metrics|actuator.*)"}[5m]))
      > 0)
    labels: &id003
      service: auth-service
