apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jira
spec:
  podSelector:
    matchLabels: {app: jira}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pagerduty
spec:
  podSelector:
    matchLabels: {app: pagerduty}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jira-devin-relay
spec:
  podSelector:
    matchLabels: {app: jira-devin-relay}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: jira}
      ports:
        - {protocol: TCP, port: 8080}
