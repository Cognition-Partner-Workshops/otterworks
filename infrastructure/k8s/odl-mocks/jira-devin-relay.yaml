apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-devin-relay
spec:
  replicas: 1
  selector:
    matchLabels: {app: jira-devin-relay}
  template:
    metadata:
      labels:
        app: jira-devin-relay
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: mirror.gcr.io/library/python:3.12-slim
          command: [python, -B, -u, /app/relay.py]
          envFrom:
            - secretRef:
                name: jira-devin-webhook
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
          volumeMounts:
            - {name: relay, mountPath: /app, readOnly: true}
      volumes:
        - name: relay
          configMap:
            name: jira-devin-relay
---
apiVersion: v1
kind: Service
metadata:
  name: jira-devin-relay
spec:
  type: ClusterIP
  selector: {app: jira-devin-relay}
  ports:
    - {port: 8080, targetPort: 8080}
