apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odl-mocks
labels:
  - pairs:
      run_token: odl-1795112287
    includeTemplates: true
resources:
  - namespace.yaml
  - workloads.yaml
  - jira-devin-relay.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - confluence.yaml
configMapGenerator:
  - name: jira-odl-seed
    files:
      - seed.json
      - seed.py
  - name: confluence-odl-seed
    options:
      labels: {app: confluence}
    files:
      - confluence-seed.json
      - confluence-seed.py
  - name: jira-devin-relay
    files:
      - relay.py
