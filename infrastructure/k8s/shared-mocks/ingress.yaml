apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jira
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: jira-mock-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: OtterWorks demo mocks
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  rules:
    - host: jira-odl.demo.otterworks.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jira
                port: {number: 8080}
---
