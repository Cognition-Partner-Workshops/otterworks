{{- if .Values.monitoring.enabled }}
{{- include "replatform.validate" . -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "replatform.fullname" . }}
  labels:
    {{- include "replatform.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "replatform.annotations" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "replatform.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.path }}
      interval: {{ .Values.monitoring.interval }}
{{- end }}
