{{- if .Values.serviceAccount.create }}
{{- include "replatform.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "replatform.serviceAccountName" . }}
  labels:
    {{- include "replatform.labels" . | nindent 4 }}
  annotations:
    {{- include "replatform.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
{{- end }}
