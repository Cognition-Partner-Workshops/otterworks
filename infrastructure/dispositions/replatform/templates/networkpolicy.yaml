{{- if .Values.networkPolicy.enabled }}
{{- include "replatform.validate" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "replatform.fullname" . }}
  labels:
    {{- include "replatform.labels" . | nindent 4 }}
  annotations:
    {{- include "replatform.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "replatform.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes:
    - Ingress
    {{ if .Values.networkPolicy.egress }}
    - Egress
    {{ end }}
  ingress:
    - from:
        {{ if .Values.networkPolicy.allowSameNamespace }}
        - podSelector: {}
        {{ end }}
        {{ range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{ end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{ if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- end }}
{{- end }}
