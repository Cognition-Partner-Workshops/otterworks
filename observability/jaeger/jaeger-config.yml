# Jaeger v2 configuration for local development (docker-compose.infra.yml).
#
# Jaeger 2.x is built on the OpenTelemetry Collector, so this replaces the
# all-in-one env vars (COLLECTOR_OTLP_ENABLED, SPAN_STORAGE_TYPE,
# MEMORY_MAX_TRACES, METRICS_STORAGE_TYPE) with a collector-style config:
#   - OTLP ingestion on 4317 (gRPC) / 4318 (HTTP), fed by otel-collector
#   - in-memory trace storage (50k traces)
#   - UI / query API on 16686 (Grafana Jaeger datasource points here)
#   - Service Performance Monitoring reads RED metrics from Prometheus
#   - health on 13133 (/status), self-metrics on 8888 (replaces admin port 14269)

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: memory_store
      metrics: prometheus_metrics
    max_clock_skew_adjust: 0s

  jaeger_storage:
    backends:
      memory_store:
        memory:
          max_traces: 50000
    metric_backends:
      prometheus_metrics:
        prometheus:
          endpoint: http://prometheus:9090
          normalize_calls: true
          normalize_duration: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
