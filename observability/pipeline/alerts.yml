apiVersion: 1
contactPoints:
  - orgId: 1
    name: sfx-webhook
    receivers:
      - uid: sfx-webhook
        type: webhook
        settings:
          url: $SFX_ALERT_WEBHOOK_URL
          httpMethod: POST
          headers:
            X-Webhook-Secret: $SFX_ALERT_WEBHOOK_SECRET
policies:
  - orgId: 1
    receiver: sfx-webhook
    group_by: [alertname, run]
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 4h
groups:
  - orgId: 1
    name: sfx-local
    folder: Warehouse
    interval: 10s
    rules:
      - uid: sfx-local-load-failure
        title: SfxLocal_load_failure
        notification_settings:
          receiver: sfx-webhook
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          run: $RUN_TOKEN
          check: load_failure
        annotations:
          summary: Pipeline load_failure
        data:
          - refId: A
            datasourceUid: sfx-loki
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: loki, uid: sfx-loki}
              expr: '(sum(count_over_time({component="warehouse",run="$RUN_TOKEN"} | json | event="load_failure" [1m])) or vector(0)) + (sum(count_over_time({component="runner",run="$RUN_TOKEN"} |= " : ERROR : " [1m])) or vector(0))'
              queryType: instant
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: sfx-local-row-count-drop
        title: SfxLocal_row_count_drop
        notification_settings:
          receiver: sfx-webhook
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          run: $RUN_TOKEN
          check: row_count_drop
        annotations:
          summary: Pipeline row_count_drop
        data:
          - refId: A
            datasourceUid: sfx-loki
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: loki, uid: sfx-loki}
              expr: 'sum(count_over_time({component="warehouse",run="$RUN_TOKEN"} | json | event="row_count_drop" [1m])) or vector(0)'
              queryType: instant
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: sfx-local-null-spike
        title: SfxLocal_null_spike
        notification_settings:
          receiver: sfx-webhook
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          run: $RUN_TOKEN
          check: null_spike
        annotations:
          summary: Pipeline null_spike
        data:
          - refId: A
            datasourceUid: sfx-loki
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: loki, uid: sfx-loki}
              expr: 'sum(count_over_time({component="warehouse",run="$RUN_TOKEN"} | json | event="null_spike" [1m])) or vector(0)'
              queryType: instant
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
