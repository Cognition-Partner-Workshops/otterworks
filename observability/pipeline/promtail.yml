server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: warehouse
    pipeline_stages:
      - json:
          expressions:
            run: run
            timestamp: timestamp
      - template:
          source: timestamp
          template: '{{ dateInZone "2006-01-02T15:04:05.999999999Z07:00" (toDate "2006-01-02T15:04:05.999999999Z07:00" (default "" .Value)) "UTC" }}'
      - drop:
          source: timestamp
          value: '0001-01-01T00:00:00Z'
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - template:
          source: run
          template: '{{ .Value | default "" }}'
      - drop:
          source: run
          expression: '^$'
      - labels:
          run:
    static_configs:
      - targets: [localhost]
        labels:
          component: warehouse
          __path__: /logs/warehouse/*.jsonl
  - job_name: runner
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}) :'
      - template:
          source: timestamp
          template: '{{ dateInZone "2006-01-02T15:04:05Z07:00" (toDate "2006-01-02 15:04:05" (default "" .Value)) "UTC" }}'
      - drop:
          source: timestamp
          value: '0001-01-01T00:00:00Z'
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - regex:
          source: filename
          expression: '^/logs/runner/(?P<namespace>sfx-?[a-z0-9]+(?:-[a-z0-9]+)*?)(?:-(?:before|after))?/'
      - template:
          source: run
          template: '{{ if .namespace }}{{ if hasPrefix "sfx-d" .namespace }}{{ .namespace }}{{ else if hasPrefix "sfx-" .namespace }}sfx{{ trimPrefix "sfx-" .namespace }}{{ else }}{{ .namespace }}{{ end }}{{ end }}'
      - drop:
          source: run
          expression: '^$'
      - labels:
          run:
    static_configs:
      - targets: [localhost]
        labels:
          component: runner
          __path__: /logs/runner/**/*.log
