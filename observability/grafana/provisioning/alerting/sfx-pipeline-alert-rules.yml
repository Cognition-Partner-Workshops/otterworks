apiVersion: 1
groups:
  - orgId: 1
    name: sfx-d1110-pipeline
    folder: OtterWorks
    interval: 30s
    rules:
      - uid: sfx-d1110-load-failure
        title: SfxPipeline_load_failure
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              expr: 'sfx_pipeline_check_firing{run="sfx-d1110",model="stg_billing__usage_daily",check="load_failure"} and on(run,model) (sfx_pipeline_last_scrape_success == 1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 120, to: 0}
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 0s
        labels:
          team: otterworks
          pipeline: sfx-d1110
          run: sfx-d1110
          model: stg_billing__usage_daily
          severity: critical
          check: load_failure
        annotations:
          summary: Pipeline load_failure firing
          description: Shared Snowflake pipeline check load_failure exceeded its configured threshold.
