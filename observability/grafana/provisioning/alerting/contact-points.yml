apiVersion: 1

contactPoints:
  - orgId: 1
    name: Default
    isDefault: true
    receivers:
      - uid: otterworks-webhook-receiver
        type: webhook
        settings:
          url: http://admin-service:8089/api/v1/admin/alerts/ingest
          httpMethod: POST
          username: ""
          password: ""
          authorization_scheme: Bearer
          # Must equal admin-service's ALERT_WEBHOOK_SECRET (set in .env); admin-service
          # rejects every alert while it is unset.
          authorization_credentials: $ALERT_WEBHOOK_SECRET
        disableResolveMessage: false
