apiVersion: 1

policies:
  - orgId: 1
    receiver: Default
    group_by: ['alertname', 'affected_service']
    group_wait: 10s
    group_interval: 30s
    repeat_interval: 4h
    matchers:
      - team=otterworks
    routes:
      - receiver: devin-pipeline-webhook
        object_matchers:
          - ['pipeline', '=', 'sfx-d1110']
        group_by: ['pipeline']
