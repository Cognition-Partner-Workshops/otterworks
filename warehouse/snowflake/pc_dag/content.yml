# wf_SFX_CONTENT_DAILY as a Snowflake Task DAG (__RUN_DATABASE___PC_CONTENT_*).
# Each workflow link has the condition $<session>.Status=SUCCEEDED, which maps to AFTER:
# a child task runs only when its predecessor succeeds.
# The workflow has no worklets, decisions, timers or event waits.
# s_m_SFX_TEAM_MEMBER is disabled in the source workflow and has no task here.
# Session procedures are owned by users and documents and share the core tables.
root: START
tasks:
  START:
    sql: SELECT 1
  STG_APP_USER:
    after: [START]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.STG_USERS__S_M_SFX_STG_APP_USER()
  APP_USER:
    after: [STG_APP_USER]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.CORE_USERS__S_M_SFX_APP_USER()
  STG_DOCUMENT:
    after: [APP_USER]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.STG_DOCUMENTS__S_M_SFX_STG_DOCUMENT()
  ROLE_GRANT:
    after: [APP_USER]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.CORE_USERS__S_M_SFX_ROLE_GRANT()
  LOGIN_EVENT:
    after: [APP_USER]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.CORE_USERS__S_M_SFX_LOGIN_EVENT()
  DOCUMENT:
    after: [STG_DOCUMENT]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.CORE_DOCUMENTS__S_M_SFX_DOCUMENT()
  DOC_SHARE:
    after: [DOCUMENT, ROLE_GRANT]
    warehouse: __RUN_DATABASE___TRANSFORM_WH
    sql: CALL __RUN_DATABASE__.OPS.CORE_DOCUMENTS__S_M_SFX_DOC_SHARE()
  FINISH:
    after: [DOC_SHARE, LOGIN_EVENT]
    sql: SELECT 1
