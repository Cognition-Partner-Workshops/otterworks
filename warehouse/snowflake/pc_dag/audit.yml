  STG_AUDIT_EVENT:
    after:
    - START
    warehouse: SFX_D1110_TRANSFORM_WH
    sql: "EXECUTE IMMEDIATE $$\nBEGIN\ncreate or replace transient table SFX_D1110_AFTER.PC_AUDIT.STG_AUDIT_EVENT\n         as\n        (\n\n\nselect\n    try_to_number(to_varchar(EVENT_ID),38,0)::number(38,0) as EVENT_ID,\n    try_to_number(to_varchar(ACTOR_USER_ID),38,0)::number(38,0) as ACTOR_USER_ID,\n    try_to_number(to_varchar(DOCUMENT_ID),38,0)::number(38,0) as DOCUMENT_ID,\n    try_to_number(to_varchar(CUSTOMER_ID),38,0)::number(38,0) as CUSTOMER_ID,\n    try_to_timestamp_ntz(to_varchar(EVENT_TS,'YYYY-MM-DD HH24:MI:SS'),\n                         'YYYY-MM-DD HH24:MI:SS')::timestamp_ntz(0) as EVENT_TS,\n    trim(left(EVENT_TYPE,12),' ')::varchar(200) as EVENT_TYPE,\n    trim(left(DETAILS,160),' ')::varchar(200) as DETAILS\nfrom SFX_D1110_AFTER.PC_SRC.AUDIT_EVENT\nwhere not ((EVENT_ID IS NOT NULL AND TRY_TO_NUMBER(TO_VARCHAR(EVENT_ID),38,0) IS NULL) OR (ACTOR_USER_ID IS NOT NULL AND TRY_TO_NUMBER(TO_VARCHAR(ACTOR_USER_ID),38,0) IS NULL) OR (DOCUMENT_ID IS NOT NULL AND TRY_TO_NUMBER(TO_VARCHAR(DOCUMENT_ID),38,0)\
      \ IS NULL) OR (CUSTOMER_ID IS NOT NULL AND TRY_TO_NUMBER(TO_VARCHAR(CUSTOMER_ID),38,0) IS NULL) OR (EVENT_TS IS NOT NULL AND TRY_TO_TIMESTAMP_NTZ(TO_VARCHAR(EVENT_TS,'YYYY-MM-DD HH24:MI:SS'),'YYYY-MM-DD HH24:MI:SS') IS NULL))\n        );\nCOMMENT ON TABLE SFX_D1110_AFTER.PC_AUDIT.STG_AUDIT_EVENT IS 'run_token=sfx-d1110 expires=2026-11-24';\nEND;\n$$"
  AUDIT_EVENT:
    after:
    - STG_AUDIT_EVENT
    warehouse: SFX_D1110_TRANSFORM_WH
    sql: "EXECUTE IMMEDIATE $$\nBEGIN\nCREATE OR REPLACE TEMPORARY VIEW SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT__dbt_tmp AS (\nselect\n    EVENT_ID::number(38,0) as EVENT_ID,\n    ACTOR_USER_ID::number(38,0) as ACTOR_USER_ID,\n    case when DOCUMENT_ID > 0 then DOCUMENT_ID else 0 end::number(38,0) as DOCUMENT_ID,\n    case when CUSTOMER_ID > 0 then CUSTOMER_ID else 0 end::number(38,0) as CUSTOMER_ID,\n    EVENT_TS::timestamp_ntz(0) as EVENT_TS,\n    rpad(left(upper(trim(EVENT_TYPE,' ')),12),12,' ')::varchar(12) as EVENT_TYPE,\n    left(case when DETAILS is null or trim(DETAILS,' ') = ''\n        then coalesce(upper(trim(EVENT_TYPE,' ')),'') || ' by user ' || coalesce(to_varchar(ACTOR_USER_ID),'')\n        else trim(DETAILS,' ') end,160)::varchar(160) as DETAILS\nfrom SFX_D1110_AFTER.PC_AUDIT.STG_AUDIT_EVENT\nwhere not (EVENT_ID IS NULL)\n);\nmerge into SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT as DBT_INTERNAL_DEST\n        using SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT__dbt_tmp as DBT_INTERNAL_SOURCE\n\
      \        on ((DBT_INTERNAL_SOURCE.EVENT_ID = DBT_INTERNAL_DEST.EVENT_ID))\n\n    \n    when matched then update set\n        \"EVENT_ID\" = DBT_INTERNAL_SOURCE.\"EVENT_ID\",\"ACTOR_USER_ID\" = DBT_INTERNAL_SOURCE.\"ACTOR_USER_ID\",\"DOCUMENT_ID\" = DBT_INTERNAL_SOURCE.\"DOCUMENT_ID\",\"CUSTOMER_ID\" = DBT_INTERNAL_SOURCE.\"CUSTOMER_ID\",\"EVENT_TS\" = DBT_INTERNAL_SOURCE.\"EVENT_TS\",\"EVENT_TYPE\" = DBT_INTERNAL_SOURCE.\"EVENT_TYPE\",\"DETAILS\" = DBT_INTERNAL_SOURCE.\"DETAILS\"\n    \n\n    when not matched then insert\n        (\"EVENT_ID\", \"ACTOR_USER_ID\", \"DOCUMENT_ID\", \"CUSTOMER_ID\", \"EVENT_TS\", \"EVENT_TYPE\", \"DETAILS\")\n    values\n        (\"EVENT_ID\", \"ACTOR_USER_ID\", \"DOCUMENT_ID\", \"CUSTOMER_ID\", \"EVENT_TS\", \"EVENT_TYPE\", \"DETAILS\");\nDROP VIEW IF EXISTS SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT__dbt_tmp;\nCOMMENT ON TABLE SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT IS 'run_token=sfx-d1110 expires=2026-11-24';\nEND;\n$$"
  AUDIT_DAILY_SUMMARY:
    after:
    - AUDIT_EVENT
    warehouse: SFX_D1110_TRANSFORM_WH
    sql: "EXECUTE IMMEDIATE $$\nBEGIN\nCREATE OR REPLACE TEMPORARY VIEW SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY__dbt_tmp AS (\nwith grouped as (\n    select\n        EVENT_TS::date as SUMMARY_DT,\n        CUSTOMER_ID::number(38,0) as CUSTOMER_ID,\n        count(EVENT_ID) as EVENT_COUNT,\n        sum(iff(rtrim(EVENT_TYPE, ' ') = 'DOC_EXPORT', 1, 0)) as EXPORT_COUNT,\n        min(EVENT_ID) as FIRST_EVENT_ID\n    from SFX_D1110_AFTER.PC_AUDIT.AUDIT_EVENT\n    group by 1, 2\n),\n\nexisting as (\n    select SUMMARY_ID, SUMMARY_DT, CUSTOMER_ID from SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY\n),\nnext_id as (\n    select coalesce(max(SUMMARY_ID) + 1, 50001) as NEXT_ID from SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY\n),\nmatched as (\n    select e.SUMMARY_ID, g.SUMMARY_DT, g.CUSTOMER_ID, g.EVENT_COUNT, g.EXPORT_COUNT\n    from grouped g\n    join existing e on equal_null(g.SUMMARY_DT, e.SUMMARY_DT) and equal_null(g.CUSTOMER_ID, e.CUSTOMER_ID)\n),\nunmatched as (\n    select g.*\n    from\
      \ grouped g\n    where not exists (select 1 from existing e\n                      where equal_null(g.SUMMARY_DT, e.SUMMARY_DT) and equal_null(g.CUSTOMER_ID, e.CUSTOMER_ID))\n),\n\nnumbered as (\n    select n.NEXT_ID - 1 + row_number() over (order by u.FIRST_EVENT_ID) as SUMMARY_ID,\n           u.SUMMARY_DT, u.CUSTOMER_ID, u.EVENT_COUNT, u.EXPORT_COUNT\n    from unmatched u\n    cross join next_id n\n    \n    union all\n    select * from matched\n    \n)\nselect\n    SUMMARY_ID::number(38,0) as SUMMARY_ID,\n    SUMMARY_DT::date as SUMMARY_DT,\n    CUSTOMER_ID::number(38,0) as CUSTOMER_ID,\n    EVENT_COUNT::number(38,0) as EVENT_COUNT,\n    EXPORT_COUNT::number(38,0) as EXPORT_COUNT\nfrom numbered\n);\nmerge into SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY as DBT_INTERNAL_DEST\n        using SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY__dbt_tmp as DBT_INTERNAL_SOURCE\n        on ((DBT_INTERNAL_SOURCE.SUMMARY_ID = DBT_INTERNAL_DEST.SUMMARY_ID))\n\n    \n    when matched then update\
      \ set\n        \"SUMMARY_ID\" = DBT_INTERNAL_SOURCE.\"SUMMARY_ID\",\"SUMMARY_DT\" = DBT_INTERNAL_SOURCE.\"SUMMARY_DT\",\"CUSTOMER_ID\" = DBT_INTERNAL_SOURCE.\"CUSTOMER_ID\",\"EVENT_COUNT\" = DBT_INTERNAL_SOURCE.\"EVENT_COUNT\",\"EXPORT_COUNT\" = DBT_INTERNAL_SOURCE.\"EXPORT_COUNT\"\n    \n\n    when not matched then insert\n        (\"SUMMARY_ID\", \"SUMMARY_DT\", \"CUSTOMER_ID\", \"EVENT_COUNT\", \"EXPORT_COUNT\")\n    values\n        (\"SUMMARY_ID\", \"SUMMARY_DT\", \"CUSTOMER_ID\", \"EVENT_COUNT\", \"EXPORT_COUNT\");\nDROP VIEW IF EXISTS SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY__dbt_tmp;\nCOMMENT ON TABLE SFX_D1110_AFTER.PC_AUDIT.AUDIT_DAILY_SUMMARY IS 'run_token=sfx-d1110 expires=2026-11-24';\nEND;\n$$"
  SECURITY_ALERT:
    after:
    - START
    warehouse: SFX_D1110_TRANSFORM_WH
    sql: "EXECUTE IMMEDIATE $$\nBEGIN\nCREATE OR REPLACE TEMPORARY VIEW SFX_D1110_AFTER.PC_AUDIT.SECURITY_ALERT__dbt_tmp AS (\nwith normalized as (\n    select ALERT_ID::number(38,0) as ALERT_ID,\n           ACTOR_USER_ID::number(38,0) as ACTOR_USER_ID,\n           DOCUMENT_ID::number(38,0) as DOCUMENT_ID,\n           ALERT_TS::timestamp_ntz(9) as ALERT_TS,\n           left(upper(trim(left(SEVERITY_CD,12),' ')),12) as SEVERITY_CD,\n           left(upper(trim(left(STATUS_CD,12),' ')),12) as STATUS_CD\n    from SFX_D1110_AFTER.PC_SRC.SECURITY_ALERT\n), routed as (\n    select *, case when SEVERITY_CD in ('CRITICAL','HIGH') then 1\n                   when SEVERITY_CD in ('MEDIUM','LOW') then 2 else 3 end as ROUTE\n    from normalized\n), expressed as (\n    select ALERT_ID, ACTOR_USER_ID, DOCUMENT_ID, ALERT_TS, SEVERITY_CD,\n           case when ROUTE=1 and STATUS_CD='OPEN' then 'ESCALATED' else STATUS_CD end as STATUS_CD,\n           ROUTE\n    from routed\n)\n\n, candidates as (\n    select\
      \ *, count(*) over (partition by ROUTE,ALERT_ID) as ROUTE_COUNT\n    from expressed where ROUTE<>3 and ALERT_ID is not null\n), guarded as (\n    select *, max(ROUTE_COUNT) over () as MAX_ROUTE_COUNT from candidates\n)\nselect ALERT_ID, ACTOR_USER_ID, DOCUMENT_ID, ALERT_TS,\n       rpad(SEVERITY_CD,12,' ')::varchar(12) as SEVERITY_CD,\n       rpad(STATUS_CD,12,' ')::varchar(12) as STATUS_CD\nfrom guarded\nwhere 1 / iff(MAX_ROUTE_COUNT>1,0,1) = 1\nqualify row_number() over (partition by ALERT_ID order by ROUTE desc)=1\n);\nmerge into SFX_D1110_AFTER.PC_AUDIT.SECURITY_ALERT as DBT_INTERNAL_DEST\n        using SFX_D1110_AFTER.PC_AUDIT.SECURITY_ALERT__dbt_tmp as DBT_INTERNAL_SOURCE\n        on ((DBT_INTERNAL_SOURCE.ALERT_ID = DBT_INTERNAL_DEST.ALERT_ID))\n\n    \n    when matched then update set\n        \"ALERT_ID\" = DBT_INTERNAL_SOURCE.\"ALERT_ID\",\"ACTOR_USER_ID\" = DBT_INTERNAL_SOURCE.\"ACTOR_USER_ID\",\"DOCUMENT_ID\" = DBT_INTERNAL_SOURCE.\"DOCUMENT_ID\",\"ALERT_TS\" = DBT_INTERNAL_SOURCE.\"\
      ALERT_TS\",\"SEVERITY_CD\" = DBT_INTERNAL_SOURCE.\"SEVERITY_CD\",\"STATUS_CD\" = DBT_INTERNAL_SOURCE.\"STATUS_CD\"\n    \n\n    when not matched then insert\n        (\"ALERT_ID\", \"ACTOR_USER_ID\", \"DOCUMENT_ID\", \"ALERT_TS\", \"SEVERITY_CD\", \"STATUS_CD\")\n    values\n        (\"ALERT_ID\", \"ACTOR_USER_ID\", \"DOCUMENT_ID\", \"ALERT_TS\", \"SEVERITY_CD\", \"STATUS_CD\");\nDROP VIEW IF EXISTS SFX_D1110_AFTER.PC_AUDIT.SECURITY_ALERT__dbt_tmp;\nCOMMENT ON TABLE SFX_D1110_AFTER.PC_AUDIT.SECURITY_ALERT IS 'run_token=sfx-d1110 expires=2026-11-24';\nEND;\n$$"
