version: 2
models:
  - name: team_graph_components
    description: "sfx-d1110: replaces lake/users/team_graph_components in SFX_D1110_AFTER.MART_SPARK.TEAM_GRAPH_COMPONENTS; exactly six simultaneous label rounds, excluding singleton teams."
    columns:
      - name: USER_ID
        data_tests: [not_null, unique]
      - name: COMPONENT_ID
        data_tests: [not_null]
unit_tests:
  - name: team_labels_stop_after_six_hops_and_ignore_singletons
    model: team_graph_components
    given:
      - input: source('spark_users', 'TEAM_MEMBER')
        rows:
          - {TEAM_ID: 1, USER_ID: 1}
          - {TEAM_ID: 1, USER_ID: 2}
          - {TEAM_ID: 1, USER_ID: 2}
          - {TEAM_ID: 2, USER_ID: 2}
          - {TEAM_ID: 2, USER_ID: 3}
          - {TEAM_ID: 3, USER_ID: 3}
          - {TEAM_ID: 3, USER_ID: 4}
          - {TEAM_ID: 4, USER_ID: 4}
          - {TEAM_ID: 4, USER_ID: 5}
          - {TEAM_ID: 5, USER_ID: 5}
          - {TEAM_ID: 5, USER_ID: 6}
          - {TEAM_ID: 6, USER_ID: 6}
          - {TEAM_ID: 6, USER_ID: 7}
          - {TEAM_ID: 7, USER_ID: 7}
          - {TEAM_ID: 7, USER_ID: 8}
          - {TEAM_ID: 8, USER_ID: 99}
          - {TEAM_ID: 8, USER_ID: 99}
          - {TEAM_ID: 9, USER_ID: 10}
          - {TEAM_ID: 9, USER_ID: 11}
    expect:
      rows:
        - {USER_ID: 1, COMPONENT_ID: 1}
        - {USER_ID: 2, COMPONENT_ID: 1}
        - {USER_ID: 3, COMPONENT_ID: 1}
        - {USER_ID: 4, COMPONENT_ID: 1}
        - {USER_ID: 5, COMPONENT_ID: 1}
        - {USER_ID: 6, COMPONENT_ID: 1}
        - {USER_ID: 7, COMPONENT_ID: 1}
        - {USER_ID: 8, COMPONENT_ID: 2}
        - {USER_ID: 10, COMPONENT_ID: 10}
        - {USER_ID: 11, COMPONENT_ID: 10}
