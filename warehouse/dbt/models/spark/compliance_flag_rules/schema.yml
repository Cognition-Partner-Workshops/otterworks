version: 2

models:
  - name: compliance_flag_rules
    description: sfx-d1110 compliance dispositions with legacy primitive integer null defaults.
    columns:
      - name: FLAG_ID
        tests:
          - unique
          - not_null
      - name: DOCUMENT_ID
      - name: SEVERITY
      - name: DISPOSITION
        tests:
          - not_null
          - accepted_values:
              values: ['resolved', 'review', 'monitor']
