version: 2
models:
  - name: user_pref_json_flatten
    description: >-
      sfx-d1110 replacement for lake/users/user_pref_json_flatten.
      Deterministic full refresh in SFX_D1110_AFTER.MART_SPARK.USER_PREF_JSON_FLATTEN.
      Nested preferences are valid JSON strings rather than Python repr; scalar, missing and null values retain the legacy contract.
    columns:
      - name: USER_PREF_ID
        data_tests: [not_null, unique]
