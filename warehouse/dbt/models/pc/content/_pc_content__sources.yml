        description: FF_APP_USER flat file (users/APP_USER).
      - name: DOCUMENT
        description: FF_DOCUMENT flat file (documents/DOCUMENT).
      - name: DOC_SHARE
        description: FF_DOC_SHARE flat file (documents/DOC_SHARE).
