name: Consumer partner-extract

on:
  push:
    branches: [demo-snowflake-dw-exit, 'devin/sfx-d1110-**']
    paths: ['consumers/partner-extract/**', '.github/workflows/consumer-partner-extract.yml']
  pull_request:
    paths: ['consumers/partner-extract/**', '.github/workflows/consumer-partner-extract.yml']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: "cd consumers/partner-extract && bash tests/run.sh"

  contract-replay:
    needs: unit
    env:
      WAREHOUSE_CONTRACT_TARGET: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: "cd consumers/partner-extract && bash contract/run.sh"

  snowflake-secrets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.SNOWFLAKE_ACCOUNT != '' && secrets.SNOWFLAKE_PRIVATE_KEY != '' }}
        run: echo "present=$PRESENT" >> "$GITHUB_OUTPUT"

  contract:
    needs: [unit, snowflake-secrets]
    if: needs.snowflake-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_CONTRACT_TARGET: snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_QUERY_TAG: '{"run":"sfx-d1110","act":"consumers","consumer":"partner-extract"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r consumers/partner-extract/requirements.txt
      - run: "cd consumers/partner-extract && bash contract/run.sh"
