name: Consumer partner-extract

on:
  push:
    branches: [demo-data-platform-before]
    paths: ['consumers/partner-extract/**', '.github/workflows/consumer-partner-extract.yml']
  pull_request:
    paths: ['consumers/partner-extract/**', '.github/workflows/consumer-partner-extract.yml']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: "cd consumers/partner-extract && bash tests/run.sh"
