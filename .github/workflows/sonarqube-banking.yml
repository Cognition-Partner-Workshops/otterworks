name: SonarQube multi-repository SARIF

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Optional JSON array of public owner/repository names (main branch)'
        required: false
        type: string
  pull_request:
    paths:
      - 'security/ingest/**'
      - '.github/workflows/sonarqube-banking.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPOS: ${{ inputs.repos || '["Cognition-Partner-Workshops/fineract","Cognition-Partner-Workshops/fineract-web-app","Cognition-Partner-Workshops/banking-dashboard-api","Cognition-Partner-Workshops/ts-java-spring-boot-internet-banking","Cognition-Partner-Workshops/uc-payment-payload-analysis-banking","Cognition-Partner-Workshops/uc-product-analysis-loan-modernization"]' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline tests
        run: |
          python3 -m pip install pytest==9.0.2 requests==2.32.5 ruff==0.14.3
          python3 -m pytest security/ingest/tests
          ruff check security/ingest/sonar_sarif.py security/ingest/cluster_sarif.py security/ingest/scan_repositories.py security/ingest/devin_ingestion.py
      - name: Start local SonarQube
        run: docker compose -f security/ingest/docker-compose.sonarqube.yml -p sonar-ci up -d sonarqube
      - name: Scan recorded commits and export SARIF
        run: |
          python3 security/ingest/scan_repositories.py --repos "$REPOS" --work "$RUNNER_TEMP/sources" --out sonarqube-banking.sarif
      - name: Cluster and summarize
        run: |
          python3 security/ingest/cluster_sarif.py sonarqube-banking.sarif --json clusters.json --markdown clusters.md
          jq -r '.runs[] | "\(.properties.repository): \(.results | length) (\(.versionControlProvenance[0].revisionId))"' sonarqube-banking.sarif >> "$GITHUB_STEP_SUMMARY"
          cat clusters.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonarqube-banking
          path: |
            sonarqube-banking.sarif
            clusters.md
            clusters.json
          if-no-files-found: error
      - name: Remove local SonarQube
        if: always()
        run: docker compose -f security/ingest/docker-compose.sonarqube.yml -p sonar-ci down -v
