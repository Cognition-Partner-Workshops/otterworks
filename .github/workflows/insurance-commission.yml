name: Insurance commission rules

on:
  push:
    paths:
      - "services/industry-solutions/insurance/**"
      - "docker-compose.insurance.yml"
      - ".github/workflows/insurance-commission.yml"
  pull_request:
    paths:
      - "services/industry-solutions/insurance/**"
      - "docker-compose.insurance.yml"
      - ".github/workflows/insurance-commission.yml"

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/industry-solutions/insurance/commission-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: latest
      - run: uv sync --locked
      - run: uv run ruff check app tests
      # The rule suite runs here; the parity suite needs the Oracle Free fixture
      # and skips without it. Parity is run against the fixture with
      # `make insurance-up NS=<ns> && make insurance-parity NS=<ns>`.
      - run: uv run pytest -q
