name: Selected integration packages

on:
  workflow_dispatch:
  pull_request:
    branches: [demo-tibco, demo-tibco-after]
    paths:
      - 'integration/**'
      - 'docker-compose.tibco*.yml'
      - 'Makefile'
      - '.github/workflows/tibco-packages.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2 pytest==8.3.5 ruff==0.9.10
      - run: ruff check integration && python -m pytest integration/wave0/tests
      - run: python -m integration.harness verify-lock --corpus integration/corpus
      - id: select
        run: |
          python -m integration.wave0.discover > selection.json
          echo "matrix=$(cat selection.json)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          selected = bool(json.load(open("selection.json"))["include"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"selected={str(selected).lower()}\n")
          if not selected:
              print("no packages selected")
          PY

  replay:
    needs: discovery
    if: needs.discovery.outputs.selected == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - run: integration/target/mvnw -B -ntp -f integration/target/pom.xml package
      - run: python -m integration.harness verify-lock --corpus integration/corpus
      - name: Replay all non-held flows without comparator exceptions
        env:
          PACKAGE_MODULE: ${{ matrix.module }}
          SELECTED_FLOWS: ${{ toJSON(matrix.flows) }}
        run: |
          if [ "$SELECTED_FLOWS" = '[]' ]; then
            echo 'Package contains held flows only; no replay requirement'
            exit 0
          fi
          make tibco-up NS=ci
          make tibco-runtime-up NS=ci MODULES="$PACKAGE_MODULE"
          python - <<'PY'
          import json, os, subprocess
          for flow in json.loads(os.environ["SELECTED_FLOWS"]):
              subprocess.run(["make", "tibco-replay", "NS=ci", f"FLOW={flow}"], check=True)
              subprocess.run(["cp", "integration/reports/ci/parity.json",
                              f"integration/reports/ci/{flow}.json"], check=True)
          PY
      - if: always()
        run: make tibco-down NS=ci
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-${{ matrix.module }}-${{ matrix.package }}
          path: integration/reports/ci/**
