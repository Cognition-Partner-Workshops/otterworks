name: Insurance claims hub (Camel)

on:
  push:
    paths:
      - "industries/insurance/claims-hub-camel/**"
      - "industries/insurance/biztalk-claims-intake/Rules/**"
      - "industries/insurance/biztalk-claims-intake/corpus/golden/triage*/**"
      - "industries/insurance/biztalk-claims-intake/tools/triage_reference.py"
      - ".github/workflows/insurance-claims-hub-camel.yml"
  pull_request:
    paths:
      - "industries/insurance/claims-hub-camel/**"
      - "industries/insurance/biztalk-claims-intake/Rules/**"
      - "industries/insurance/biztalk-claims-intake/corpus/golden/triage*/**"
      - "industries/insurance/biztalk-claims-intake/tools/triage_reference.py"
      - ".github/workflows/insurance-claims-hub-camel.yml"

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: BRE reference goldens are current
        working-directory: industries/insurance/biztalk-claims-intake
        run: python3 tools/triage_reference.py check
      - name: Rules table parity and BRE name guard
        working-directory: industries/insurance/claims-hub-camel
        run: ./mvnw -B verify
      - name: Parity report
        if: always()
        working-directory: industries/insurance/claims-hub-camel
        run: cat target/parity/triage-parity.md >> "$GITHUB_STEP_SUMMARY" || true
