name: Insurance claims hub (Camel)

on:
  push:
    paths:
      - "industries/insurance/claims-hub-camel/**"
      - "industries/insurance/biztalk-claims-intake/corpus/**"
      - ".github/workflows/insurance-claims-hub-camel.yml"
  pull_request:
    paths:
      - "industries/insurance/claims-hub-camel/**"
      - "industries/insurance/biztalk-claims-intake/corpus/**"
      - ".github/workflows/insurance-claims-hub-camel.yml"

jobs:
  golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industries/insurance/claims-hub-camel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Golden tests
        run: ./mvnw -B verify
      - name: Per-map golden tables
        if: always()
        run: cat target/golden-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
