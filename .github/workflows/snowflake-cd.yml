name: Snowflake CD

on:
  push:
    branches: [demo-stack-snowflake]
    paths: ['workloads/**', '.github/workflows/snowflake-cd.yml']
  pull_request:
    branches: [demo-stack-snowflake]
    paths: ['workloads/**', '.github/workflows/snowflake-cd.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, rollback]
        default: dry-run
      target:
        description: Full rollback commit (defaults to first parent)
        type: string

permissions:
  contents: read

concurrency:
  group: snowflake-ext-cd
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
    runs-on: ubuntu-latest
    steps:
      - name: Report credential availability (no credentials supplied to dry-run)
        env:
          AVAILABLE: ${{ secrets.SNOWFLAKE_EXT_ACCOUNT != '' && secrets.SNOWFLAKE_EXT_USER != '' && secrets.SNOWFLAKE_EXT_PRIVATE_KEY != '' }}
        run: echo "Deploy credentials available to this run = $AVAILABLE (environment-only secrets are not exposed here)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r workloads/pipeline/requirements.txt
      - run: python workloads/deploy/cd.py dry-run --workload all

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: snowflake-ext
    permissions:
      contents: write
    env:
      GITHUB_ACTIONS: 'true'
      SNOWFLAKE_EXT_ACCOUNT: ${{ secrets.SNOWFLAKE_EXT_ACCOUNT }}
      SNOWFLAKE_EXT_USER: ${{ secrets.SNOWFLAKE_EXT_USER }}
      SNOWFLAKE_EXT_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_EXT_PRIVATE_KEY }}
    steps:
      - name: Check environment secrets
        run: |
          if [ -z "$SNOWFLAKE_EXT_ACCOUNT" ] || [ -z "$SNOWFLAKE_EXT_USER" ] || [ -z "$SNOWFLAKE_EXT_PRIVATE_KEY" ]; then
            echo 'environment secrets not configured'; exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r workloads/pipeline/requirements.txt -r workloads/churn_model/requirements.txt ruff==0.9.10
      - run: ruff check workloads/attribution workloads/foundation workloads/pipeline workloads/doc_usage_dashboard workloads/churn_model workloads/deploy
      - run: pytest workloads/attribution/tests workloads/deploy/tests -q
      - run: python workloads/attribution/validate_provenance.py
      - run: python workloads/deploy/cd.py deploy --workload all --write-provenance
      - name: Commit provenance
        if: always()
        run: |
          test -d .git || exit 0
          git add workloads/doc_usage_dashboard/provenance.yaml workloads/doc_search_api/provenance.yaml workloads/churn_model/provenance.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record Snowflake deployment provenance [skip ci]'
            git push
          fi
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snowflake-deploy-evidence
          path: |
            ~/.local/share/otterworks-cd
            workloads/*/provenance.yaml

  rollback:
    needs: [deploy]
    if: always() && (needs.deploy.result == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback'))
    runs-on: ubuntu-latest
    environment: snowflake-ext
    env:
      GITHUB_ACTIONS: 'true'
      SNOWFLAKE_EXT_ACCOUNT: ${{ secrets.SNOWFLAKE_EXT_ACCOUNT }}
      SNOWFLAKE_EXT_USER: ${{ secrets.SNOWFLAKE_EXT_USER }}
      SNOWFLAKE_EXT_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_EXT_PRIVATE_KEY }}
    steps:
      - name: Check environment secrets
        run: |
          if [ -z "$SNOWFLAKE_EXT_ACCOUNT" ] || [ -z "$SNOWFLAKE_EXT_USER" ] || [ -z "$SNOWFLAKE_EXT_PRIVATE_KEY" ]; then
            echo 'environment secrets not configured'; exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r workloads/pipeline/requirements.txt
      - name: Redeploy previous models and app (migrations remain forward-only)
        env:
          TARGET: ${{ inputs.target || github.event.before }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--to "$TARGET"); fi
          python workloads/deploy/cd.py rollback --workload all --commit "$GITHUB_SHA" "${args[@]}" --write-provenance
      - name: Preserve rollback evidence (read-only repository permissions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snowflake-rollback-evidence
          path: |
            ~/.local/share/otterworks-cd
            workloads/*/provenance.yaml
