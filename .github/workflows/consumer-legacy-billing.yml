name: Consumer legacy-billing

on:
  push:
    branches: [demo-snowflake-dw-exit, 'devin/sfx-d1110-**', demo-databricks-dw-exit, devin/dbx-d1111-consumer-legacy-billing]
    paths: ['services/legacy-billing/**', '.github/workflows/consumer-legacy-billing.yml']
  pull_request:
    paths: ['services/legacy-billing/**', '.github/workflows/consumer-legacy-billing.yml']

permissions:
  contents: read

jobs:
  databricks-secrets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' && secrets.DATABRICKS_WAREHOUSE_ID != '' && secrets.DATABRICKS_CATALOG != '' && secrets.DATABRICKS_RUN_TOKEN != '' }}
        run: echo "present=$PRESENT" >> "$GITHUB_OUTPUT"

  contract-databricks:
    needs: [unit, databricks-secrets]
    if: needs.databricks-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/legacy-billing/requirements-contract.txt
      - run: make sfx-teradata-up NS=dbx-d1111-consumers-legacy-billing ROWS_PER_TABLE=2000 BUSINESS_DATE=20261109
      - run: |
          export TD_PG_PORT=$(NS=dbx-d1111-consumers-legacy-billing python -c 'import os,zlib; print(54500+zlib.crc32(os.environ["NS"].encode())%1000)')
          cd services/legacy-billing
          pytest -s contract
        env:
          WAREHOUSE_CONTRACT_TARGET: databricks
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
          DATABRICKS_RUN_TOKEN: ${{ secrets.DATABRICKS_RUN_TOKEN }}
      - if: always()
        run: make sfx-teradata-down NS=dbx-d1111-consumers-legacy-billing

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/legacy-billing/requirements-dev.txt
      - run: "cd services/legacy-billing && pytest"

  contract-replay:
    needs: unit
    env:
      WAREHOUSE_CONTRACT_TARGET: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/legacy-billing/requirements-dev.txt
      - run: "cd services/legacy-billing && pytest contract"

  snowflake-secrets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.SNOWFLAKE_ACCOUNT != '' && secrets.SNOWFLAKE_PRIVATE_KEY != '' }}
        run: echo "present=$PRESENT" >> "$GITHUB_OUTPUT"

  contract:
    needs: [unit, snowflake-secrets]
    if: needs.snowflake-secrets.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_CONTRACT_TARGET: ${{ vars.CONSUMER_CONTRACT_TARGET || 'teradata-emulator' }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_QUERY_TAG: '{"run":"sfx-d1110","act":"consumers","consumer":"legacy-billing"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/legacy-billing/requirements-dev.txt
      - run: "cd services/legacy-billing && pytest contract"
