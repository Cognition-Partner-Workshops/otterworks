name: Stored procedure parity

on:
  push:
    paths:
      - "procs/**"
      - "services/legacy-billing/**"
      - "services/billing-service/**"
      - "frontend/client-app/src/features/billing/**"
      - "frontend/client-app/src/App.tsx"
      - "frontend/client-app/src/test-setup.ts"
      - "frontend/client-app/package.json"
      - "frontend/client-app/package-lock.json"
      - "frontend/client-app/vite.config.ts"
      - "docker-compose.procs.yml"
      - "Makefile"
  pull_request:
    paths:
      - "procs/**"
      - "services/legacy-billing/**"
      - "services/billing-service/**"
      - "frontend/client-app/src/features/billing/**"
      - "frontend/client-app/src/App.tsx"
      - "frontend/client-app/src/test-setup.ts"
      - "frontend/client-app/package.json"
      - "frontend/client-app/package-lock.json"
      - "frontend/client-app/vite.config.ts"
      - "docker-compose.procs.yml"
      - "Makefile"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/client-app/package-lock.json
      - run: uv run --with ruff==0.9.10 ruff check procs/harness
      - run: cd services/billing-service && uv sync --locked && uv run ruff check app scripts tests && uv run pytest
      - run: uv run --with psycopg[binary]==3.2.9 --with pyyaml==6.0.2 --with pytest==8.3.5 pytest procs/harness/tests
      - run: cd frontend/client-app && npm ci && npm run lint && npm test
      - run: make procs-up NS=ci
      - run: make procs-rules-gate ALL=1
      - run: make procs-parity NS=ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stored-procedure-parity-report
          path: procs/reports/parity.*
      - if: always()
        run: make procs-down NS=ci
