name: commission-service

on:
  pull_request:
    paths:
      - "services/commission-service/**"
      - ".github/workflows/commission-service.yml"
  push:
    branches: [main]
    paths:
      - "services/commission-service/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commission-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
