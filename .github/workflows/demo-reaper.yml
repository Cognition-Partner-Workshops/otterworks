name: Demo reaper (legacy data migration)

# Destroys expired legacy-data-migration demo namespaces across AWS, Azure and
# the EKS cluster. Discovery is by tag demo=legacy-data-migration + expires
# (CONTRACTS.md §3.3); each expired token runs scripts/demo-destroy.sh.

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually destroy (false = report only)"
        type: boolean
        default: true
      grace:
        description: "Grace period after expires before reaping (e.g. 15m, 2h)"
        type: string
        default: "15m"

concurrency:
  group: demo-reaper
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: otterworks-dev

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Reap expired demo namespaces
        env:
          # Azure service principal (Contributor). az login happens inside the
          # scripts; ARM_* for Terraform are derived from the same values.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # azurerm backend for infrastructure/terraform/azure (per-token key).
          TFSTATE_AZ_ACCOUNT: ${{ secrets.TFSTATE_AZ_ACCOUNT }}
          TFSTATE_AZ_RESOURCE_GROUP: ${{ secrets.TFSTATE_AZ_RESOURCE_GROUP }}
          TFSTATE_AZ_CONTAINER: ${{ secrets.TFSTATE_AZ_CONTAINER }}
          # teardown-tenant.sh drops the tenant PostgreSQL database.
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REAPER_GRACE: ${{ inputs.grace || '15m' }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$APPLY" = "true" ]; then
            MODE=--apply
          else
            MODE=--dry-run
          fi
          ./scripts/demo-reaper.sh "$MODE" --grace "$REAPER_GRACE"

      - name: Upload destroy transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-reaper-transcripts-${{ github.run_id }}
          path: .demo/**/*.log
          if-no-files-found: ignore
          retention-days: 30
