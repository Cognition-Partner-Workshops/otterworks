name: Databricks target
on:
  pull_request:
    paths: ['warehouse/databricks/**', '.github/workflows/dbx-target.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r warehouse/requirements.txt
      - run: python -m pytest warehouse/databricks/tests -q
