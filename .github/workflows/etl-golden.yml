name: ETL golden harness

on:
  push:
    paths:
      - "etl/**"
      - "docker-compose.infra.yml"
      - "scripts/localstack-init.sh"
      - "Makefile"
      - ".github/workflows/etl-golden.yml"
  pull_request:
    paths:
      - "etl/**"
      - "docker-compose.infra.yml"
      - "scripts/localstack-init.sh"
      - "Makefile"
      - ".github/workflows/etl-golden.yml"

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: latest
      - run: uv run --python 3.11 --with ruff==0.9.10 ruff check etl/tests/golden
      - run: make etl-golden-test
      - run: docker compose -f docker-compose.infra.yml up -d --wait postgres localstack meilisearch
      - run: make etl-golden SCRIPT=all MODE=check
      - run: make etl-golden SCRIPT=all MODE=repeat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: etl-golden-run-logs
          path: etl/tests/golden/.runs/**/*.log
          include-hidden-files: true
      - if: always()
        run: docker compose -f docker-compose.infra.yml down -v
