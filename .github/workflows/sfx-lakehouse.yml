name: Lakehouse foundation checks

on:
  push:
    paths:
      - "lakehouse/**"
      - ".github/workflows/sfx-lakehouse.yml"
      - "Makefile"
      - "warehouse/**"
      - "etl/**"
      - "consumers/**"
  pull_request:
    paths:
      - "lakehouse/**"
      - ".github/workflows/sfx-lakehouse.yml"
      - "Makefile"
      - "warehouse/**"
      - "etl/**"
      - "consumers/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lakehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: teradata
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d teradata" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NS: sfx-ci-after
      LEGACY_NS: sfx-ci-before
      BUSINESS_DATE: '20261109'
      ROWS_PER_TABLE: '2000'
      SFX_LH_LANDING: warehouse/landing
      TD_PG_HOST: localhost
      TD_PG_PORT: '5432'
      TD_PG_DB: teradata
      TD_PG_USER: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"
      - name: Prepare the legacy oracle without Compose
        env:
          PYTHONPATH: warehouse/teradata
        run: |
          make warehouse/.venv/.requirements SFX_TD_PYTHON=python3
          warehouse/.venv/bin/python warehouse/seed/generate.py --rows "$ROWS_PER_TABLE" --seed 1110 --business-date "$BUSINESS_DATE"
          warehouse/.venv/bin/python -m bteq.setup
          warehouse/.venv/bin/python -m bteq.load --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE"
          warehouse/.venv/bin/python warehouse/teradata/jobs/daily_chain --reuse-landing --rows "$ROWS_PER_TABLE" --business-date "$BUSINESS_DATE"
      - name: Run the users Informatica oracle
        run: |
          make lakehouse/.venv/.requirements
          lakehouse/.venv/bin/python -m lakehouse.tests.users_infa_oracle --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE"
      - name: Prepare billing stage, consumer and Informatica reference inputs
        run: |
          warehouse/.venv/bin/python -m lakehouse.billing.fixture --business-date "$BUSINESS_DATE"
          python=lakehouse/.venv/bin/python
          "$python" -m lakehouse.billing.consumer_reference --business-date "$BUSINESS_DATE"
          tables="$("$python" -c 'from warehouse.seed.columns import TABLES; print(" ".join(t.name for t in TABLES if t.area == "billing"))')"
          "$python" -m lakehouse.runtime.ingest --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE" --tables $tables STORAGE_USAGE_DAILY
          "$python" -m lakehouse.runtime.dbt --select +tag:billing
          "$python" -m lakehouse.billing.informatica --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE"
          "$python" -m lakehouse.billing.informatica_reference --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE" --replay-next-run
      - name: Prepare the audit Spark oracle on the same headered landing
        env:
          NS: ${{ env.LEGACY_NS }}
          LANDING_DIR: ${{ github.workspace }}/etl/spark/.data/${{ env.LEGACY_NS }}/landing
          SFX_SPARK_MASTER_UI_PORT: 127.0.0.1:8080
          SFX_SPARK_HISTORY_PORT: 127.0.0.1:18080
        run: |
          docker pull mirror.gcr.io/library/spark:3.5.3-scala2.12-java17-python3-ubuntu
          docker pull mirror.gcr.io/library/postgres:16
          bash etl/spark/fixture/fetch_jars.sh
          mkdir -p "etl/spark/.data/$NS"/{landing,lake,eventlogs,logs}
          chmod 777 "etl/spark/.data/$NS/lake" "etl/spark/.data/$NS/eventlogs" "etl/spark/.cache/$NS"
          python3 etl/spark/fixture/generate_fixture.py --rows "$ROWS_PER_TABLE" --seed 1110 --output "$LANDING_DIR"
          docker compose -f docker-compose.spark.yml -p "sfx-d1110-spark-$NS" up -d --wait --wait-timeout 120 --pull never
          bash etl/spark/fixture/load_tdemu.sh
          bash etl/spark/scala/build.sh
          python3 etl/spark/jobs/py/common/package.py
          for job in audit_daily_summary audit_actor_activity_join audit_archive_resort security_alert_anomaly compliance_flag_rules lake_compaction_audit; do
            JOB="$job" bash etl/spark/run.sh
          done
      - name: Run the shared-input graph and parity
        run: |
          lakehouse/.venv/bin/python -m lakehouse.parity.documents_informatica_legacy --landing "$SFX_LH_LANDING" --business-date "$BUSINESS_DATE"
          NS="$LEGACY_NS" PYTHONPATH=warehouse/teradata warehouse/.venv/bin/python -m dbql.load
          make sfx-lakehouse-run
      - name: Run the users Spark and activity-report parity graphs
        env:
          SPARK_LOCAL_IP: '127.0.0.1'
          TD_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/users_infa
          TD_JDBC_USER: postgres
        run: |
          landing="lakehouse/.data/$NS/users-extra"
          python etl/spark/fixture/generate_fixture.py --rows 70 --seed 1110 --output "$landing/spark/$BUSINESS_DATE"
          bash lakehouse/tests/users_spark_oracle.sh "$landing/spark/$BUSINESS_DATE"
          python=lakehouse/.venv/bin/python
          "$python" -m lakehouse.tests.users_activity_oracle --source "$landing/activity" --business-date "$BUSINESS_DATE"
          for dag in lakehouse_users_spark lakehouse_users_activity; do
            "$python" -m lakehouse.orchestration run --dag "$dag" --landing "$landing" --business-date "$BUSINESS_DATE"
          done
      - name: Validate coverage and assumptions
        run: make sfx-lakehouse-coverage
      - name: Test the lakehouse
        run: SFX_LH_BILLING_CONSUMER_NATIVE_TEST=1 make sfx-lakehouse-test
      - name: Upload parity and migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lakehouse-evidence
          path: lakehouse/evidence/
          if-no-files-found: error
      - name: Stop the Spark oracle
        if: always()
        run: NS="$LEGACY_NS" docker compose -f docker-compose.spark.yml -p "sfx-d1110-spark-$LEGACY_NS" down -v

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NS: sfx-ci-airflow
      SFX_LH_AF_DAG_TEST: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"
      - name: Import DAGs and verify task IDs, dependencies and templates
        run: make sfx-lakehouse-airflow-test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check pull request commits
        env:
          BASE_REF: ${{ github.base_ref || 'demo-data-platform-before' }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          "$RUNNER_TEMP/gitleaks" detect --redact --log-opts "origin/$BASE_REF..HEAD"

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Check pull request changes
        env:
          BASE_REF: ${{ github.base_ref || 'demo-data-platform-before' }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          uv run --python 3.11 --with semgrep==1.108.0 --with "setuptools<70" semgrep scan \
            --config p/default --config p/owasp-top-ten --config p/security-audit \
            --metrics off --error --baseline-commit "$base" \
            lakehouse .github/workflows/sfx-lakehouse.yml Makefile
