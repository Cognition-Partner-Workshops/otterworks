name: Spark batch checks

on:
  push:
    paths:
      - "etl/spark/**"
      - "docker-compose.spark.yml"
      - "etl/crontab"
      - ".github/workflows/sfx-spark.yml"
      - "Makefile"
  pull_request:
    paths:
      - "etl/spark/**"
      - "docker-compose.spark.yml"
      - "etl/crontab"
      - ".github/workflows/sfx-spark.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sfx-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: make sfx-spark-test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check pull request commits
        env:
          BASE_REF: ${{ github.base_ref || 'demo-snowflake-dw-exit' }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          "$RUNNER_TEMP/gitleaks" detect --redact --log-opts "origin/$BASE_REF..HEAD"

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Check pull request changes
        env:
          BASE_REF: ${{ github.base_ref || 'demo-snowflake-dw-exit' }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          uv run --python 3.11 --with semgrep==1.108.0 --with "setuptools<70" semgrep scan \
            --config p/default --config p/owasp-top-ten --config p/security-audit \
            --metrics off --error --baseline-commit "$base" \
            etl/spark docker-compose.spark.yml etl/crontab Makefile \
            .github/workflows/sfx-spark.yml demos/app/complexity/sfx-spark.json
