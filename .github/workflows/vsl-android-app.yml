name: vsl android-app

on:
  pull_request:
    branches: [demo-vuln-shared-lib]
    paths:
      - industries/mfg/vuln-shared-lib/android-app/**
      - industries/mfg/vuln-shared-lib/platform-shared/**
      - industries/mfg/vuln-shared-lib/dev-api/src/Identity/**
      - .github/workflows/vsl-android-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industries/mfg/vuln-shared-lib/android-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-apks-and-tests
          path: |
            industries/mfg/vuln-shared-lib/android-app/app/build/outputs/apk/**/*.apk
            industries/mfg/vuln-shared-lib/android-app/**/build/reports/tests/**
            industries/mfg/vuln-shared-lib/android-app/**/build/test-results/**
  ui-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: industries/mfg/vuln-shared-lib/android-app
          script: make ui-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-ui-reports
          path: |
            industries/mfg/vuln-shared-lib/android-app/app/build/reports/androidTests/**
            industries/mfg/vuln-shared-lib/android-app/app/build/outputs/androidTest-results/**
