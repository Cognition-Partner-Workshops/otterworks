name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            all:
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            actions:
              - '.github/**'
            csharp:
              - '**/*.{cs,csproj,sln,props,targets}'
              - 'services/audit-service/**'
            go:
              - '**/*.go'
              - '**/go.{mod,sum}'
              - 'services/api-gateway/**'
            java-kotlin:
              - '**/*.{java,kt,kts,gradle}'
              - '**/pom.xml'
              - 'services/{auth-service,notification-service,report-service,legacy-portal*}/**'
            javascript-typescript:
              - '**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
              - '**/package{,-lock}.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
            python:
              - '**/*.py'
              - '**/pyproject.toml'
              - '**/requirements*.txt'
              - '**/{poetry,uv,Pipfile}.lock'
            ruby:
              - '**/*.{rb,rake,gemspec}'
              - '**/Gemfile{,.lock}'
            rust:
              - '**/*.rs'
              - '**/Cargo.{toml,lock}'
      - name: Select languages
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const languages = ['actions', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust'];
          const changed = JSON.parse(process.env.CHANGES || '[]');
          const selected = process.env.EVENT_NAME !== 'pull_request' || changed.includes('all')
            ? languages : languages.filter(language => changed.includes(language));
          const matrix = selected.map(language => ({ language, 'build-mode': language === 'go' ? 'autobuild' : 'none' }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  analyze:
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
