name: gf-fleet container build

on:
  pull_request:
    paths:
      - industries/manufacturing/global-fleet/fleet-service/**
      - industries/manufacturing/global-fleet/terraform/gcp-fleet/**
      - industries/manufacturing/global-fleet/frontend/fleet/**
      - .github/workflows/gf-fleet-container.yml
  push:
    branches: [integration/global-fleet]
    paths:
      - industries/manufacturing/global-fleet/fleet-service/**
      - industries/manufacturing/global-fleet/terraform/gcp-fleet/**
      - industries/manufacturing/global-fleet/frontend/fleet/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: industries/manufacturing/global-fleet/terraform/gcp-fleet

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform -chdir="$TF_DIR" fmt -check -recursive
      - run: terraform -chdir="$TF_DIR" init -backend=false -input=false
      - run: terraform -chdir="$TF_DIR" validate

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fleet-service
            context: industries/manufacturing/global-fleet/fleet-service
          - image: fleet-web
            context: industries/manufacturing/global-fleet/frontend/fleet
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check for a Dockerfile
        id: present
        run: |
          if [ -f "${{ matrix.context }}/Dockerfile" ]; then echo "build=true" >> "$GITHUB_OUTPUT"
          else echo "build=false" >> "$GITHUB_OUTPUT"; echo "${{ matrix.context }} has no Dockerfile yet"; fi
      - name: Authenticate to Google Cloud
        if: steps.present.outputs.build == 'true' && github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Build and push
        if: steps.present.outputs.build == 'true'
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gf-fleet
          PUSH: ${{ github.event_name != 'pull_request' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        run: |
          tag="${GITHUB_SHA::12}"
          docker build -t "local/${{ matrix.image }}:${tag}" "${{ matrix.context }}"
          if [ "$PUSH" = "true" ]; then
            gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
            docker tag "local/${{ matrix.image }}:${tag}" "${REGISTRY}/${{ matrix.image }}:${tag}"
            docker push "${REGISTRY}/${{ matrix.image }}:${tag}"
          fi
