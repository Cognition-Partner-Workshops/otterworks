# The platform team's one pipeline template. Application repositories call it
# with `uses: Cognition-Partner-Workshops/otterworks/.github/workflows/platform-app-pipeline.yml@<sha>`
# and pass the same sha as standards_ref, so the policies, base images and
# chart always match the template version.
name: platform-app-pipeline

on:
  workflow_call:
    inputs:
      app_dir:
        description: Application directory holding Dockerfile and deploy/
        required: true
        type: string
      standards_ref:
        description: Commit of platform/standards to verify against
        required: true
        type: string
      run_token:
        description: Run token for tagged cloud resources (EKS stage)
        required: false
        type: string
        default: ""
      eks_deploy:
        description: Deploy to an ephemeral namespace on otterworks-dev after the kind stage passes
        required: false
        type: boolean
        default: false
    outputs:
      policy:
        value: ${{ jobs.verify.outputs.policy }}
      runtime:
        value: ${{ jobs.verify.outputs.runtime }}

env:
  REGISTRY: 599083837640.dkr.ecr.us-east-1.amazonaws.com
  AWS_REGION: us-east-1
  CONFTEST_VERSION: 0.56.0
  TRIVY_VERSION: 0.73.0
  SYFT_VERSION: 1.14.0

jobs:
  verify:
    name: verify (${{ inputs.app_dir }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      policy: ${{ steps.policy.outcome }}
      runtime: ${{ steps.kind.outcome }}
      app: ${{ steps.meta.outputs.app }}
      image: ${{ steps.meta.outputs.image }}
    env:
      APP_DIR: ${{ inputs.app_dir }}
      STANDARDS_REF: ${{ inputs.standards_ref }}
      RUN_TOKEN: ${{ inputs.run_token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check out platform standards at ${{ inputs.standards_ref }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: Cognition-Partner-Workshops/otterworks
          ref: ${{ inputs.standards_ref }}
          path: .standards
          sparse-checkout: platform/standards
      - name: Install conftest, Trivy and Syft
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz -C "$HOME/bin" conftest
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C "$HOME/bin" trivy
          curl -sSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin" syft
      - id: meta
        name: Image name
        run: |
          app="$(basename "$APP_DIR")"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/otterworks/bank-${app}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          { echo "APP=$app"; echo "IMAGE=${REGISTRY}/otterworks/bank-${app}"; echo "TAG=${GITHUB_SHA::12}"; } >> "$GITHUB_ENV"
      - id: unit
        name: Unit tests (Dockerfile test stage)
        run: docker build --target test --progress plain "$APP_DIR"
      - id: build
        name: Container build
        run: docker build --progress plain -t "$IMAGE:$TAG" "$APP_DIR"
      - id: trivy
        name: Image scan (Trivy, vulnerabilities and secrets)
        run: |
          trivy image --no-progress --scanners vuln,secret \
            --secret-config .standards/platform/standards/policy/trivy/secret-rules.yaml \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output trivy.txt "$IMAGE:$TAG"; rc=$?
          trivy image --no-progress --scanners secret \
            --secret-config .standards/platform/standards/policy/trivy/secret-rules.yaml \
            --severity HIGH,CRITICAL --exit-code 1 \
            --format table --output trivy-secrets.txt "$IMAGE:$TAG" || rc=1
          cat trivy-secrets.txt >> trivy.txt; cat trivy.txt; exit $rc
      - id: sbom
        name: SBOM (Syft)
        if: always() && steps.build.outcome == 'success'
        run: syft "$IMAGE:$TAG" -o spdx-json=sbom.spdx.json -q && jq '.packages | length' sbom.spdx.json
      - id: policy
        name: Policy gate (conftest)
        if: always() && steps.build.outcome == 'success'
        run: |
          .standards/platform/standards/scripts/policy-check.sh "$APP_DIR" \
            "$IMAGE" "$TAG" 2>&1 | tee policy.txt
          exit "${PIPESTATUS[0]}"
      - name: Create kind cluster
        if: steps.policy.outcome == 'success' && steps.trivy.outcome == 'success'
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: platform-verify
      - id: kind
        name: Runtime verification (kind + Kyverno + smoke)
        if: steps.policy.outcome == 'success' && steps.trivy.outcome == 'success'
        env:
          OUT: ${{ runner.temp }}/runtime
        run: .standards/platform/standards/scripts/kind-verify.sh "$APP_DIR" "$IMAGE" "$TAG"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: evidence-${{ steps.meta.outputs.app }}
          path: |
            trivy.txt
            sbom.spdx.json
            policy.txt
            ${{ runner.temp }}/runtime
          if-no-files-found: ignore
      - name: Report to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_UNIT: ${{ steps.unit.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_TRIVY: ${{ steps.trivy.outcome }}
          OUT_SBOM: ${{ steps.sbom.outcome }}
          OUT_POLICY: ${{ steps.policy.outcome }}
          OUT_KIND: ${{ steps.kind.outcome }}
        run: |
          mark() { case "$1" in success) echo "pass";; failure) echo "**FAIL**";; *) echo "skipped";; esac; }
          {
            echo "### Platform pipeline: \`$APP\`"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit tests | $(mark "$OUT_UNIT") |"
            echo "| Container build | $(mark "$OUT_BUILD") |"
            echo "| Image scan (Trivy) | $(mark "$OUT_TRIVY") |"
            echo "| SBOM (Syft) | $(mark "$OUT_SBOM") |"
            echo "| Policy gate (conftest) | $(mark "$OUT_POLICY") |"
            echo "| Runtime on kind (Kyverno + smoke) | $(mark "$OUT_KIND") |"
            echo
            echo "Standards commit \`$STANDARDS_REF\`, image \`$IMAGE:$TAG\`. Evidence (scan, SBOM, policy output, pod logs and events) is in the run's \`evidence-$APP\` artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -s policy.txt ] && grep -q '^FAIL' policy.txt; then echo; echo '```'; grep '^FAIL' policy.txt; echo '```'; fi
            if [ -s trivy.txt ] && [ "$OUT_TRIVY" = failure ]; then echo; echo '<details><summary>Trivy findings</summary>'; echo; echo '```'; head -60 trivy.txt; echo '```'; echo '</details>'; fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file report.md || true
      - name: Fail when a gate failed
        if: always()
        env:
          OUT_UNIT: ${{ steps.unit.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_TRIVY: ${{ steps.trivy.outcome }}
          OUT_SBOM: ${{ steps.sbom.outcome }}
          OUT_POLICY: ${{ steps.policy.outcome }}
          OUT_KIND: ${{ steps.kind.outcome }}
        run: |
          for s in "$OUT_UNIT" "$OUT_BUILD" "$OUT_TRIVY" "$OUT_SBOM" "$OUT_POLICY" "$OUT_KIND"; do
            [ "$s" = failure ] && exit 1
          done; exit 0

  # The EKS stage is two jobs so code from the pull request never runs where an
  # OIDC token can be minted: eks-build builds the image and reads the values
  # with read-only permissions, and eks-deploy only loads that image, pushes it
  # and deploys with the standards chart.
  eks-build:
    name: ephemeral image (${{ inputs.app_dir }})
    needs: verify
    if: inputs.eks_deploy && vars.BANK_W1_EKS == 'true' && needs.verify.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      workload: ${{ steps.build.outputs.workload }}
      chart_app: ${{ steps.build.outputs.chart_app }}
    env:
      APP_DIR: ${{ inputs.app_dir }}
      RUN_TOKEN: ${{ inputs.run_token }}
      APP: ${{ needs.verify.outputs.app }}
      IMAGE: ${{ needs.verify.outputs.image }}
    steps:
      - name: Check the run token
        run: |
          [[ "$RUN_TOKEN" =~ ^[a-z0-9]{3,12}$ ]] || { echo "eks_deploy needs a run_token of 3-12 lowercase letters or digits"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build the image and collect the deploy values
        id: build
        run: |
          tag="${GITHUB_SHA::12}"
          docker build -q -t "$IMAGE:$tag" "$APP_DIR"
          mkdir -p .eks
          docker save "$IMAGE:$tag" | gzip > .eks/image.tar.gz
          cp "$APP_DIR/deploy/values.yaml" .eks/values.yaml
          [ -f "$APP_DIR/deploy/values-eks.yaml" ] && cp "$APP_DIR/deploy/values-eks.yaml" .eks/values-eks.yaml
          read -r workload chart_app < <(python3 -c "import yaml,os;d='.eks/';v={'workload':'web','app':os.environ['APP']}
          for f in ('values.yaml','values-eks.yaml'):
            try: v.update({k:x for k,x in (yaml.safe_load(open(d+f)) or {}).items() if k in v})
            except FileNotFoundError: pass
          print(v['workload'],v['app'])")
          [[ "$workload" =~ ^(web|cronjob)$ ]] || { echo "unknown workload '$workload'"; exit 1; }
          [[ "$chart_app" =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]] || { echo "chart app '$chart_app' is not a DNS label"; exit 1; }
          { echo "tag=$tag"; echo "workload=$workload"; echo "chart_app=$chart_app"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: eks-${{ needs.verify.outputs.app }}
          path: .eks/
          include-hidden-files: true
          retention-days: 1

  eks-deploy:
    name: ephemeral namespace (${{ inputs.app_dir }})
    needs: [verify, eks-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      RUN_TOKEN: ${{ inputs.run_token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      APP: ${{ needs.verify.outputs.app }}
      IMAGE: ${{ needs.verify.outputs.image }}
      TAG: ${{ needs.eks-build.outputs.tag }}
      WORKLOAD: ${{ needs.eks-build.outputs.workload }}
      CHART_APP: ${{ needs.eks-build.outputs.chart_app }}
      NAMESPACE: bank-w1-${{ inputs.run_token }}-pr${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: Cognition-Partner-Workshops/otterworks
          ref: ${{ inputs.standards_ref }}
          path: .standards
          sparse-checkout: platform/standards
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: eks-${{ needs.verify.outputs.app }}
          path: .eks
      - name: Load the image built without cloud credentials
        run: gunzip -c .eks/image.tar.gz | docker load -q
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Push the image to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker push -q "$IMAGE:$TAG"
      - name: Deploy with Helm to ${{ env.NAMESPACE }}
        run: |
          aws eks update-kubeconfig --name otterworks-dev --region "$AWS_REGION"
          epoch=$(( $(date -u +%s) + 72 * 3600 ))
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          # managed-by=otterworks-tenant puts the namespace in the tenant reaper's
          # expiry sweep; the demo-platform reaper leaves non otterworks-* names alone.
          kubectl label namespace "$NAMESPACE" --overwrite demo/run-token="$RUN_TOKEN" \
            platform.otterworks.dev/policy=enforced app.kubernetes.io/part-of=bank-wave1 \
            app.kubernetes.io/managed-by=otterworks-tenant
          kubectl annotate namespace "$NAMESPACE" --overwrite \
            demo/expires-at="$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" demo/expires-at-epoch="$epoch"
          values=(-f .eks/values.yaml)
          [ -f .eks/values-eks.yaml ] && values+=(-f .eks/values-eks.yaml)
          extra=()
          if [ "$WORKLOAD" = web ]; then
            host="${APP}-pr$PR_NUMBER.$RUN_TOKEN.bank-w1.otterworks.app"
            extra=(--set ingress.enabled=true --set ingress.host="$host")
            echo "HOST=$host" >> "$GITHUB_ENV"
          fi
          chart=(.standards/platform/standards/helm/app -n "$NAMESPACE" "${values[@]}" \
            --set image.repository="$IMAGE" --set image.tag="$TAG" "${extra[@]}")
          # The values come from the pull request. Render them first and refuse
          # anything the chart would not emit on its own before helm touches the cluster.
          helm template "$APP" "${chart[@]}" > .eks/rendered.yaml
          python3 - .eks/rendered.yaml <<'PY'
          import os, sys, yaml
          allowed = {"Deployment", "CronJob", "Service", "Ingress", "ConfigMap", "NetworkPolicy", "ServiceMonitor"}
          ns, bad = os.environ["NAMESPACE"], []
          for d in yaml.safe_load_all(open(sys.argv[1])):
              if not d:
                  continue
              kind, meta = d.get("kind"), d.get("metadata") or {}
              if kind not in allowed:
                  bad.append(f"kind {kind}")
              if meta.get("namespace") not in (None, ns):
                  bad.append(f"{kind} {meta.get('name')} targets namespace {meta.get('namespace')}")
              if kind == "Service" and (d.get("spec") or {}).get("type", "ClusterIP") != "ClusterIP":
                  bad.append(f"Service {meta.get('name')} is not ClusterIP")
          if bad:
              sys.exit("rendered chart rejected: " + "; ".join(bad))
          PY
          helm upgrade --install "$APP" "${chart[@]}" --create-namespace --wait --timeout 5m
      - name: Smoke test
        run: |
          if [ "$WORKLOAD" = web ]; then
            for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/health"); [ "$code" = 200 ] && break; sleep 10; done
            echo "https://$HOST/health -> $code"; [ "$code" = 200 ]
          else
            kubectl -n "$NAMESPACE" create job "$CHART_APP-smoke-${GITHUB_RUN_ID}" --from="cronjob/$CHART_APP"
            kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$CHART_APP-smoke-${GITHUB_RUN_ID}" --timeout=10m
          fi
      - name: Report hostname
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Ephemeral namespace \`$NAMESPACE\`: https://${HOST:-not-deployed}/health ($JOB_STATUS)" || true
