name: ETL

on:
  push:
    branches: [main, workshop, 'workshop-**']
    paths:
      - 'etl/**'
      - '.gitignore'
      - '.github/workflows/etl.yml'
  pull_request:
    branches: [main, workshop, 'review-base-**', 'demo-**']
    paths:
      - 'etl/**'
      - '.gitignore'
      - '.github/workflows/etl.yml'

permissions:
  contents: read

jobs:
  etl-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.4 ruff==0.16.10
      - run: python -m py_compile scripts/*.py
      - run: ruff check --isolated scripts/etl_config.py tests/
      - run: python -m pytest tests -q
