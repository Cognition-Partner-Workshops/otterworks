name: TP Airbyte Ingestion

# Airbyte Cloud pipelines are code: every change to ingestion/airbyte is a PR.
# Pull requests get fmt/validate plus a real `terraform plan` (posted as a
# comment); pushes to a tp-run/* branch apply the plan.
#
# Repository secrets required (never committed): AIRBYTE_WORKSPACE_ID,
# AIRBYTE_CLIENT_ID, AIRBYTE_CLIENT_SECRET, DATABRICKS_DEMO_HOST,
# DATABRICKS_AIRBYTE_CLIENT_ID, DATABRICKS_AIRBYTE_CLIENT_SECRET (OAuth2 service
# principal for the destination), AWS_ROLE_ARN (OIDC role that can read/write the
# otterworks-terraform-state bucket and manage ow-tp-airbyte-* resources).

on:
  pull_request:
    branches: [tech-partnerships, 'tp-run/**']
    paths: ['ingestion/airbyte/**', '.github/workflows/tp-airbyte.yml']
  push:
    branches: ['tp-run/**']
    paths: ['ingestion/airbyte/**']
  workflow_dispatch:
    inputs:
      namespace:
        description: Run namespace (NS)
        default: demo

concurrency:
  group: tp-airbyte-${{ github.event.inputs.namespace || 'demo' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  NS: ${{ github.event.inputs.namespace || 'demo' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: ingestion/airbyte

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py

  plan:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -backend-config="key=ow-tp/airbyte/${NS}.tfstate"
      - name: Plan
        id: plan
        env:
          TF_VAR_namespace: ${{ env.NS }}
          TF_VAR_airbyte_workspace_id: ${{ secrets.AIRBYTE_WORKSPACE_ID }}
          TF_VAR_airbyte_client_id: ${{ secrets.AIRBYTE_CLIENT_ID }}
          TF_VAR_airbyte_client_secret: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
          TF_VAR_databricks_host: ${{ secrets.DATABRICKS_DEMO_HOST }}
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_AIRBYTE_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_AIRBYTE_CLIENT_SECRET }}
        run: |
          set +e
          terraform plan -no-color -out=tfplan > plan.txt 2>&1
          ec=$?
          cat plan.txt
          exit $ec
      - name: Post plan on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('ingestion/airbyte/plan.txt', 'utf8');
            const trimmed = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Airbyte terraform plan (NS=${process.env.NS})\n\n<details><summary>plan output</summary>\n\n\`\`\`\n${trimmed}\n\`\`\`\n</details>`,
            });
      - name: Apply (tp-run/* push only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_namespace: ${{ env.NS }}
          TF_VAR_airbyte_workspace_id: ${{ secrets.AIRBYTE_WORKSPACE_ID }}
          TF_VAR_airbyte_client_id: ${{ secrets.AIRBYTE_CLIENT_ID }}
          TF_VAR_airbyte_client_secret: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
          TF_VAR_databricks_host: ${{ secrets.DATABRICKS_DEMO_HOST }}
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_AIRBYTE_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_AIRBYTE_CLIENT_SECRET }}
        run: terraform apply -no-color tfplan
