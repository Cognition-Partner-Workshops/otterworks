name: Warehouse migration

on:
  pull_request:
    paths:
      - 'migration/parity/**'
      - 'migration/loader/**'
      - 'migration/target/snowflake/**'
      - '.github/workflows/warehouse-migration.yml'
  push:
    branches: [main]
    paths:
      - 'migration/parity/**'
      - 'migration/loader/**'
      - 'migration/target/snowflake/**'
      - '.github/workflows/warehouse-migration.yml'

permissions:
  contents: read

jobs:
  warehouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests and lint
        run: |
          for package in migration/parity migration/loader; do
            if [ -f "$package/pyproject.toml" ]; then
              python -m pip install -e "$package[dev]"
              python -m ruff check "$package"
              python -m pytest "$package/tests" -q
            fi
          done
      - name: Build local target
        working-directory: migration/target/snowflake
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          python -m pip install -r requirements.txt
          python -m ruff check scripts
          python -m pytest scripts -q
          dbt build --profiles-dir . --target duckdb
