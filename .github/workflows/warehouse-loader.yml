name: Warehouse loader
on:
  pull_request:
    paths: ['migration/loader/**', '.github/workflows/warehouse-loader.yml']
permissions:
  contents: read
jobs:
  loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'migration/loader[dev]'
      - run: python -m ruff check migration/loader
      - run: python -m pytest migration/loader/tests -q
