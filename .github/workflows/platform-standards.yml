# Self-test for platform/standards: the policy gate passes the sample service
# and fails each broken rule, then the pipeline template runs end to end on
# the sample service at this commit.
name: platform-standards

on:
  pull_request:
    paths:
      - platform/standards/**
      - .github/workflows/platform-app-pipeline.yml
      - .github/workflows/platform-standards.yml
  push:
    branches: [main]
    paths:
      - platform/standards/**
      - .github/workflows/platform-app-pipeline.yml

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  policy-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      - name: Install conftest
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz -C "$HOME/bin" conftest
      - run: helm lint platform/standards/helm/app -f platform/standards/examples/sample-service/deploy/values.yaml --set image.repository=r,image.tag=t
      - run: platform/standards/scripts/selftest.sh

  sample-service:
    needs: policy-selftest
    uses: ./.github/workflows/platform-app-pipeline.yml
    with:
      app_dir: platform/standards/examples/sample-service
      standards_ref: ${{ github.event.pull_request.head.sha || github.sha }}
