name: Functional-equivalence gate

on:
  push:
    paths:
      - "security/equivalence/**"
      - "services/document-service/**"
      - "Makefile"
  pull_request:
    paths:
      - "security/equivalence/**"
      - "services/document-service/**"
      - "Makefile"

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
      # The harness shells into the module and runs its emitter and its suite with
      # the module's own toolchain, so document-service must be installed.
      - run: pipx install poetry==1.8.5
      - run: poetry install --no-interaction
        working-directory: services/document-service
      - run: uv run --with ruff==0.9.10 ruff check --config security/equivalence/harness/ruff.toml security/equivalence/harness
      - run: make eq-list
      # eq-gate reads the fingerprints and grades each finding for the state it is
      # actually in: the recorded before-state must still reproduce exactly, and a
      # refactored subject must keep every contract case byte-identical while its
      # attack cases stop firing. Exit 2 is "no verdict" (missing, stale or
      # unmeasured evidence) and fails the job rather than passing quietly.
      - run: make eq-gate
      # Independent of the recordings: every finding whose subject changed must
      # produce a closed exploit verdict from at least one registered attack case.
      # A refactor that deletes its attack coverage exits 3 here instead of
      # sailing through on the contract cases alone.
      - run: make eq-exploit-refactored
      # The module suite is a regression gate against the pass list recorded with
      # the evidence, so a test that used to pass cannot be deleted to go green.
      - run: make eq-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: equivalence-reports
          path: security/equivalence/reports/*.json
