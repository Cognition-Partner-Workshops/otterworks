name: Workload attribution

on:
  pull_request:
    paths:
      - "workloads/**"
      - ".github/workflows/workloads-attribution.yml"
  push:
    branches: [demo-stack-snowflake]
    paths:
      - "workloads/**"
      - ".github/workflows/workloads-attribution.yml"

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r workloads/attribution/requirements.txt ruff==0.9.10
      - run: ruff check workloads/attribution
      - run: pytest workloads/attribution/tests -v
      - run: python workloads/attribution/validate_provenance.py
