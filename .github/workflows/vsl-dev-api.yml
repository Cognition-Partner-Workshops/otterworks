name: vsl dev-api

on:
  pull_request:
    branches: [demo-vuln-shared-lib]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - industries/mfg/vuln-shared-lib/dev-api/**
      - industries/mfg/vuln-shared-lib/platform-shared/**
      - .github/workflows/vsl-dev-api.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: vsl-dev-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  local-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: make vsl-pack
      - run: make -C industries/mfg/vuln-shared-lib/dev-api test

  github-packages:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/industries/mfg/vuln-shared-lib/dev-api/.nuget/packages
    defaults:
      run:
        working-directory: industries/mfg/vuln-shared-lib/dev-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Configure package source
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget remove source vsl-local --configfile nuget.config
          dotnet nuget add source https://nuget.pkg.github.com/Cognition-Partner-Workshops/index.json --name github-packages --username "$NUGET_USERNAME" --password "$NUGET_PASSWORD" --store-password-in-clear-text --configfile nuget.config
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("nuget.config")
          mapping = ET.SubElement(tree.getroot(), "packageSourceMapping")
          for source, pattern in [("github-packages", "Platform.Shared"), ("nuget.org", "*")]:
              entry = ET.SubElement(mapping, "packageSource", key=source)
              ET.SubElement(entry, "package", pattern=pattern)
          tree.write("nuget.config", encoding="utf-8", xml_declaration=True)
          PY
      - run: dotnet restore DevApi.sln
      - run: dotnet build DevApi.sln --no-restore -c Release
      - run: dotnet test DevApi.sln --no-build -c Release
