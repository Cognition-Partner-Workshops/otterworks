name: Client E2E

on:
  pull_request:
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  workflow_dispatch:

jobs:
  client-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/client-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run landing page specs
        run: npx playwright test e2e/landing.spec.ts
      - name: Run mocked margins spec
        run: npx playwright test e2e/margins.spec.ts --grep "renders a mocked SKU row" --repeat-each=10
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            frontend/client-app/playwright-report/
            frontend/client-app/test-results/
          if-no-files-found: ignore
