name: Client E2E

on:
  pull_request:
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  workflow_dispatch:

jobs:
  client-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run landing page specs
        run: npx playwright test e2e/landing.spec.ts
      - name: Run mocked margins spec
        run: npx playwright test e2e/margins.spec.ts --grep "renders a mocked SKU row" --repeat-each=10
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/client-app/playwright-report/
            frontend/client-app/test-results/
          if-no-files-found: ignore
