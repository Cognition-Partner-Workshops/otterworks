name: Client E2E

on:
  pull_request:
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/client-app/**"
      - ".github/workflows/client-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/client-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/client-app/package-lock.json
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run landing page specs
        run: npx playwright test e2e/landing.spec.ts
      - name: Run mocked margins spec
        run: npx playwright test e2e/margins.spec.ts --grep "renders a mocked SKU row" --repeat-each=10
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            frontend/client-app/playwright-report/
            frontend/client-app/test-results/
          if-no-files-found: ignore
