name: Databricks landing contract
on:
  pull_request:
    paths: ['warehouse/databricks_operate/**', '.github/workflows/dbx-operate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.4.2
      - run: python -m pytest warehouse/databricks_operate/tests -q
