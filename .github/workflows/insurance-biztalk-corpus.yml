name: Insurance BizTalk corpus

on:
  push:
    paths:
      - "industries/insurance/biztalk-claims-intake/**"
      - "tools/xslt-golden/**"
      - ".github/workflows/insurance-biztalk-corpus.yml"
  pull_request:
    paths:
      - "industries/insurance/biztalk-claims-intake/**"
      - "tools/xslt-golden/**"
      - ".github/workflows/insurance-biztalk-corpus.yml"

jobs:
  goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industries/insurance/biztalk-claims-intake
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: make deps && pip install pytest==8.3.3
      - run: python -m pytest ../../../tools/xslt-golden/tests -q
      - name: Corpus is reproducible
        run: |
          make corpus
          git diff --exit-code -- corpus/inputs corpus/stubs
      - name: Goldens match
        run: make check
