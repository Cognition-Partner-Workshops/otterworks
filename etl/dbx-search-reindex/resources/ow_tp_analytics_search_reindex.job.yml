resources:
  jobs:
    ow_tp_analytics_search_reindex:
      name: ow_tp_analytics_search_reindex
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ensure_objects
          max_retries: 2
          min_retry_interval_millis: 60000
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ensure_objects.sql
        - task_key: reindex_docs
          depends_on:
            - task_key: ensure_objects
          max_retries: 2
          min_retry_interval_millis: 60000
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/reindex_docs.sql
        - task_key: reindex_report
          depends_on:
            - task_key: reindex_docs
          max_retries: 2
          min_retry_interval_millis: 60000
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/reindex_report.sql
