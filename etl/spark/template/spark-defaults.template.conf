# Common Spark template: appended to etl/spark/conf/spark-defaults.conf by submit.sh.
# Adaptive execution: AQE sizes shuffle partitions at runtime instead of a fixed
# spark.sql.shuffle.partitions, and splits skewed join partitions.
spark.sql.adaptive.enabled                              true
spark.sql.adaptive.coalescePartitions.enabled           true
spark.sql.adaptive.coalescePartitions.parallelismFirst  false
spark.sql.adaptive.skewJoin.enabled                     true
# Partition sizing: input splits and post-shuffle partitions target ~128 MiB / 64 MiB.
spark.sql.files.maxPartitionBytes                       134217728
spark.sql.adaptive.advisoryPartitionSizeInBytes         67108864
# Retries inside the application (task and stage); submit.sh retries the whole application.
spark.task.maxFailures                                  4
spark.stage.maxConsecutiveAttempts                      4
# Idempotent writes: partitioned overwrites replace only the partitions written; whole-dataset
# outputs are written to a staging path and swapped in by submit.sh.
spark.sql.sources.partitionOverwriteMode                dynamic
