apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: "SparkApplication"
metadata:
  name: "sfx-d1110-file-object-binary-extract"
  namespace: "sfx-d1110-before"
  labels:
    otterworks.run-token: "sfx-d1110"
spec:
  type: "Python"
  pythonVersion: "3"
  mode: "cluster"
  image: "mirror.gcr.io/library/spark:3.5.3-scala2.12-java17-python3-ubuntu"
  imagePullPolicy: "IfNotPresent"
  mainApplicationFile: "local:///opt/sfx/spark/jobs/py/file_object_binary_extract.py"
  sparkVersion: "3.5.3"
  restartPolicy:
    type: "Never"
  dynamicAllocation:
    enabled: true
    initialExecutors: 1
    minExecutors: 1
    maxExecutors: 4
  sparkConf:
    spark.eventLog.dir: "/opt/spark-events"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.adaptive.skewJoin.enabled: "true"
    spark.sql.adaptive.advisoryPartitionSizeInBytes: "134217728"
    spark.dynamicAllocation.shuffleTracking.enabled: "true"
    spark.shuffle.service.enabled: "false"
    spark.dynamicAllocation.executorIdleTimeout: "15s"
    spark.dynamicAllocation.shuffleTracking.timeout: "120s"
    spark.sql.files.maxPartitionBytes: "134217728"
    spark.sql.shuffle.partitions: "48"
    spark.sql.sources.partitionOverwriteMode: "dynamic"
    spark.task.maxFailures: "4"
    spark.eventLog.enabled: "true"
    spark.eventLog.compress: "true"
    spark.eventLog.compression.codec: "zstd"
    spark.driver.extraClassPath: "/opt/sfx/spark/.cache/jars/*"
    spark.executor.extraClassPath: "/opt/sfx/spark/.cache/jars/*"
  deps:
    pyFiles:
      - "local:///opt/sfx/spark/.cache/common.zip"
  volumes:
    - name: "workspace"
      persistentVolumeClaim:
        claimName: "sfx-d1110-workspace"
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: "sfx-d1110-spark"
    labels:
      otterworks.run-token: "sfx-d1110"
    volumeMounts:
      - name: "workspace"
        mountPath: "/opt/sfx/spark"
        readOnly: true
      - name: "workspace"
        mountPath: "/opt/landing"
        subPath: ".data/landing"
        readOnly: true
      - name: "workspace"
        mountPath: "/opt/lake"
        subPath: ".data/lake"
      - name: "workspace"
        mountPath: "/opt/spark-events"
        subPath: ".data/eventlogs"
  executor:
    cores: 1
    memory: "1g"
    labels:
      otterworks.run-token: "sfx-d1110"
    volumeMounts:
      - name: "workspace"
        mountPath: "/opt/sfx/spark"
        readOnly: true
      - name: "workspace"
        mountPath: "/opt/landing"
        subPath: ".data/landing"
        readOnly: true
      - name: "workspace"
        mountPath: "/opt/lake"
        subPath: ".data/lake"
      - name: "workspace"
        mountPath: "/opt/spark-events"
        subPath: ".data/eventlogs"
