apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "__RUN_TOKEN__-spark"
  namespace: "__BEFORE_NAMESPACE__"
  labels:
    otterworks.run-token: "__RUN_TOKEN__"
rules:
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "services"
      - "configmaps"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
      - "delete"
      - "deletecollection"
      - "patch"
      - "update"
