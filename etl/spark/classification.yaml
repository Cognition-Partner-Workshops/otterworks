- job: lake_compaction_documents
  language: scala
  target: retired
  reason: "Retires a parquet-only compactor whose sole input is the lake export replaced by the docs_event_export_hourly Snowflake table and whose output has no in-repository reader."
  original_target: spark_standard_template
  change_reason: "Moving its sole producer docs_event_export_hourly to one Snowflake table removes the active lake-layout dependency, so compaction no longer needs a replacement job."
- job: lake_compaction_audit
  language: python
