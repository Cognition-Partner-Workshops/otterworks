resources:
  jobs:
    custbill_chain:
      name: custbill_chain
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 10 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/ingest_placeholder.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: parse
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/parse_placeholder.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: report
          depends_on:
            - task_key: parse
          sql_task:
            file:
              path: ../src/report_placeholder.sql
            warehouse_id: ${var.warehouse_id}
