resources:
  jobs:
    ow_tp_analytics_daily:
      name: ow_tp_analytics_daily
      max_concurrent_runs: 1
      description: >-
        Daily analytics aggregation (converted etl/scripts/analytics_daily.py):
        reads the day's event snapshot landed in the analytics_drop volume
        (converted SQS otterworks-analytics drain + DynamoDB
        otterworks-analytics-events scan pair), recomputes the daily rollup in
        SQL, merges one summary row into
        ow_tp_analytics.analytics_daily_summary and the daily report row into
        ow_tp_analytics.analytics_daily_report.
      schedule:
        quartz_cron_expression: "0 15 3 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: ds
          default: "{{job.start_time.iso_date}}"
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - boto3
      tasks:
        - task_key: ensure_objects
          sql_task:
            file:
              path: ../src/ensure_objects.sql
            warehouse_id: ${var.warehouse_id}
          retry_on_timeout: false
          min_retry_interval_millis: 30000
          max_retries: 2
        - task_key: extract_analytics_events
          depends_on:
            - task_key: ensure_objects
          environment_key: default
          spark_python_task:
            python_file: ../tools/analytics_extract.py
            parameters:
              - "--ds"
              - "{{job.parameters.ds}}"
              - "--out"
              - "/Volumes/ow_tp/ow_tp_analytics/analytics_drop/analytics_events_{{job.parameters.ds}}.jsonl"
          retry_on_timeout: false
          min_retry_interval_millis: 30000
          max_retries: 2
        - task_key: run_analytics_daily
          depends_on:
            - task_key: extract_analytics_events
          sql_task:
            file:
              path: ../src/run_analytics_daily.sql
            warehouse_id: ${var.warehouse_id}
            parameters:
              ds: "{{job.parameters.ds}}"
          retry_on_timeout: false
          min_retry_interval_millis: 30000
          max_retries: 2
