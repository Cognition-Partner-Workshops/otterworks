rules:
  - id: generic.secrets.hardcoded-password
    languages: [generic]
    severity: ERROR
    message: Read database passwords from the runtime environment, not INI files.
    paths:
      include: ["*.ini"]
    pattern-regex: '(?m)^[ \t]*password[ \t]*=[ \t]*[^\s;#][^\r\n]*'
  - id: bash.secrets.hardcoded-jdbc-password
    languages: [generic]
    severity: ERROR
    message: Validate and export the inherited JDBC password without assigning it.
    paths:
      include: ["*.sh"]
    pattern-regex: '\bTD_JDBC_PASSWORD[ \t]*=[^\r\n]*'
