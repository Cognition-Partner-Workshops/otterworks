# Local rating estate: the nightly batch, the online quote screen and the
# modern rating service, all reading the same flat-file tables.
#   make insrules-up | insrules-parity | insrules-down | insrules-reset
# Direct rating-batch runs require a writable legacy-rating/build directory first.
# Set INSRULES_BATCH_UID and INSRULES_BATCH_GID to its owner's IDs (0:0 on rootless Docker).
# SonarQube runs under the "sonar" profile: make insrules-sonar-up
services:
  rating-batch:
    build: ./legacy-rating/cobol
    profiles: ["batch"]
    user: "${INSRULES_BATCH_UID:-1000}:${INSRULES_BATCH_GID:-1000}"
    environment:
      RATEPREM_TABLES: /estate/tables
    volumes:
      - ./legacy-rating/tables:/estate/tables:ro
      - ./legacy-rating/fixtures:/estate/fixtures:ro
      - type: bind
        source: ./legacy-rating/build
        target: /estate/build
        bind:
          create_host_path: false

  quote-screen:
    build: ./legacy-rating/smalltalk
    environment:
      RATEPREM_TABLES: /estate/tables
    volumes:
      - ./legacy-rating/tables:/estate/tables:ro
      - ./legacy-rating/fixtures:/estate/fixtures:ro
      - ./legacy-rating/build:/estate/build
    ports:
      - "127.0.0.1:${INSRULES_SCREEN_PORT:-8091}:8091"

  modern-rating:
    build: ./modern-rating
    environment:
      RATING_TABLES_DIR: /estate/tables
    volumes:
      - ./legacy-rating/tables:/estate/tables:ro
      - ./legacy-rating/fixtures:/estate/fixtures:ro
      - ./legacy-rating/build:/estate/build
    ports:
      - "127.0.0.1:${INSRULES_MODERN_PORT:-8092}:8092"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  sonarqube:
    image: mirror.gcr.io/library/sonarqube:10.7-community
    profiles: ["sonar"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${INSRULES_SONAR_PORT:-9000}:9000"
    volumes:
      - insrules-sonar-data:/opt/sonarqube/data

volumes:
  insrules-sonar-data:
