# Characterization stack for report-service (UPGRADE_GUIDE.md: pin behaviour before the upgrade).
# Three instances of the same image, one per ARCHIVE_STORE value (unset, db2, postgresql), all with
# TZ=America/Chicago as in docker-compose.yml and infrastructure/helm/report-service/values.yaml.
# Driven by run.sh; nothing here is deployed anywhere.
name: report-char

x-report-service: &report-service
  image: ${REPORT_IMAGE:-report-service:characterization}
  build:
    context: ..
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    upstream-stub:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
    interval: 5s
    timeout: 5s
    retries: 30
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

x-report-env: &report-env
  TZ: America/Chicago
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: otterworks_reports
  DB_USER: otterworks
  DB_PASSWORD: otterworks_dev
  REPORT_OUTPUT_DIR: /tmp/reports

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: otterworks
      POSTGRES_PASSWORD: otterworks_dev
      POSTGRES_DB: otterworks
    volumes:
      - ./fixtures/postgres:/docker-entrypoint-initdb.d:ro
      - ../../../migration/target/postgresql:/ldm-ddl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otterworks && psql -U otterworks -d otterworks_archive -tAc 'SELECT 1 FROM mig.runs LIMIT 1' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Deterministic analytics / audit / auth upstreams so generated files are reproducible.
  upstream-stub:
    image: python:3.12-alpine
    command: ["python", "/stub/upstream_stub.py"]
    volumes:
      - ./stub:/stub:ro

  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: char_db2_pw
      DBNAME: CHARDB
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      SAMPLEDB: "false"
    volumes:
      - ./fixtures/db2:/fixtures:ro
      - ../../../migration/source/db2/ddl:/ldm-ddl:ro

  # ARCHIVE_STORE unset: the golden default (archive feature off).
  report-off:
    <<: *report-service
    ports: ["18091:8091"]
    environment:
      <<: *report-env
      ANALYTICS_SERVICE_URL: http://upstream-stub:8080
      AUDIT_SERVICE_URL: http://upstream-stub:8080
      AUTH_SERVICE_URL: http://upstream-stub:8080

  # ARCHIVE_STORE=db2: BEFORE deployments (Db2 archive read path, Helm db2-archive service).
  report-db2:
    <<: *report-service
    ports: ["18092:8091"]
    environment:
      <<: *report-env
      ARCHIVE_STORE: db2
      LDM_NAMESPACE: char-before
      DB2_HOST: db2
      DB2_PORT: "50000"
      DB2_DATABASE: CHARDB
      DB2_USER: db2inst1
      DB2_PASSWORD: char_db2_pw
      # Upstreams unreachable on purpose: pins the sample-data / failure fallbacks.
      ANALYTICS_SERVICE_URL: http://unreachable.invalid:9
      AUDIT_SERVICE_URL: http://unreachable.invalid:9
      AUTH_SERVICE_URL: http://unreachable.invalid:9

  # ARCHIVE_STORE=postgresql: AFTER deployments (arch.* and the mig.* ledger).
  report-pg:
    <<: *report-service
    ports: ["18093:8091"]
    environment:
      <<: *report-env
      ARCHIVE_STORE: postgresql
      LDM_NAMESPACE: char-after
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: otterworks_archive
      PG_USER: otterworks
      PG_PASSWORD: otterworks_dev
      PG_SSLMODE: disable
      ANALYTICS_SERVICE_URL: http://unreachable.invalid:9
      AUDIT_SERVICE_URL: http://unreachable.invalid:9
      AUTH_SERVICE_URL: http://unreachable.invalid:9
