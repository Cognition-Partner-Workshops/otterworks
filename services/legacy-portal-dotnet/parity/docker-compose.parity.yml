# Side-by-side stack for the Java <-> .NET response parity check.
#
#   docker compose -f services/legacy-portal-dotnet/parity/docker-compose.parity.yml up -d --build
#   python3 services/legacy-portal-dotnet/parity/run_parity.py \
#       --java http://localhost:18095 --dotnet http://localhost:18098
#   docker compose -f services/legacy-portal-dotnet/parity/docker-compose.parity.yml down -v
#
# Each app gets its own fresh PostgreSQL so generated ids line up request-for-request.
# Run against fresh databases: `down -v` between runs.
name: legacy-portal-parity

services:
  java-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: legacyportal
      POSTGRES_USER: legacyportal
      POSTGRES_PASSWORD: legacyportal
    volumes:
      - ../../legacy-portal/scripts/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyportal -d legacyportal"]
      interval: 3s
      timeout: 3s
      retries: 20

  legacy-portal-java:
    # Runs the jar built by `./mvnw -DskipTests package` in services/legacy-portal on the same JRE as its
    # Dockerfile (eclipse-temurin:11-jre), so the parity run does not depend on Maven Central inside Docker.
    image: eclipse-temurin:11-jre
    command: ["java", "-jar", "/app/legacy-portal.jar"]
    volumes:
      - ../../legacy-portal/target/legacy-portal.jar:/app/legacy-portal.jar:ro
    depends_on:
      java-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://java-db:5432/legacyportal
      SPRING_DATASOURCE_USERNAME: legacyportal
      SPRING_DATASOURCE_PASSWORD: legacyportal
      TZ: UTC
    ports:
      - "127.0.0.1:18095:8095"

  dotnet-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: legacyportal
      POSTGRES_USER: legacyportal
      POSTGRES_PASSWORD: legacyportal
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyportal -d legacyportal"]
      interval: 3s
      timeout: 3s
      retries: 20
