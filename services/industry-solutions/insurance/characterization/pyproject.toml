[project]
name = "commission-pkg-characterization"
version = "0.1.0"
description = "Characterization harness pinning COMMISSION_PKG behaviour on the Oracle fixture"
requires-python = ">=3.11,<3.12"
dependencies = [
    "oracledb==2.5.1",
    "pytest==8.3.5",
]

[dependency-groups]
dev = ["ruff==0.9.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rule(*ids): RULE_LEDGER.md rule numbers this test pins",
]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
