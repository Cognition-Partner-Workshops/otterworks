[package]
name = "file-service"
version = "0.1.0"
edition = "2021"
authors = ["OtterWorks Engineering"]

[dependencies]
actix-web = "4.18"
actix-multipart = "0.7.2"
actix-rt = "2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-actix-web = "0.7.25"
tracing-opentelemetry = "0.22.0"
opentelemetry = "0.21.0"
opentelemetry_sdk = { version = "0.21.2", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14.0"
aws-config = "1.13"
aws-sdk-s3 = "1.157"
aws-sdk-dynamodb = "1.136"
aws-sdk-sns = "1.121"
aws-smithy-types = "1.9"
futures-util = "0.3.34"
bytes = "1.12"
mime = "0.3.17"
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15.7"
prometheus = "0.13.4"
lazy_static = "1.5"
redis = { version = "0.25.5", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
actix-rt = "2.15"
actix-web = "4.18"
tokio = { version = "1.54", features = ["full", "test-util"] }
