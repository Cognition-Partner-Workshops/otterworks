# One DAB per slice (migrate skill): mig_<run>_<slice>, bundle target `migration`, schedules PAUSED.
# The committed .migration/policy.json is synced next to the job code so the purge job can read
# the allowed Lakebase branch at run time.
bundle:
  name: mig_unt19-20261030_slice-0

include:
  - resources/*.yml

sync:
  paths:
    - .
    - ../../../../../../.migration/policy.json

variables:
  retention_days:
    description: Audit-log retention (the legacy job hardcoded 90 in its PL/SQL text).
    default: "90"

targets:
  migration:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
