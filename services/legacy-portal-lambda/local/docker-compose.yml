# Two live legacy-portal endpoints side by side on one host, each with its own resettable store:
#   java    services/legacy-portal (Spring Boot, postgres profile) on java-db      -> 127.0.0.1:${LP_JAVA_PORT}
#   lambda  the three handlers of services/legacy-portal-lambda under the Lambda RIE, behind a
#           local HTTP API (gateway) and a local RDS Data API (dataapi) on lambda-db  -> 127.0.0.1:${LP_LAMBDA_PORT}
# Stores, functions and the Data API sit on internal networks with no route off the host, so nothing
# here can reach AWS. Driven by scripts/lp-local.sh, which sets the project name and RUN_TOKEN.
x-run: &run
  labels:
    run_token: ${RUN_TOKEN:?RUN_TOKEN is required}
    demo: legacy-portal-local

x-function: &function
  <<: *run
  depends_on:
    dataapi:
      condition: service_started
  networks: [lambda-store]
  volumes:
    - certs:/certs:ro
  environment: &function-env
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL_RDS_DATA: http://dataapi:8080
    # For SDKs that ignore AWS_ENDPOINT_URL_RDS_DATA: trust only the per-run CA (see the certs service).
    JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/trust.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=lp-local
    # Placeholders for the SDK's signer; the local Data API does not check them.
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    CLUSTER_ARN: arn:aws:rds:us-east-1:000000000000:cluster:lp-local
    SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:lp-local
    DB_NAME: legacyportal

services:
  java-db:
    <<: *run
    image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    environment:
      POSTGRES_DB: legacyportal
      POSTGRES_USER: legacyportal
      POSTGRES_PASSWORD: legacyportal
    volumes:
      - ../../legacy-portal/scripts/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - java-db-data:/var/lib/postgresql/data
    networks: [java-store]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyportal -d legacyportal"]
      interval: 3s
      retries: 20

  java:
    <<: *run
    build:
      context: ../../legacy-portal
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-java:${RUN_TOKEN}
    depends_on:
      java-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://java-db:5432/legacyportal
      SPRING_DATASOURCE_USERNAME: legacyportal
      SPRING_DATASOURCE_PASSWORD: legacyportal
    ports:
      - "127.0.0.1:${LP_JAVA_PORT:-18095}:8095"
    networks: [java-store, java-edge]

  lambda-db:
    <<: *run
    image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    environment:
      POSTGRES_DB: legacyportal
      POSTGRES_USER: legacyportal
      POSTGRES_PASSWORD: legacyportal
    volumes:
      - ../../../infrastructure/terraform/legacy-portal-serverless/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./dataapi/zz-dataapi-role.sql:/docker-entrypoint-initdb.d/zz-dataapi-role.sql:ro
      - lambda-db-data:/var/lib/postgresql/data
    networks: [lambda-store]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyportal -d legacyportal"]
      interval: 3s
      retries: 20

  certs:
    <<: *run
    image: eclipse-temurin:21-jre@sha256:d77e090ae1f6970c047b443c6f0a6c1358b0426d44432bb5a7753408cd43de0d
    network_mode: none
    volumes:
      - certs:/certs
    entrypoint: ["sh", "-ec"]
    command:
      - |
        cd /certs
        [ -s trust.p12 ] && exit 0
        openssl req -x509 -newkey rsa:2048 -nodes -days 7 -subj "/CN=lp-local run CA" -keyout ca.key -out ca.pem 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj "/CN=rds-data.us-east-1.amazonaws.com" -keyout server.key -out server.csr 2>/dev/null
        printf 'subjectAltName=DNS:rds-data.us-east-1.amazonaws.com,DNS:dataapi\n' > san.ext
        openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 7 -extfile san.ext -out server.pem 2>/dev/null
        keytool -importcert -noprompt -alias lp-local-ca -file ca.pem -keystore trust.p12 -storetype PKCS12 -storepass lp-local >/dev/null
        rm -f ca.key server.csr san.ext ca.srl
        chmod 0644 server.key

  dataapi:
    <<: *run
    build:
      context: ./dataapi
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-dataapi:${RUN_TOKEN}
    depends_on:
      lambda-db:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - certs:/certs:ro
    environment:
      TLS_CERT: /certs/server.pem
      TLS_KEY: /certs/server.key
      PG_DSN: host=lambda-db user=lp_dataapi password=lp_dataapi
      LOCAL_CLUSTER_ARN: arn:aws:rds:us-east-1:000000000000:cluster:lp-local
      LOCAL_SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:lp-local
    networks:
      lambda-store:
        aliases: [rds-data.us-east-1.amazonaws.com]

  fn-announcements:
    <<: *function
    build:
      context: ..
      dockerfile: local/function.Dockerfile
      args: {CONTEXT: announcements}
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-fn-announcements:${RUN_TOKEN}
    command: ["com.otterworks.legacyportal.lambda.AnnouncementsHandler::handleRequest"]
    environment:
      <<: *function-env
      AWS_LAMBDA_FUNCTION_NAME: lp-local-announcements
      DB_SCHEMA: announcements

  fn-preferences:
    <<: *function
    build:
      context: ..
      dockerfile: local/function.Dockerfile
      args: {CONTEXT: preferences}
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-fn-preferences:${RUN_TOKEN}
    command: ["com.otterworks.legacyportal.lambda.preferences.PreferencesHandler::handleRequest"]
    environment:
      <<: *function-env
      AWS_LAMBDA_FUNCTION_NAME: lp-local-preferences
      DB_SCHEMA: user_preferences

  fn-feedback:
    <<: *function
    build:
      context: ..
      dockerfile: local/function.Dockerfile
      args: {CONTEXT: feedback}
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-fn-feedback:${RUN_TOKEN}
    command: ["com.otterworks.legacyportal.lambda.feedback.FeedbackHandler::handleRequest"]
    environment:
      <<: *function-env
      AWS_LAMBDA_FUNCTION_NAME: lp-local-feedback
      DB_SCHEMA: feedback

  gateway:
    <<: *run
    build:
      context: ./gateway
      labels:
        run_token: ${RUN_TOKEN}
    image: lp-local-gateway:${RUN_TOKEN}
    depends_on: [fn-announcements, fn-preferences, fn-feedback]
    environment:
      RUN_TOKEN: ${RUN_TOKEN}
      # Mirrors var.contexts and var.default_route_context in infrastructure/terraform/legacy-portal-serverless.
      LP_ROUTES: announcements=/api/announcements=http://fn-announcements:8080;preferences=/api/preferences=http://fn-preferences:8080;feedback=/api/feedback=http://fn-feedback:8080
      LP_DEFAULT_ROUTE: announcements
    ports:
      - "127.0.0.1:${LP_LAMBDA_PORT:-18096}:8080"
    networks: [lambda-store, lambda-edge]

networks:
  java-store: {internal: true, labels: {run_token: "${RUN_TOKEN}"}}
  java-edge: {labels: {run_token: "${RUN_TOKEN}"}}
  lambda-store: {internal: true, labels: {run_token: "${RUN_TOKEN}"}}
  lambda-edge: {labels: {run_token: "${RUN_TOKEN}"}}

volumes:
  java-db-data: {labels: {run_token: "${RUN_TOKEN}"}}
  lambda-db-data: {labels: {run_token: "${RUN_TOKEN}"}}
  certs: {labels: {run_token: "${RUN_TOKEN}"}}
