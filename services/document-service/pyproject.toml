[tool.poetry]
name = "document-service"
version = "0.1.0"
description = "OtterWorks Document Service - Document CRUD, versioning, and content management"
authors = ["OtterWorks Engineering"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.6"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.6.4"
pydantic-settings = "^2.14.2"
structlog = "^24.1.0"
opentelemetry-api = "1.45.1"
opentelemetry-sdk = "1.45.1"
opentelemetry-exporter-otlp = "1.45.1"
opentelemetry-instrumentation-fastapi = "0.66b1"
opentelemetry-instrumentation-sqlalchemy = "0.66b1"
prometheus-fastapi-instrumentator = "^8.1.0"
prometheus-client = ">=0.20.0,<1.0"
python-multipart = ">=0.0.30,<0.1.0"
httpx = "^0.27.0"
boto3 = "^1.34.0"
PyJWT = "^2.15.0"
redis = "^5.0.0"
setuptools = ">=84.1.0"
anyio = ">=4.14.2,<5"
certifi = ">=2026.10.18"
idna = ">=3.15,<4"
protobuf = ">=6.33.5,<7"
starlette = ">=1.3.1,<2"
urllib3 = ">=2.8.0,<3"
Mako = ">=1.4.2,<2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^5.0.0"
ruff = "^0.3.4"
mypy = "^1.9.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
