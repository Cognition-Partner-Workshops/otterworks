[tool.poetry]
name = "document-service"
version = "0.1.0"
description = "OtterWorks Document Service - Document CRUD, versioning, and content management"
authors = ["OtterWorks Engineering"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.6"}
asyncpg = "^0.32.0"
alembic = "^1.20.1"
pydantic = "^2.14.2"
pydantic-settings = "^2.16.2"
structlog = "^24.1.0"
opentelemetry-api = "^1.45.2"
opentelemetry-sdk = "^1.45.2"
opentelemetry-exporter-otlp = "^1.45.2"
opentelemetry-instrumentation-fastapi = "^0.66b2"
prometheus-fastapi-instrumentator = "^7.0.0"
python-multipart = ">=0.0.33,<0.1.0"
httpx = "^0.28.1"
boto3 = "^1.43.123"
PyJWT = "^2.15.1"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^5.0.0"
ruff = "^0.17.3"
mypy = "^1.9.0"
httpx = "^0.28.1"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
