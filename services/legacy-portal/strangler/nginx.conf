# Strangler edge for legacy-portal. Only the extracted bounded context (user preferences)
# leaves the monolith; every other path, including /health and anything unknown, still goes to
# legacy-portal. Locations are case-sensitive, like the Spring routes they front, so
# /API/preferences/... stays with the monolith and gets its 404. The client's Host header is not
# forwarded: upstreams see their upstream name (nginx's default $proxy_host).
upstream legacy-portal {
    server legacy-portal:8095;
}

upstream preferences-service {
    server preferences-service:8098;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /edge-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"legacy-portal-edge"}';
    }

    # proxy_pass without a URI forwards the request URI exactly as received (no decoding or
    # slash merging), so path variables and error "path" fields match the monolith.
    location = /api/preferences {
        add_header X-Served-By preferences-service always;
        proxy_pass http://preferences-service;
    }

    location /api/preferences/ {
        add_header X-Served-By preferences-service always;
        proxy_pass http://preferences-service;
    }

    location / {
        add_header X-Served-By legacy-portal always;
        proxy_pass http://legacy-portal;
    }
}
