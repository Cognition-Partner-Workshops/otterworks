version: 1
title: OtterWorks billing estate to Databricks (run 1793146609)
summary: Overnight migration run, three sibling pipelines on one ledger —
  invoicing (Oracle OW_BILLING -> Lakebase + Delta), custbill (CUSTBILL chain ->
  Lakeflow pipeline + Job), analytics (etl/ crons + Scala rollup -> Lakeflow Jobs).
  Each sibling appends its own pipeline phase; the requester approves once in the
  Plan view when all phases are committed.
phases:
  - id: analytics
    title: Pipeline analytics — etl/ crons + Scala rollup -> Lakeflow Jobs
    decisions:
      - id: parity-mechanism
        description: Parity mechanism for analytics — the estate's `--family oracle`
          rule has no Oracle object to read in this pipeline.
        options:
          - id: snapshot-databricks
            label: Recommended — materialize each unit's legacy output into
              ow_tp.ow_tp_analytics_src (snapshot posture), then dbx-recon
              --family databricks catalog-to-catalog vs ow_tp.ow_tp_analytics on
              warehouse 565cd2fd713738c4. One uniform mechanism, inside the
              allowlist, live-tested adapter.
          - id: postgres-split
            label: dbx-recon --family postgres for the Postgres-sourced units
              (analytics_daily, user_activity_daily), databricks for the rest —
              mixed source blocks per unit.
        selected: null
        important: true
      - id: target-core
        description: Target surface for the converted jobs.
        options:
          - id: lakeflow-jobs
            label: Lakeflow Jobs with retries; outputs land in Delta under
              ow_tp.ow_tp_analytics; schedules created PAUSED.
        selected: lakeflow-jobs
        important: false
    steps:
      - id: analytics-inventory
        title: Inventory and boundary (STOP B, approved)
        gates:
          - id: coverage
            description: 6/6 scheduled units covered; etl/legacy-extra/ and
              MarketSeeder excluded.
      - id: analytics-snapshot-schema
        title: Materialize legacy outputs into ow_tp.ow_tp_analytics_src
        depends_on: [analytics-inventory]
        gates:
          - id: snapshot-landed
            description: Each unit's legacy run output lands as Delta rows in
              ow_tp.ow_tp_analytics_src for recon source-side comparison.
      - id: run-analytics-wave-1
        title: Wave 1 pilot (width 2 — usage_rollup_scala, analytics_daily)
        depends_on: [analytics-snapshot-schema]
        gates:
          - id: w1-recon
            description: dbx-recon PASS per unit on the declared parity mechanism.
      - id: run-analytics-wave-2
        title: Wave 2 remaining crons (width 4)
        depends_on: [run-analytics-wave-1]
        gates:
          - id: w2-recon
            description: dbx-recon PASS per unit on the declared parity mechanism.
      - id: analytics-stop-e
        title: STOP E evidence packet — park for the requester
        depends_on: [run-analytics-wave-2]
        decisions:
          - id: cutover-auth
            description: Repoint production consumers to the migrated analytics
              jobs under the customer-held cutover principal.
            options:
              - id: authorize
                label: Proceed with the rehearsed repoint
              - id: hold
                label: Hold; production does not move
            selected: null
            important: true
  - id: custbill
    title: Pipeline custbill — CUSTBILL finance-close chain -> Lakeflow
      Declarative Pipeline + Lakeflow Job
    decisions:
      - id: custbill-shared-source
        description: D2 — Oracle invoice_header/customer_master/tenants are also
          migrated by invoicing; custbill reads them read-only for its extract.
        options:
          - id: wave0
            label: Migrate once under owner pipeline invoicing; custbill consumes
              the snapshot read-only
        selected: wave0
        important: false
      - id: custbill-source-feed
        description: D3 — upstream feed (Oracle month-end extract + SFTP drop)
          reaches the target as exported files only; snapshot load.
        options:
          - id: loader
            label: Auto Loader over exported files into ow_tp_custbill.custbill_feed
          - id: federate
            label: Lakehouse Federation read-only
          - id: connect
            label: Lakeflow Connect managed connector
        selected: loader
        important: false
      - id: custbill-handoff
        description: D7 — SFTP drop CUSTBILL*.dat fixed-width 65-char contract;
          re-platform transport at cutover.
        options:
          - id: preserve
            label: Preserve the format contract exactly
        selected: preserve
        important: false
      - id: custbill-scheduler
        description: D5 — crontab + run_all.sh ordering becomes Lakeflow Job task
          dependencies.
        options:
          - id: jobs
            label: Replace with ow_tp_custbill_job Lakeflow Job, PAUSED schedule
          - id: retain
            label: Keep external scheduler triggering Databricks
          - id: hybrid
            label: Hybrid with completion signal
        selected: jobs
        important: false
      - id: custbill-consumer
        description: D4 — finance_billing_*.csv consumer is the legacy-billing Flask
          service /api/reports/finance (plus dead sendmail leg). Cutover-adjacent;
          parked — requester decides at STOP E. `park` is a placeholder so the plan
          is approvable; it decides nothing.
        options:
          - id: park
            label: Park — decided at STOP E, never by a session
          - id: repoint
            label: Re-point the consumer at the target at cutover
          - id: dual
            label: Dual-publish during coexistence
          - id: rebuild
            label: Rebuild the report surface on the target
        selected: park
        important: true
      - id: target-pipeline
        description: Target surface for the parse/validate/aggregate chain.
        options:
          - id: ldp
            label: Lakeflow Declarative Pipeline with expectations + quarantine sink
        selected: ldp
        important: false
      - id: target-orchestration
        description: Target surface for scheduling/orchestration.
        options:
          - id: lakeflow-job
            label: Lakeflow Job ow_tp_custbill_job wrapping the pipeline, PAUSED
        selected: lakeflow-job
        important: false
      - id: target-consumer
        description: Target surface for the finance report consumer; tied to
          custbill-consumer, parked at STOP E.
        options:
          - id: report-table
            label: ow_tp_custbill.finance_billing_totals + report artifact surface
        selected: report-table
        important: false
      - id: target-data-dependency
        description: Target surface for the upstream feed.
        options:
          - id: snapshot-feed
            label: Snapshot files into ow_tp_custbill.custbill_feed staging
        selected: snapshot-feed
        important: false
      - id: target-core
        description: N/A — no core OLTP tables migrate under custbill.
        options:
          - id: na
            label: Not applicable — reporting pipeline only
        selected: na
        important: false
      - id: target-sql
        description: N/A — SQL lives inside the declarative pipeline.
        options:
          - id: na
            label: Not applicable
        selected: na
        important: false
      - id: target-lakebase
        description: N/A — Lakebase belongs to invoicing.
        options:
          - id: na
            label: Not applicable
        selected: na
        important: false
      - id: target-ml-scoring
        description: N/A — no model training or scoring in custbill.
        options:
          - id: na
            label: Not applicable
        selected: na
        important: false
    steps:
      - id: custbill-inventory
        title: Inventory and boundary (STOP B, approved)
        gates:
          - id: coverage
            description: 12 objects covered — 3 units + 9 support/docs exclusions;
              etl/ crons belong to analytics.
      - id: run-custbill-wave-1
        title: Wave 1 — feed (extract + ingest -> custbill_feed), width 1
        depends_on: [custbill-inventory]
        gates:
          - id: w1-recon
            description: ow_tp_custbill.custbill_feed row parity vs legacy CUSTBILL
              feed (dbx-recon --family oracle PASS).
      - id: run-custbill-wave-2
        title: Wave 2 — pipeline (parsed_records + quarantine + finance_billing_totals;
          deploy ow_tp_custbill_ldp), width 1
        depends_on: [run-custbill-wave-1]
        gates:
          - id: w2-recon
            description: parsed_records + finance_billing_totals PASS vs legacy
              parsed/*.psv + finance_billing_*.csv; quarantine holds rejects.
      - id: run-custbill-wave-3
        title: Wave 3 — job (crontab + run_all.sh -> ow_tp_custbill_job), width 1
        depends_on: [run-custbill-wave-2]
        gates:
          - id: w3-job
            description: ow_tp_custbill_job exists, task DAG wired, schedule PAUSED.
      - id: custbill-stop-e
        title: STOP E evidence packet — park for the requester
        depends_on: [run-custbill-wave-3]
        decisions:
          - id: custbill-cutover-auth
            description: Repoint the finance report consumer under the
              customer-held cutover principal.
            options:
              - id: authorize
                label: Proceed with the rehearsed repoint
              - id: hold
                label: Hold; production does not move
            selected: null
            important: true
