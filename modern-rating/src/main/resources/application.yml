server:
  port: ${PORT:8092}
spring:
  application:
    name: modern-rating
  datasource:
    url: ${RATING_AUDIT_URL:jdbc:h2:mem:quote-audit;DB_CLOSE_DELAY=-1}
    username: ${RATING_AUDIT_USER:rating}
    password: ${RATING_AUDIT_PASSWORD:}
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
rating:
  tables-dir: ${RATING_TABLES_DIR:../legacy-rating/tables}
