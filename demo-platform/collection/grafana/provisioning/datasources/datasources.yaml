apiVersion: 1
datasources:
  - name: Prometheus
    uid: collection-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Collection PostgreSQL
    uid: collection-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: collection_reader
    editable: false
    jsonData:
      database: collection
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $COLLECTION_PG_READER_PASSWORD
