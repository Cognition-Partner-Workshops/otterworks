# Local-only collection stack. Every published port binds 127.0.0.1; every resource is scoped to
# COMPOSE_PROJECT_NAME and labelled so scripts/reset.sh can remove exactly this run.
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME (make env writes one to .env)}

x-labels: &labels
  com.devin.collection.run: ${COMPOSE_PROJECT_NAME}
  com.devin.collection.scope: local-only

services:
  postgres:
    image: postgres:16.15
    labels: *labels
    environment:
      POSTGRES_DB: collection
      POSTGRES_USER: collection_owner
      POSTGRES_PASSWORD: ${COLLECTION_PG_OWNER_PASSWORD:?}
      COLLECTION_PG_READER_PASSWORD: ${COLLECTION_PG_READER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${COLLECTION_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection_owner -d collection"]
      interval: 3s
      timeout: 3s
      retries: 30

  slack-mock:
    image: ${COMPOSE_PROJECT_NAME}-slack-mock:local
    build:
      context: ./slack-mock
      labels: *labels
    labels: *labels
    environment:
      COLLECTION_BIND: 0.0.0.0
      COLLECTION_PORT: "8780"
      COLLECTION_ACCESS_TOKEN: ${COLLECTION_ACCESS_TOKEN:?}
      COLLECTION_MODE: ${COLLECTION_MODE:-stub}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      COLLECTION_DEVIN_API_BASE: ${COLLECTION_DEVIN_API_BASE:-https://api.devin.ai}
      COLLECTION_DEVIN_ORG_ID: ${COLLECTION_DEVIN_ORG_ID:-}
      COLLECTION_CREATE_AS_USER_ID: ${COLLECTION_CREATE_AS_USER_ID:-}
      COLLECTION_REPOS: ${COLLECTION_REPOS:-}
      COLLECTION_MAX_ACU_LIMIT: ${COLLECTION_MAX_ACU_LIMIT:-}
      COLLECTION_AUTOMATION_URL: ${COLLECTION_AUTOMATION_URL:-}
      COLLECTION_AUTOMATION_ALLOWED_HOST: ${COLLECTION_AUTOMATION_ALLOWED_HOST:-}
      COLLECTION_AUTOMATION_SECRET: ${COLLECTION_AUTOMATION_SECRET:-}
      COLLECTION_AUTOMATION_RULES: ${COLLECTION_AUTOMATION_RULES:-}
    volumes:
      - slackdata:/data
    ports:
      - "127.0.0.1:${COLLECTION_APP_PORT:-58780}:8780"

  prometheus:
    image: prom/prometheus:v3.15.1
    labels: *labels
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.listen-address=:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${COLLECTION_PROM_PORT:-59090}:9090"
    depends_on: [slack-mock]

  grafana:
    image: grafana/grafana:13.0.12
    labels: *labels
    environment:
      GF_SECURITY_ADMIN_USER: collection-admin
      GF_SECURITY_ADMIN_PASSWORD: ${COLLECTION_GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      COLLECTION_PG_READER_PASSWORD: ${COLLECTION_PG_READER_PASSWORD:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${COLLECTION_GRAFANA_PORT:-53000}:3000"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  # One-shot: creates a Viewer service account and writes its token into a run-scoped volume
  # that only the Grafana MCP container mounts (read-only).
  grafana-init:
    image: python:3.12.16-slim
    labels: *labels
    command: ["python", "/init/grafana_viewer_token.py"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: collection-admin
      GRAFANA_ADMIN_PASSWORD: ${COLLECTION_GRAFANA_ADMIN_PASSWORD:?}
      TOKEN_PATH: /secrets/grafana-viewer-token
      TOKEN_OWNER_UID: "1000"
    volumes:
      - ./grafana-init:/init:ro
      - grafana-mcp-token:/secrets
    depends_on:
      grafana: {condition: service_healthy}
    restart: "no"

  # MCP servers are stdio processes started on demand by mcp/*-stdio.sh (docker compose run).
  mcp-grafana:
    profiles: [mcp]
    image: grafana/mcp-grafana:2.1.1
    labels: *labels
    entrypoint: ["/app/mcp-grafana"]
    command: ["--transport", "stdio", "--disable-write"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /secrets/grafana-viewer-token
    volumes:
      - grafana-mcp-token:/secrets:ro
    stdin_open: true

  mcp-postgres:
    profiles: [mcp]
    image: crystaldba/postgres-mcp:0.3.0
    labels: *labels
    command: ["--access-mode=restricted", "--transport=stdio"]
    environment:
      DATABASE_URI: postgresql://collection_reader:${COLLECTION_PG_READER_PASSWORD:?}@postgres:5432/collection
    stdin_open: true

volumes:
  pgdata: {labels: *labels}
  slackdata: {labels: *labels}
  promdata: {labels: *labels}
  grafanadata: {labels: *labels}
  grafana-mcp-token: {labels: *labels}

networks:
  default:
    labels: *labels
