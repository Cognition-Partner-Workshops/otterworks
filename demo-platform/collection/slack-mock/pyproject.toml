[project]
name = "collection-slack"
version = "0.1.0"
description = "Mock Slack workspace bridging thread mentions to the Devin v3 API"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.5", "mypy==2.3.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collection_slack = ["static/*"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "BLE"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
