# RBAC for the dashboard SA (also used by dashboard-launched runner Jobs and the
# reaper CronJob). RBAC cannot restrict rules to namespaces matching a name glob
# (otterworks-*), so these verbs are cluster-wide by necessity; the intended
# scope is the otterworks-* tenant namespaces + otterworks-platform. AWS-side
# blast radius is bounded separately by the scoped IRSA role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-ops
  labels:
    {{- include "demo-platform.labels" . | nindent 4 }}
rules:
  # Manage tenant namespaces (create/delete otterworks-<id>) + read for the
  # dashboard's live join and the reaper's orphan sweep.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core workload/config objects inside tenant + platform namespaces.
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps", "serviceaccounts", "persistentvolumeclaims", "resourcequotas", "limitranges", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod logs: the dashboard streams runner Job logs, and inject-bug / idle-suspend
  # read Redis through short-lived redis-cli pods (scripts/lib/tenant-redis.sh)
  # rather than exec-ing into running pods.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # Jobs in otterworks-platform (deploy/teardown/inject/reset runner Jobs) and in
  # tenant/system namespaces (per-tenant DB init/drop Jobs).
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Service charts render ServiceMonitor / PrometheusRule once the shared
  # monitoring stack's CRDs exist.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-ops
  labels:
    {{- include "demo-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-ops
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.platformNamespace }}
---
# idle-suspend's fallback metrics scrape goes through the API server's pod proxy,
# limited to the ingress controller's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ingress-metrics
  namespace: {{ .Values.ingressNamespace | default "ingress-nginx" }}
  labels:
    {{- include "demo-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ingress-metrics
  namespace: {{ .Values.ingressNamespace | default "ingress-nginx" }}
  labels:
    {{- include "demo-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-ingress-metrics
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.platformNamespace }}
