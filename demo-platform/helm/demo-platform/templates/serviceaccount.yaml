apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.platformNamespace }}
  labels:
    {{- include "demo-platform.labels" . | nindent 4 }}
  annotations:
    # Scoped IRSA role (control table + shared-data GC + boundary-capped tenant
    # IRSA roles + eks:DescribeCluster) — NOT cluster-admin, no shared-role edits.
    eks.amazonaws.com/role-arn: {{ include "demo-platform.roleArn" . }}
