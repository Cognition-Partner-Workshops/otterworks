# OtterWorks Report Service Configuration
# LEGACY: .properties file instead of .yml (older Spring Boot convention)

server.port=8091

# Application info
spring.application.name=report-service
info.app.name=OtterWorks Report Service
info.app.version=0.1.0

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:otterworks_reports}
spring.datasource.username=${DB_USER:otterworks}
spring.datasource.password=${DB_PASSWORD:otterworks_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Datadog: metrics over DogStatsD to a local Datadog Agent (disabled under the `test` profile)
management.statsd.metrics.export.enabled=${DD_METRICS_ENABLED:true}
management.statsd.metrics.export.flavor=datadog
management.statsd.metrics.export.host=${DD_AGENT_HOST:localhost}
management.statsd.metrics.export.port=${DD_DOGSTATSD_PORT:8125}
management.statsd.metrics.export.step=10s
management.prometheus.metrics.export.enabled=true
management.metrics.tags.service=${DD_SERVICE:report-service}
management.metrics.tags.env=${DD_ENV:local}
management.metrics.tags.version=${DD_VERSION:0.1.0}

# Service URLs
otterworks.analytics-service.url=${ANALYTICS_SERVICE_URL:http://analytics-service:8088}
otterworks.audit-service.url=${AUDIT_SERVICE_URL:http://audit-service:8090}
otterworks.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

# Report settings
otterworks.report.output-dir=${REPORT_OUTPUT_DIR:/tmp/reports}
otterworks.report.max-rows=${REPORT_MAX_ROWS:50000}
otterworks.report.connection-timeout=5000
otterworks.report.read-timeout=30000

# Data cache (Caffeine)
otterworks.report.cache.max-size=${REPORT_CACHE_MAX_SIZE:100}
otterworks.report.cache.ttl=${REPORT_CACHE_TTL:5m}

# Report generation executor (bounded, CallerRunsPolicy)
otterworks.report.executor.core-size=${REPORT_EXECUTOR_CORE:4}
otterworks.report.executor.max-size=${REPORT_EXECUTOR_MAX:8}
otterworks.report.executor.queue-capacity=${REPORT_EXECUTOR_QUEUE:100}

# Upstream fan-out executor (parallel analytics + audit fetch)
otterworks.report.fetch.parallelism=${REPORT_FETCH_PARALLELISM:16}

# Scheduled (recurring) reports
otterworks.report.schedule.poll-interval=${REPORT_SCHEDULE_POLL_INTERVAL:60s}

# Logging
logging.level.com.otterworks=DEBUG
logging.level.org.springframework.web=INFO
