# Local profile — runs with no external services (H2 in-memory, no Datadog agent required).
# SPRING_PROFILES_ACTIVE=local java -jar target/report-service.jar
spring.datasource.url=jdbc:h2:mem:reportsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Upstream services are not running locally: point at unroutable ports so the fetcher
# falls back to sample data quickly.
otterworks.analytics-service.url=${ANALYTICS_SERVICE_URL:http://localhost:1}
otterworks.audit-service.url=${AUDIT_SERVICE_URL:http://localhost:1}
otterworks.auth-service.url=${AUTH_SERVICE_URL:http://localhost:1}
otterworks.report.output-dir=${REPORT_OUTPUT_DIR:/tmp/reports}

# Human-readable console logs (see logback-spring.xml)
logging.level.com.otterworks=INFO
