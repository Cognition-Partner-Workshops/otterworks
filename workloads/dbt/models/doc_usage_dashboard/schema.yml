{
  "version": 2,
  "models": [
    {
      "name": "doc_usage_dashboard",
      "config": {
        "contract": {
          "enforced": true
        }
      },
      "data_tests": [
        {
          "grain": {
            "columns": [
              "snapshot_date",
              "account_id"
            ]
          }
        }
      ],
      "columns": [
        {
          "name": "snapshot_date",
          "data_type": "date",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "account_id",
          "data_type": "varchar(36)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "account_email",
          "data_type": "varchar(255)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "tier",
          "data_type": "varchar(16)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  "free",
                  "basic",
                  "pro",
                  "enterprise"
                ],
                "quote": true
              }
            }
          ]
        },
        {
          "name": "quota_bytes",
          "data_type": "number(19,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "used_bytes",
          "data_type": "number(19,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "remaining_bytes",
          "data_type": "number(19,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "usage_pct",
          "data_type": "number(7,2)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "usage_band",
          "data_type": "varchar(16)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  "ok",
                  "near_limit",
                  "over_quota"
                ],
                "quote": true
              }
            }
          ]
        },
        {
          "name": "active_document_count",
          "data_type": "number(10,0)",
          "data_tests": [
            "not_null"
          ]
        }
      ]
