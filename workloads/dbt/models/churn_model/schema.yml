{
  "version": 2,
  "models": [
    {
      "name": "churn_model",
      "config": {
        "contract": {
          "enforced": true
        }
      },
      "data_tests": [
        {
          "grain": {
            "columns": [
              "week_start_date",
              "account_id"
            ]
          }
        }
      ],
      "columns": [
        {
          "name": "week_start_date",
          "data_type": "date",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "account_id",
          "data_type": "varchar(36)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "days_since_last_login",
          "data_type": "number(6,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "activity_this_week",
          "data_type": "number(10,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "activity_prior_4wk_avg",
          "data_type": "number(10,2)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "activity_drop_pct",
          "data_type": "number(7,2)",
          "data_tests": []
        },
        {
          "name": "login_points",
          "data_type": "number(3,0)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  0,
                  10,
                  25,
                  40
                ],
                "quote": false
              }
            }
          ]
        },
        {
          "name": "activity_points",
          "data_type": "number(3,0)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  0,
                  10,
                  25,
                  30,
                  40
                ],
                "quote": false
              }
            }
          ]
        },
        {
          "name": "status_points",
          "data_type": "number(3,0)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  0,
                  20
                ],
                "quote": false
              }
            }
          ]
        },
        {
          "name": "churn_score",
          "data_type": "number(3,0)",
          "data_tests": [
            "not_null"
          ]
        },
        {
          "name": "risk_band",
          "data_type": "varchar(8)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  "low",
                  "medium",
                  "high"
                ],
                "quote": true
              }
            }
          ]
        },
        {
          "name": "model_version",
          "data_type": "varchar(16)",
          "data_tests": [
            "not_null",
            {
              "accepted_values": {
                "values": [
                  "rules_v1"
                ],
                "quote": true
              }
            }
          ]
        }
      ]
    }
  ]
}
