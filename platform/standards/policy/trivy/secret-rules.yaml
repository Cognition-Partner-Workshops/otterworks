# Extra Trivy secret rules on top of the built-in set. Legacy applications
# tend to keep database passwords in plain settings files, which the
# built-in rules do not match.
rules:
  - id: platform-hardcoded-db-password
    category: general
    title: Database password assigned in source or config
    severity: HIGH
    keywords:
      - pass
    regex: (?i)(db_?pass(word)?|database_?password|passwd|password)\s*[:=]\s*['"](?P<secret>[^'"\s$%{}]{6,})['"]
    secret-group-name: secret
  - id: platform-jdbc-url-password
    category: general
    title: Password embedded in a JDBC or database URL
    severity: HIGH
    keywords:
      - jdbc
      - postgres
      - mysql
    regex: (?i)(jdbc:[a-z]+|postgres(ql)?|mysql)://[^:/\s]+:(?P<secret>[^@\s]{4,})@
    secret-group-name: secret
