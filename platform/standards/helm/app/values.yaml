# Every value an application may set. Anything the platform policies check
# has a compliant default, so an application only overrides what it needs.
app: ""            # required, becomes the app label and the resource names
owner: ""          # required, team that answers for the application
costCenter: ""     # required, finance code for the namespace bill
workload: web      # web | cronjob

image:
  repository: ""   # must start with the approved registry
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
containerPort: 8080

env: {}            # plain settings, never a secret value
secretEnv: {}      # NAME: {secret: <secret name>, key: <key>}, a reference only
configFiles: {}    # filename: content, mounted read-only at configMountPath
configMountPath: /etc/app

# Paths the application writes at runtime. Each becomes an emptyDir, so the
# root filesystem stays read-only.
writablePaths:
  - /tmp

probes:
  enabled: true
  path: /health
  port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  runAsUser: 10001
  runAsGroup: 10001

service:
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  tls: true

networkPolicy:
  enabled: true
  allowSameNamespace: false
  ingressNamespaces:
    - ingress-nginx
    - monitoring

serviceMonitor:
  enabled: false
  path: /metrics

cronjob:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  command: []
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
