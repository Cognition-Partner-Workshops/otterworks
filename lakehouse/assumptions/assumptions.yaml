  ambiguity: The macro accepts an unused day argument, has no ORDER BY, and the emulator writes an undated
    file.
  decision: Rebuild the macro against the requested warehouse snapshot, emit a sorted, date-scoped PSV, and
    compare rows keyed by team ID to the legacy BTEQ file generated for that date.
