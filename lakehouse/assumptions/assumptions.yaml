- id: A-040
  title: Readiness replaces a fixed launch time, not source completeness
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: The UTC cron launches at 01:15 regardless of actual feed arrival. File existence alone cannot
    prove a writer finished.
  decision: Start daily at midnight UTC; wait per feed for up to 3600 seconds per attempt, checking every
    30 seconds. Accept empty files. Require producers to publish by atomic rename.
  rationale: Explicit readiness is stronger than a wall-clock assumption, but there is no completeness
    manifest, nonempty check or size-stability test. Partial published files can still fail ingestion.
  risk: high
  verification: test:lakehouse/tests/test_orchestration.py::test_readiness_present_empty_missing_and_arriving
  status: accepted
  sources:
  - warehouse/teradata/jobs/crontab.example
  - warehouse/teradata/jobs/daily_chain
  - etl/crontab
  - lakehouse/orchestration/pipeline.yaml
- id: A-041
  title: No-overlap and embedded catalog serialization
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: max_active_runs prevents DAG-run overlap but not parallel tasks or unrelated manual invocations.
  decision: Use one active run and one active task per DAG; local runs hold a namespace flock and Airflow
    work tasks take the same lock per task. Do not mix local and Airflow runs in one namespace.
  rationale: Serial tasks protect Derby; per-task Airflow locks do not implement an across-worker whole-DAG
    lease. A manual run could start between Airflow tasks.
  risk: med
  verification: test:lakehouse/tests/test_orchestration.py::test_retries_block_descendants_continue_independent_and_no_overlap
  status: accepted
  sources:
  - warehouse/teradata/jobs/crontab.example
  - warehouse/teradata/jobs/daily_chain
  - etl/crontab
  - lakehouse/orchestration/pipeline.yaml
- id: A-042
  title: Retries and branch-local failure replace stop-at-first-failure
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: The legacy chain returns immediately after its first failed stage and has no built-in retry.
  decision: Retry seeded tasks once after ten seconds; exhausted tasks block their descendants while independent
    branches may finish. Both executors return a failed run if a task fails.
  rationale: Independent domain work need not be discarded because another branch fails. Existing ingestion
    and full-replacement pilot model are retry-safe; future exports must define idempotence.
  risk: med
  verification: test:lakehouse/tests/test_orchestration.py::test_retries_block_descendants_continue_independent_and_no_overlap
  status: accepted
  sources:
  - warehouse/teradata/jobs/crontab.example
  - warehouse/teradata/jobs/daily_chain
  - etl/crontab
  - lakehouse/orchestration/pipeline.yaml
- id: A-043
  title: Only the staging orchestration stage is platform-replaced
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: The daily cron and runner invoke many unconverted outputs, not just the pilot and staging
    loads.
  decision: Mark only daily_chain#stage=staging as orchestration-replaced; keep the full cron, daily runner,
    all other stages and domain jobs pending.
  rationale: The account-loading BTEQ also loads other tables, so even its whole stage cannot be claimed
    as replaced by the account pilot alone.
  risk: high
  verification: test:lakehouse/tests/test_orchestration.py::test_pipeline_contract_and_staging_replacement
