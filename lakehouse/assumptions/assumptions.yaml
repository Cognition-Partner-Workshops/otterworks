- id: A-041
  title: No-overlap and embedded catalog serialization
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: max_active_runs prevents DAG-run overlap but not parallel tasks or unrelated manual invocations.
  decision: Use one active run and one active task per DAG; local runs hold a namespace flock and Airflow
    work tasks take the same lock per task. Do not mix local and Airflow runs in one namespace.
  rationale: Serial tasks protect Derby; per-task Airflow locks do not implement an across-worker whole-DAG
    lease. A manual run could start between Airflow tasks.
