- id: A-040
  title: Readiness replaces a fixed launch time, not source completeness
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: The UTC cron launches at 01:15 regardless of actual feed arrival. File existence alone cannot
    prove a writer finished.
  decision: Start daily at midnight UTC; wait per feed for up to 3600 seconds per attempt, checking every
    30 seconds. Accept empty files. Require producers to publish by atomic rename.
  rationale: Explicit readiness is stronger than a wall-clock assumption, but there is no completeness
    manifest, nonempty check or size-stability test. Partial published files can still fail ingestion.
