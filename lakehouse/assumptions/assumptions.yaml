- id: A-026
  title: Parity normalization is explicit and column-scoped
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Global trimming, case-folding or empty-to-null could hide genuine data differences.
  decision: Pilot parity strips only CHAR padding for status, currency and country; other normalization
    is opt-in per spec.
  rationale: Avoids treating meaningful account-name whitespace or empty strings as equivalent accidentally.
  risk: med
  verification: test:lakehouse/tests/test_parity.py::test_normalizations_and_numeric_tolerance
  status: accepted
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - lakehouse/parity/specs/billing/customer_account.yaml
  - lakehouse/parity/engine.py
- id: A-027
  title: Duplicate/null parity keys fail without arbitrary pairing
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Duplicate-key rows lack a deterministic one-to-one pairing; a null key cannot reliably identify
    a row.
  decision: Fail duplicates/null keys and skip cell comparison within duplicate groups.
  rationale: Prevents order-dependent pairing from hiding drift; missing/extra and duplicate counts remain
    exact.
  risk: low
  verification: test:lakehouse/tests/test_parity.py::test_duplicate_keys
  status: accepted
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - lakehouse/parity/engine.py
- id: A-028
  title: Numeric normalization and tolerance policy
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Different numeric representations and rounding conventions could alter comparison results.
  decision: Use finite Decimal values, ROUND_HALF_UP for explicit scale and inclusive absolute per-column
    tolerance; the pilot has no tolerance.
  rationale: Money-like fields need declared scale/tolerance rather than implicit float epsilon or global
    rounding.
  risk: med
  verification: test:lakehouse/tests/test_parity.py::test_normalizations_and_numeric_tolerance
  status: accepted
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - lakehouse/parity/engine.py
- id: A-029
  title: Fingerprints are diagnostics, not equality gates
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: A tolerated numeric difference can change a hash or aggregate sum.
  decision: Compute normalized per-column fingerprints but pass/fail using counts, keys and cell tolerance
    checks.
  rationale: Avoids contradictory hash failures for explicitly tolerated cells; hashes do not prove row-level
    correspondence alone.
  risk: low
  verification: test:lakehouse/tests/test_parity.py::test_equal_order_independent_and_fingerprints
  status: accepted
  sources:
  - warehouse/teradata/scripts/billing/01_load_accounts.bteq
  - lakehouse/parity/engine.py
- id: A-030
  title: Parity reports are latest-per-spec, not a run archive
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: A single stable evidence path cannot retain every namespace/date/run simultaneously.
  decision: Overwrite parity/id.json; preserve unselected reports with their own metadata and render all
    latest saved reports.
  rationale: Keeps committed evidence small; consumers must read NS/date/timestamp rather than infer all
    rows are one run.
  risk: med
  verification: test:lakehouse/tests/test_parity.py::test_specs_and_evidence_failure_exit
  status: accepted
  sources:
  - warehouse/teradata/jobs/daily_chain
  - lakehouse/parity/__main__.py
- id: A-031
  title: Evidence provenance includes dirty worktrees
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Evidence generated before a commit cannot cite that not-yet-existing commit SHA.
  decision: Record actual HEAD plus git_dirty, spec hash and timestamp; do not rewrite provenance after
    commit.
  rationale: The initial Step-2 evidence honestly recorded dirty=true before its implementation commit.
    Subsequent runs record the actual contemporaneous worktree state, including clean rebased commits.
  risk: low
  verification: test:lakehouse/tests/test_parity.py::test_specs_and_evidence_failure_exit
  status: accepted
  sources:
  - warehouse/teradata/jobs/daily_chain
  - lakehouse/evidence/parity/billing.customer_account.json
  - lakehouse/parity/__main__.py
- id: A-032
  title: Local session dbt runner, not a remote service
  legacy_objects:
  - batch_runner:warehouse/teradata/jobs/daily_chain
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: dbt session mode must reuse the configured Delta/Hive Spark session across worker threads.
  decision: Initialize Spark in-process before invoking dbtRunner; use one dbt thread and local[2].
  rationale: A standalone unconfigured dbt invocation would not automatically load Delta jars or the NS
    metastore.
  risk: med
  verification: 'unverified: remote Spark deployments, distributed Airflow executors and concurrent dbt
    model builds have not been tested'
  status: accepted
  sources:
