- id: A-003
  title: Truncation and CHAR right-padding
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  - bteq_script:warehouse/teradata/scripts/billing/01_load_accounts.bteq
  ambiguity: DDL widths alone do not establish whether INSERT SELECT rejects or truncates overflow.
  decision: Explicitly truncate text to target width and pad fixed CHAR columns.
  rationale: Runner.translate wraps inserted text in explicit PostgreSQL casts, which truncate and pad;
    the pilot mirrors this rather than assuming native Teradata behavior.
  risk: med
  verification: test:lakehouse/tests/test_lakehouse.py::test_ingestion_and_pilot
  status: accepted
  sources:
  - warehouse/teradata/bteq/runner.py
  - warehouse/teradata/ddl/billing/00_tables.sql
  - warehouse/teradata/scripts/billing/01_load_accounts.bteq
- id: A-004
  title: CHAR and VARCHAR represented as STRING
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Spark CTAS does not retain the legacy bounded CHAR/VARCHAR result metadata.
  decision: Store STRING and implement truncation/padding in model expressions.
  rationale: Preserves pilot values while acknowledging that schema introspection no longer reports the
    original text types.
  risk: med
  verification: billing.customer_account
  status: accepted
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - lakehouse/dbt/macros/legacy_text.sql
- id: A-005
  title: NOT CASESPECIFIC collation not replicated
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Legacy comparisons use a case-insensitive collation for selected columns; default Spark strings
    do not.
  decision: Do not globally case-fold stored values; leave comparison collation as a documented gap.
  rationale: The pilot only projects text. Future joins, predicates and grouping need explicit collation
    decisions.
  risk: high
  verification: 'unverified: mixed-case comparisons, grouping and joins have not been ported or parity-tested'
  status: open
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - warehouse/teradata/bteq/bootstrap.sql
- id: A-006
  title: Keys and nullability are not transactional constraints
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Legacy unique primary index and NOT NULL reject writes; dbt data tests run after publication.
  decision: Use dbt unique/not_null tests, not a claim of transactional rejection.
  rationale: Normal pilot key parity is checked, but failed builds may already have published invalid
    data.
  risk: high
  verification: 'unverified: transactional duplicate/null-key rejection is not implemented'
  status: open
  sources:
  - warehouse/teradata/ddl/billing/00_tables.sql
  - lakehouse/dbt/models/silver/billing/schema.yml
