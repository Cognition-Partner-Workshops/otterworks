  - cron_entry:etl/crontab#06b1c260f55b
  ambiguity: The legacy document export runs at minute 18 hourly, while the new graph currently has no
    converted export implementation.
  decision: Expose a paused @hourly DAG containing one explicitly named no-op stub and no legacy replacement
