- id: A-039
  title: UTC logical date is the date before the run label
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: Airflow cron logical dates label interval starts; this need not be the wall-clock execution
    date.
