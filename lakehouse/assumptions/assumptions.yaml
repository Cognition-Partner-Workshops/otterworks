- id: A-045
  title: Backfill execution does not restore historical legacy state
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: The pilot PostgreSQL reader selects the current mutable CUSTOMER_ACCOUNT table, not an as-of
    snapshot.
  decision: Enable catchup/backfill, retaining date-partitioned bronze inputs, but require matching legacy
    oracle state or date-specific file specs for historical parity.
  rationale: A historical lakehouse run can execute correctly and still fail parity against a newer legacy
    snapshot. No automatic legacy reseeding is performed.
  risk: high
  verification: 'unverified: historical as-of PostgreSQL snapshots and multi-date end-to-end backfill
    parity are not available'
  status: open
  sources:
  - warehouse/teradata/jobs/crontab.example
  - warehouse/teradata/jobs/daily_chain
  - etl/crontab
  - lakehouse/orchestration/pipeline.yaml
- id: A-046
  title: Local Airflow metadata is not a production service
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: Production Airflow deployment, multi-worker filesystem visibility and operational alerting
    are out of scope.
  decision: Use a separate Python 3.12 venv with official Airflow 2.10.5 constraints, per-namespace SQLite
    metadata and SequentialExecutor for local DAG tests.
  rationale: Keeps Airflow dependencies isolated from dbt/PySpark. Airflow and Spark tasks require the
    same absolute repository/landing paths on this single host; no Docker deployment is added.
  risk: med
  verification: 'unverified: production scheduler, distributed workers, external metadata database and
    alert delivery have not been tested'
  status: open
  sources:
  - warehouse/teradata/jobs/crontab.example
  - warehouse/teradata/jobs/daily_chain
  - etl/crontab
  - lakehouse/orchestration/pipeline.yaml
- id: A-047
  title: Empty domain selectors do not imply domain conversion
  legacy_objects:
  - cron_entry:warehouse/teradata/jobs/daily_chain#stage=staging
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: Only billing currently has a dbt model, while every domain needs a stable orchestration extension
    point.
  decision: Seed tag-based dbt build tasks for all four domains. Empty selections succeed without creating
    models, and coverage for unconverted outputs stays pending.
  rationale: Models inherit domain tags and schema/location settings from their silver/gold directories
    and join the graph automatically. Cross-domain dependencies still require explicit graph edges.
  risk: low
  verification: test:lakehouse/tests/test_orchestration.py::test_pipeline_contract_and_staging_replacement
  status: accepted
  sources:
