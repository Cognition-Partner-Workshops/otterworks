  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: The legacy chain returns immediately after its first failed stage and has no built-in retry.
  decision: Retry seeded tasks once after ten seconds; exhausted tasks block their descendants while independent
    branches may finish. Both executors return a failed run if a task fails.
  rationale: Independent domain work need not be discarded because another branch fails. Existing ingestion
    and full-replacement pilot model are retry-safe; future exports must define idempotence.
