  title: Hive incompatible-type metadata check disabled
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Delta replacement triggered Hive's incompatible customer_id metadata check before Spark's
    successful fallback.
  decision: Set spark.hadoop.hive.metastore.disallow.incompatible.col.type.changes=false for the embedded
    metastore.
  rationale: Avoids a reproduced Hive-only compatibility error; Delta schema validation remains authoritative.
  risk: med
