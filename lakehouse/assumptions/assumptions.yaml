- id: A-407
  title: Business-date weekly archive with resumable publication and deletion
  legacy_objects:
  - etl_script:etl/scripts/audit_archive_weekly.py
  - cron_entry:etl/crontab#33854636d6ba
  ambiguity: Legacy uses UTC wall-clock midnight minus 90 days, nondeterministic gzip headers/report time,
    overwrites the weekly key, and swallows deletion failures.
  decision: Use BUSINESS_DATE midnight UTC minus 90 days with the same strict timestamp-string cutoff.
    Canonically sort JSONL and use deterministic gzip; report generated_at is business-date midnight.
    Compare decompressed event multisets and all report fields except generated_at/compressed_size_bytes
    against the frozen-clock legacy script. Publish Glacier first, then a conditional Standard manifest
    of immutable event keys and SHA256, then delete, then conditionally publish the report. Retry resumes
    the manifest without reading Glacier; an existing completed report is immutable. Require immutable
    DynamoDB event keys/content during archival and explicit bucket/owner configuration. New late arrivals
    for an already published business date wait for the next weekly run; a conflicting incomplete snapshot
    fails closed.
  rationale: Avoids partial-file exposure, silent deletion loss and needing Glacier restoration on retry;
    the safety improvement is deliberate, not hidden parity normalization. Extra manifests contain keys,
    not event payloads.
  risk: med
  verification: test:lakehouse/tests/test_audit_archive.py::test_archive_legacy_file_parity
  status: accepted
