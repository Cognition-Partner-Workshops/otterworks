  - lakehouse/runtime/dbt.py
  - lakehouse/dbt/profiles.yml
- id: A-033
  title: Dependency mirror and offline bootstrap limits
  legacy_objects:
  - batch_runner:warehouse/teradata/jobs/daily_chain
  ambiguity: Java Delta jars need a Maven endpoint; the standard endpoints returned HTTP 429 during bootstrap.
  decision: Use the Google Maven Central mirror as an additional configurable repository with pinned Spark/Delta
    dependencies.
  rationale: This is a reproducibility/runtime choice, not a transformation; first startup still needs
    network access or a warm cache.
  risk: low
  verification: 'unverified: fully offline and alternate-platform bootstrap has not been tested'
  status: accepted
  sources:
  - warehouse/README.md
  - lakehouse/runtime/session.py
  - lakehouse/requirements.txt
- id: A-034
  title: Spec trust, connection scope and read-only legacy SQL
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Specs contain executable SQL and paths; namespace names alone do not enforce database endpoint
    identity.
  decision: Treat specs as trusted repository code; connect via TD_PG_* with explicit values overriding
    DSN fields and use read-only PostgreSQL transactions.
  rationale: Matches documented legacy connection precedence while avoiding interpreter bootstrap mutations
    during comparison.
  risk: med
  verification: test:lakehouse/tests/test_parity.py::test_postgres_environment_precedence
  status: accepted
  sources:
  - warehouse/README.md
  - warehouse/teradata/bteq/runner.py
  - lakehouse/parity/readers.py
- id: A-035
  title: Comparison columns and filters may narrow the claim
  legacy_objects:
  - teradata_table:SFX_BILLING.CUSTOMER_ACCOUNT
  ambiguity: Common-column defaults and filters can omit schema-only differences or excluded records.
  decision: Default to common columns, require keys, normalize before symmetric equality/IN filters; pilot
    explicitly lists all nine output columns and has no filter.
  rationale: A parity PASS is scoped to the selected columns/rows, not automatically a schema or whole-estate
    proof.
  risk: med
  verification: test:lakehouse/tests/test_parity.py::test_null_and_empty_and_filters
  status: accepted
  sources:
