id: audit.stg_retention_policy
legacy_objects:
- teradata_table:SFX_AUDIT.STG_RETENTION_POLICY
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_retention_policy
lakehouse:
  kind: spark_sql
  sql: select cast(policy_id as bigint) as policy_id, substring(policy_name, 1, 200) as policy_name, cast(retention_days
    as int) as retention_days, cast(effective_dt as date) as effective_dt, substring(status_cd, 1, 200)
    as status_cd from bronze_audit.retention_policy where _business_date=to_date('{business_date}', 'yyyyMMdd')
keys:
- policy_id
columns:
- policy_id
- policy_name
- retention_days
- effective_dt
- status_cd
