id: audit.stg_access_review
legacy_objects:
- teradata_table:SFX_AUDIT.STG_ACCESS_REVIEW
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_access_review
lakehouse:
  kind: spark_sql
  sql: select cast(review_id as bigint) as review_id, cast(user_id as bigint) as user_id, cast(document_id
    as bigint) as document_id, cast(review_dt as date) as review_dt, substring(decision_cd, 1, 200) as
    decision_cd from bronze_audit.access_review where _business_date=to_date('{business_date}', 'yyyyMMdd')
keys:
- review_id
columns:
- review_id
- user_id
- document_id
- review_dt
- decision_cd
