- spark_job:audit_actor_activity_join
- spark_submit:etl/spark/submit/audit_actor_activity_join.sh
description: 'A-406: same Spark landing snapshot; Parquet/JDBC logical output replaced by Delta. Physical
  ordering and file layout are not relational outputs.'
legacy:
