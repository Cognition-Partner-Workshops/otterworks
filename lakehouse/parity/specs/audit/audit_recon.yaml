id: audit.audit_recon
legacy_objects:
- teradata_table:SFX_AUDIT.AUDIT_RECON
- bteq_script:warehouse/teradata/scripts/audit/03_load_reviews.bteq
- cron_entry:warehouse/teradata/jobs/daily_chain#stage=audit/03_load_reviews
- bteq_script:warehouse/teradata/scripts/audit/11_reconciliation.bteq
- cron_entry:warehouse/teradata/jobs/daily_chain#stage=audit/11_reconciliation
- teradata_procedure:SFX_AUDIT.P_RECON_COUNTS
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.audit_recon where recon_id <> 21000000001
lakehouse:
  kind: spark_sql
  sql: select * from gold_audit.audit_recon_final where recon_id <> 21000000001
keys:
- recon_id
columns:
- recon_id
- business_dt
- customer_id
- source_count
- target_count
- difference_count
normalize: {}
description: 'A-402: exclude only shared jobs/reconcile row 21000000001 on both sides. All audit-owned
  load and 37 generated count rows remain.'
