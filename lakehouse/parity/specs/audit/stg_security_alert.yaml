id: audit.stg_security_alert
legacy_objects:
- teradata_table:SFX_AUDIT.STG_SECURITY_ALERT
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_security_alert
lakehouse:
  kind: spark_sql
  sql: select cast(alert_id as bigint) as alert_id, cast(actor_user_id as bigint) as actor_user_id, cast(document_id
    as bigint) as document_id, date_trunc('second', cast(alert_ts as timestamp) + interval 500 milliseconds)
    as alert_ts, substring(severity_cd, 1, 200) as severity_cd, substring(status_cd, 1, 200) as status_cd
    from bronze_audit.security_alert where _business_date=to_date('{business_date}', 'yyyyMMdd')
keys:
- alert_id
columns:
- alert_id
- actor_user_id
- document_id
- alert_ts
- severity_cd
- status_cd
