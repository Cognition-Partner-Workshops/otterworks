id: audit.stg_audit_event_archive
legacy_objects:
- teradata_table:SFX_AUDIT.STG_AUDIT_EVENT_ARCHIVE
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_audit_event_archive
lakehouse:
  kind: spark_sql
  sql: select cast(archive_id as bigint) as archive_id, cast(actor_user_id as bigint) as actor_user_id,
    cast(document_id as bigint) as document_id, date_trunc('second', cast(event_ts as timestamp) + interval
    500 milliseconds) as event_ts, substring(event_type, 1, 200) as event_type, substring(details, 1,
    200) as details from bronze_audit.audit_event_archive where _business_date=to_date('{business_date}',
    'yyyyMMdd')
keys:
- archive_id
columns:
- archive_id
- actor_user_id
- document_id
- event_ts
- event_type
- details
