id: audit.stg_data_export_req
legacy_objects:
- teradata_table:SFX_AUDIT.STG_DATA_EXPORT_REQ
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_data_export_req
lakehouse:
  kind: spark_sql
  sql: select cast(export_id as bigint) as export_id, cast(user_id as bigint) as user_id, cast(customer_id
    as bigint) as customer_id, cast(request_dt as date) as request_dt, substring(status_cd, 1, 200) as
    status_cd, cast(row_count as bigint) as row_count from bronze_audit.data_export_req where _business_date=to_date('{business_date}',
    'yyyyMMdd')
keys:
- export_id
columns:
- export_id
- user_id
- customer_id
- request_dt
- status_cd
- row_count
