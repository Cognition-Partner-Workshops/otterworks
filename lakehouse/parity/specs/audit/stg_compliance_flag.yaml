id: audit.stg_compliance_flag
legacy_objects:
- teradata_table:SFX_AUDIT.STG_COMPLIANCE_FLAG
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_compliance_flag
lakehouse:
  kind: spark_sql
  sql: select cast(flag_id as bigint) as flag_id, cast(customer_id as bigint) as customer_id, cast(document_id
    as bigint) as document_id, substring(flag_type, 1, 200) as flag_type, cast(flag_dt as date) as flag_dt,
    substring(status_cd, 1, 200) as status_cd from bronze_audit.compliance_flag where _business_date=to_date('{business_date}',
    'yyyyMMdd')
keys:
- flag_id
columns:
- flag_id
- customer_id
- document_id
- flag_type
- flag_dt
- status_cd
