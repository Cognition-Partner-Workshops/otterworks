id: audit.reconciliation_export
legacy_objects:
- bteq_script:warehouse/teradata/scripts/audit/11_reconciliation.bteq
- teradata_macro:SFX_AUDIT.M_RECON_TOTALS
description: 'A-402: complete reconciliation population including shared jobs/reconcile
  row 21000000001; no ownership exclusions.'
legacy:
  kind: postgres_sql
  sql: select recon_id, source_count, target_count, difference_count from sfx_audit.audit_recon
    where business_dt=to_date('{business_date}', 'YYYYMMDD') order by recon_id
lakehouse:
  kind: file
  path: lakehouse/.data/{NS}/exports/{business_date}/reconciliation.psv
  delimiter: '|'
  header: false
  columns:
  - recon_id
  - source_count
  - target_count
  - difference_count
keys:
- recon_id
columns:
- recon_id
- source_count
- target_count
- difference_count
normalize:
  recon_id:
    numeric_scale: 0
  source_count:
    numeric_scale: 0
    empty_as_null: true
  target_count:
    numeric_scale: 0
    empty_as_null: true
  difference_count:
    numeric_scale: 0
    empty_as_null: true
