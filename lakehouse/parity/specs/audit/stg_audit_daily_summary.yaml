id: audit.stg_audit_daily_summary
legacy_objects:
- teradata_table:SFX_AUDIT.STG_AUDIT_DAILY_SUMMARY
legacy:
  kind: postgres_sql
  sql: select * from sfx_audit.stg_audit_daily_summary
lakehouse:
  kind: spark_sql
  sql: select cast(summary_id as bigint) as summary_id, cast(summary_dt as date) as summary_dt, cast(customer_id
    as bigint) as customer_id, cast(event_count as bigint) as event_count, cast(export_count as int) as
    export_count from bronze_audit.audit_daily_summary where _business_date=to_date('{business_date}',
    'yyyyMMdd')
keys:
- summary_id
columns:
- summary_id
- summary_dt
- customer_id
- event_count
- export_count
