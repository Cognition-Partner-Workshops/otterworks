id: documents.v_document_versions
legacy_objects:
  - teradata_view:SFX_DOCUMENTS.V_DOCUMENT_VERSIONS
comparison: candidates
legacy:
  kind: postgres_sql
  sql: |
    WITH latest AS (
      SELECT *, dense_rank() OVER (PARTITION BY document_id ORDER BY version_ts DESC NULLS FIRST) AS latest_rank
      FROM sfx_documents.stg_doc_version
    ), candidates AS (
      SELECT *, count(*) OVER (PARTITION BY document_id) AS candidate_count
      FROM latest WHERE latest_rank = 1
    ), legal_versions AS (
      SELECT v.version_id, v.document_id, v.version_no, v.version_ts, v.file_size, v.content_hash
      FROM sfx_documents.doc_version v
      JOIN candidates c ON c.document_id = v.document_id AND c.candidate_count = 1
      UNION ALL
      SELECT version_id, document_id, version_no, version_ts, file_size, substring(content_hash, 1, 64)
      FROM candidates WHERE candidate_count > 1
    )
    SELECT v.document_id, v.owner_user_id, v.version_id, v.version_ts, v.file_size
    FROM sfx_documents.v_document_versions v
    JOIN candidates c ON c.document_id = v.document_id AND c.candidate_count = 1
    UNION ALL
    SELECT v.document_id, d.owner_user_id, v.version_id, v.version_ts, v.file_size
    FROM legal_versions v JOIN sfx_documents.document d USING(document_id)
    WHERE EXISTS (SELECT 1 FROM candidates c WHERE c.document_id = v.document_id AND c.candidate_count > 1)
lakehouse:
  kind: delta_table
  table: gold_documents.v_document_versions
keys: [document_id]
columns: [document_id, owner_user_id, version_id, version_ts, file_size]
