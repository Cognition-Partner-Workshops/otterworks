id: users.stg_login_event
legacy_objects:
  - teradata_table:SFX_USERS.STG_LOGIN_EVENT
legacy:
  kind: postgres_sql
  sql: SELECT * FROM sfx_users.stg_login_event
lakehouse:
  kind: spark_sql
  sql: >-
    SELECT CAST(login_id AS bigint) AS login_id, CAST(user_id AS bigint) AS user_id, CAST(login_ts AS timestamp) AS login_ts, CAST(result_cd AS string) AS result_cd, CAST(client_type AS string) AS client_type
    FROM bronze_users.login_event WHERE _business_date = to_date('{business_date}', 'yyyyMMdd')
keys: [login_id]
columns: [login_id, user_id, login_ts, result_cd, client_type]
