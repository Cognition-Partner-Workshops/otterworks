id: users.stg_user_profile
legacy_objects:
  - teradata_table:SFX_USERS.STG_USER_PROFILE
legacy:
  kind: postgres_sql
  sql: SELECT * FROM sfx_users.stg_user_profile
lakehouse:
  kind: spark_sql
  sql: >-
    SELECT CAST(profile_id AS bigint) AS profile_id, CAST(user_id AS bigint) AS user_id, CAST(title AS string) AS title, CAST(country_cd AS string) AS country_cd, CAST(timezone AS string) AS timezone
    FROM bronze_users.user_profile WHERE _business_date = to_date('{business_date}', 'yyyyMMdd')
keys: [profile_id]
columns: [profile_id, user_id, title, country_cd, timezone]
